:[6,9,6,9],&quot;v&quot;:[5.6,9,5.6,9],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Perhatian tinggi pada hasil dan pada orang: tujuan jelas, partisipasi dan komitmen anggota tinggi, saling percaya.&quot;,&quot;ex&quot;:&quot;Kepala unit yang menetapkan target layanan bersama tim dan mendampingi anggota yang kesulitan.&quot;},{&quot;k&quot;:&quot;auth&quot;,&quot;en&quot;:&quot;Authority–Compliance&quot;,&quot;name&quot;:&quot;Authority–Compliance&quot;,&quot;tag&quot;:&quot;(9,1) · otoritas–kepatuhan&quot;,&quot;r&quot;:[6,9,0,6],&quot;v&quot;:[5.6,9,0,3.4],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Fokus berat pada hasil; orang dipandang sebagai alat. Komunikasi satu arah, mengendalikan, menuntut.&quot;,&quot;ex&quot;:&quot;Pemilik usaha yang hanya bicara target harian dan tidak pernah menanyakan kondisi karyawan.&quot;},{&quot;k&quot;:&quot;club&quot;,&quot;en&quot;:&quot;Country-Club&quot;,&quot;name&quot;:&quot;Country-Club Management&quot;,&quot;tag&quot;:&quot;(1,9) · klub santai&quot;,&quot;r&quot;:[0,6,6,9],&quot;v&quot;:[0,3.4,5.6,9],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Perhatian rendah pada hasil, tinggi pada hubungan: suasana nyaman diutamakan, konflik dihindari, target sering lewat.&quot;,&quot;ex&quot;:&quot;Ketua organisasi yang selalu mengiyakan anggota sehingga program kerja tidak tuntas.&quot;},{&quot;k&quot;:&quot;imp&quot;,&quot;en&quot;:&quot;Impoverished&quot;,&quot;name&quot;:&quot;Impoverished Management&quot;,&quot;tag&quot;:&quot;(1,1) · minimal&quot;,&quot;r&quot;:[0,6,0,6],&quot;v&quot;:[0,3.4,0,3.4],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Tidak peduli hasil maupun orang; sekadar menjalankan jabatan dan menghindari keterlibatan.&quot;,&quot;ex&quot;:&quot;Koordinator yang jarang hadir dan tidak menanggapi pesan anggota.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.4em\">Lima gaya utama Leadership Grid (Blake &amp; Mouton), diadaptasi dari Northouse (2025). Batas zona adalah penyederhanaan untuk simulasi; contoh oleh dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pendekatan situasional</span><span>Indikator 1 dan 2</span></div><h2>Gaya disesuaikan dengan anggota</h2><div class=\"cols wq\"><div><figure class=\"fig\"><svg viewBox=\"0 0 640 328\" style=\"max-height:15em\" role=\"img\" aria-label=\"Empat gaya kepemimpinan situasional pada dua sumbu, perilaku mengarahkan dan perilaku mendukung. Kanan bawah S1 Directing: mengarahkan tinggi, mendukung rendah. Kanan atas S2 Coaching: keduanya tinggi. Kiri atas S3 Supporting: mendukung tinggi, mengarahkan rendah. Kiri bawah S4 Delegating: keduanya rendah. Di bawahnya tingkat perkembangan anggota dari kiri ke kanan: D4 kompetensi dan komitmen tinggi, D3 kompetensi sedang sampai tinggi dengan komitmen naik-turun, D2 kompetensi sebagian dengan komitmen rendah, D1 kompetensi rendah dengan komitmen tinggi. Pasangan yang cocok: D1 dengan S1, D2 dengan S2, D3 dengan S3, D4 dengan S4.\"><defs><marker id=\"sl\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"160\" y=\"10\" width=\"225\" height=\"94\" rx=\"8\" class=\"s-acc\"/><text x=\"272\" y=\"48\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">S3 · Supporting</text><text x=\"272\" y=\"70\" text-anchor=\"middle\" class=\"s-s\">mendukung tinggi</text><text x=\"272\" y=\"88\" text-anchor=\"middle\" class=\"s-s\">mengarahkan rendah</text><rect x=\"395\" y=\"10\" width=\"225\" height=\"94\" rx=\"8\" class=\"s-acc\"/><text x=\"507\" y=\"48\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">S2 · Coaching</text><text x=\"507\" y=\"70\" text-anchor=\"middle\" class=\"s-s\">mengarahkan tinggi</text><text x=\"507\" y=\"88\" text-anchor=\"middle\" class=\"s-s\">mendukung tinggi</text><rect x=\"160\" y=\"112\" width=\"225\" height=\"94\" rx=\"8\" class=\"s-box\"/><text x=\"272\" y=\"150\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">S4 · Delegating</text><text x=\"272\" y=\"172\" text-anchor=\"middle\" class=\"s-s\">mengarahkan rendah</text><text x=\"272\" y=\"190\" text-anchor=\"middle\" class=\"s-s\">mendukung rendah</text><rect x=\"395\" y=\"112\" width=\"225\" height=\"94\" rx=\"8\" class=\"s-box\"/><text x=\"507\" y=\"150\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">S1 · Directing</text><text x=\"507\" y=\"172\" text-anchor=\"middle\" class=\"s-s\">mengarahkan tinggi</text><text x=\"507\" y=\"190\" text-anchor=\"middle\" class=\"s-s\">mendukung rendah</text><line x1=\"150\" y1=\"212\" x2=\"630\" y2=\"212\" class=\"s-line\" marker-end=\"url(#sl)\"/><text x=\"390\" y=\"232\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">perilaku mengarahkan (directive) →</text><line x1=\"148\" y1=\"212\" x2=\"148\" y2=\"8\" class=\"s-line\" marker-end=\"url(#sl)\"/><text transform=\"translate(132 110) rotate(-90)\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">perilaku mendukung (supportive) →</text><rect x=\"160\" y=\"248\" width=\"110\" height=\"74\" rx=\"6\" class=\"s-soft\"/><text x=\"215\" y=\"270\" text-anchor=\"middle\" class=\"s-hd\">D4</text><text x=\"215\" y=\"290\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">kompeten tinggi</text><text x=\"215\" y=\"308\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">komitmen tinggi</text><rect x=\"277.5\" y=\"248\" width=\"110\" height=\"74\" rx=\"6\" class=\"s-soft\"/><text x=\"332.5\" y=\"270\" text-anchor=\"middle\" class=\"s-hd\">D3</text><text x=\"332.5\" y=\"290\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">cukup kompeten</text><text x=\"332.5\" y=\"308\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">komitmen naik-turun</text><rect x=\"395\" y=\"248\" width=\"110\" height=\"74\" rx=\"6\" class=\"s-soft\"/><text x=\"450\" y=\"270\" text-anchor=\"middle\" class=\"s-hd\">D2</text><text x=\"450\" y=\"290\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">sebagian kompeten</text><text x=\"450\" y=\"308\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">komitmen rendah</text><rect x=\"512.5\" y=\"248\" width=\"110\" height=\"74\" rx=\"6\" class=\"s-soft\"/><text x=\"567.5\" y=\"270\" text-anchor=\"middle\" class=\"s-hd\">D1</text><text x=\"567.5\" y=\"290\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">kompeten rendah</text><text x=\"567.5\" y=\"308\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">komitmen tinggi</text><text x=\"10\" y=\"276\" class=\"s-hd\">ANGGOTA</text><text x=\"10\" y=\"296\" class=\"s-s\" style=\"font-size:12px\">tingkat</text><text x=\"10\" y=\"312\" class=\"s-s\" style=\"font-size:12px\">perkembangan</text></svg><figcaption>Model kepemimpinan situasional (SLII, Blanchard), diadaptasi dari Northouse (2025). Gaya yang cocok berada tepat di atas tingkat perkembangan anggota: D1–S1, D2–S2, D3–S3, D4–S4.</figcaption></figure></div><div class=\"card hl\" style=\"font-size:.92em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Dua langkah</h3><ol><li>Diagnosis <button type=\"button\" class=\"term\" data-term=\"development-level\">tingkat perkembangan</button> anggota untuk <b>tugas tertentu</b>.</li><li>Pakai gaya yang cocok, lalu ubah saat anggota berkembang.</li></ol><p class=\"muted\" style=\"font-size:.88em\">Satu orang bisa D4 untuk desain, tetapi D1 untuk laporan keuangan.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario interaktif</span><span>Anda ketua tim</span></div><h2>Satu tim, empat anggota</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;kmo6-situasi&quot;,&quot;start&quot;:&quot;s1&quot;,&quot;ask&quot;:&quot;Gaya apa yang Anda pakai untuk anggota ini?&quot;,&quot;nodes&quot;:{&quot;s1&quot;:{&quot;text&quot;:&quot;Anda ketua tim HIMA yang membuat website profil desa binaan (kasus ilustrasi). Anggota pertama: Rina, mahasiswa semester 1.&quot;,&quot;say&quot;:[[&quot;Rina&quot;,&quot;Saya semangat banget, Kak! Tapi jujur saya belum pernah bikin website.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Beri langkah demi langkah, contoh, dan cek hasilnya setiap hari.&quot;,&quot;tag&quot;:&quot;Rina · S1 Directing&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;fb&quot;:&quot;Tepat. Rina D1 (kompetensi rendah, komitmen tinggi): ia butuh arahan jelas, bukan sekadar semangat.&quot;},{&quot;t&quot;:&quot;Bebaskan Rina menentukan caranya sendiri; yang penting selesai minggu depan.&quot;,&quot;tag&quot;:&quot;Rina · S4 Delegating&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;fb&quot;:&quot;Kurang tepat. Tanpa arahan, Rina kemungkinan gagal dan semangatnya turun.&quot;},{&quot;t&quot;:&quot;Ajak mengobrol dan beri semangat, tanpa instruksi teknis.&quot;,&quot;tag&quot;:&quot;Rina · S3 Supporting&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;fb&quot;:&quot;Semangat Rina sudah tinggi; yang ia butuhkan adalah petunjuk teknis.&quot;}]},&quot;s2&quot;:{&quot;text&quot;:&quot;Anggota kedua: Sari. Sudah tiga minggu belajar dan bisa membuat halaman sederhana, tetapi sering error.&quot;,&quot;say&quot;:[[&quot;Sari&quot;,&quot;Kayaknya saya memang nggak bakat coding, Kak.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Tetap beri arahan teknis, dengarkan keluhannya, puji kemajuannya, dan minta idenya.&quot;,&quot;tag&quot;:&quot;Sari · S2 Coaching&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;fb&quot;:&quot;Tepat. Sari D2 (kompetensi sebagian, komitmen turun): ia butuh arahan sekaligus dukungan.&quot;},{&quot;t&quot;:&quot;Kirim daftar perbaikan error tanpa komentar lain.&quot;,&quot;tag&quot;:&quot;Sari · S1 Directing&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;fb&quot;:&quot;Arahannya benar, tetapi tanpa dukungan komitmen Sari tetap turun.&quot;},{&quot;t&quot;:&quot;Serahkan halaman itu sepenuhnya kepada Sari agar ia belajar mandiri.&quot;,&quot;tag&quot;:&quot;Sari · S4 Delegating&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;fb&quot;:&quot;Kurang tepat. Sari sedang kecewa dan belum mampu; dilepas begitu saja bisa membuatnya berhenti.&quot;}]},&quot;s3&quot;:{&quot;text&quot;:&quot;Anggota ketiga: Dodi. Sudah dua kali membuat website desa dan mampu, tetapi ragu sejak desainnya dikritik perangkat desa.&quot;,&quot;say&quot;:[[&quot;Dodi&quot;,&quot;Terserah Kakak saja deh desainnya.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Dengarkan, yakinkan bahwa ia mampu, lalu minta Dodi yang memutuskan desain.&quot;,&quot;tag&quot;:&quot;Dodi · S3 Supporting&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;fb&quot;:&quot;Tepat. Dodi D3 (mampu, komitmen naik-turun): ia butuh dukungan dan kepercayaan, bukan instruksi.&quot;},{&quot;t&quot;:&quot;Atur sendiri warna, huruf, dan tata letaknya, lalu minta Dodi mengerjakan.&quot;,&quot;tag&quot;:&quot;Dodi · S1 Directing&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;fb&quot;:&quot;Kurang tepat. Mengatur detail membuat Dodi merasa tidak dipercaya; keraguannya makin besar.&quot;},{&quot;t&quot;:&quot;Beri arahan desain rinci sambil memberi semangat.&quot;,&quot;tag&quot;:&quot;Dodi · S2 Coaching&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;s4&quot;,&quot;fb&quot;:&quot;Dukungannya baik, tetapi arahan rinci tidak dibutuhkan orang yang sudah mampu.&quot;}]},&quot;s4&quot;:{&quot;text&quot;:&quot;Anggota keempat: Mbak Lia, alumni yang bekerja sebagai web developer dan membantu sebagai mentor.&quot;,&quot;say&quot;:[[&quot;Mbak Lia&quot;,&quot;Bagian server dan keamanan biar saya yang pegang ya.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Serahkan bagian itu kepada Mbak Lia; cukup sepakati target dan waktu laporan.&quot;,&quot;tag&quot;:&quot;Lia · S4 Delegating&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;end&quot;,&quot;fb&quot;:&quot;Tepat. Mbak Lia D4 (kompetensi dan komitmen tinggi): delegasikan dan percayai.&quot;},{&quot;t&quot;:&quot;Minta laporan harian dan setujui setiap konfigurasi server.&quot;,&quot;tag&quot;:&quot;Lia · S1 Directing&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;end&quot;,&quot;fb&quot;:&quot;Kurang tepat. Pengawasan rinci untuk orang yang ahli terasa sebagai tidak percaya dan membuang waktu.&quot;},{&quot;t&quot;:&quot;Dampingi setiap langkahnya sambil memberi semangat.&quot;,&quot;tag&quot;:&quot;Lia · S2 Coaching&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;end&quot;,&quot;fb&quot;:&quot;Niatnya baik, tetapi pendampingan rinci tidak dibutuhkan anggota D4.&quot;}]},&quot;end&quot;:{&quot;end&quot;:&quot;Lihat jejak pilihan di atas. Pasangan yang dianjurkan: Rina (D1) – S1, Sari (D2) – S2, Dodi (D3) – S3, Mbak Lia (D4) – S4. Satu tim, empat gaya.&quot;,&quot;title&quot;:&quot;Selesai: cek jejak pilihan Anda&quot;,&quot;k&quot;:&quot;mid&quot;}}}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.4em\">Kasus ilustrasi. Pasangan gaya menurut SLII, diadaptasi dari Northouse (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Transformasional</span><span>Indikator 1</span></div><h2>Menggerakkan, bukan hanya menukar</h2><div class=\"grid4\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Idealized influence</h3><p>Teladan bermoral yang dihormati dan dipercaya.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Inspirational motivation</h3><p>Visi yang jelas dan harapan tinggi.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Intellectual stimulation</h3><p>Mengajak berpikir kritis dan mencoba cara baru.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Individualized consideration</h3><p>Memperhatikan kebutuhan tiap anggota.</p></div></div><div class=\"cols\" style=\"margin-top:.6em\"><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"transactional-leadership\">Transaksional</button></b>: imbalan untuk kinerja (<i>contingent reward</i>), koreksi saat menyimpang (<i>management-by-exception</i>).</p></div><div class=\"card warn\"><p><b><button type=\"button\" class=\"term\" data-term=\"laissez-faire\">Laissez-faire</button></b>: lepas tangan, tidak memberi arah atau umpan balik.</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Empat faktor <button type=\"button\" class=\"term\" data-term=\"transformational-leadership\">kepemimpinan transformasional</button> dan rentang kepemimpinan (Bass, 1985), diadaptasi dari Northouse (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kasus</span><span>Kasus ilustrasi · indikator 1 dan 2</span></div><h2>Dua kepala UPT TIK</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Pak Anwar</h3><ul><li>Insentif bulanan bagi teknisi yang menutup tiket terbanyak.</li><li>Menegur teknisi yang melewati tenggat.</li><li>Jarang hadir di luar rapat bulanan.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Bu Laila</h3><ul><li>Menjelaskan visi \"layanan kampus tanpa antre\".</li><li>Meminta teknisi mengusulkan otomatisasi.</li><li>Ikut lembur saat migrasi server; tahu kelebihan tiap anggota.</li></ul></div></div><div class=\"card hl\" style=\"margin-top:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Analisis berpasangan</h3><ol><li>Unsur transaksional dan transformasional mana yang tampak?</li><li>Di mana posisi keduanya di Leadership Grid?</li><li>Basis kekuasaan apa yang dominan?</li></ol></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Refleksi gaya diri</span><span>Formatif · hanya di perangkat Anda</span></div><h2>Seperti apa saya saat memimpin?</h2><div class=\"sim sim-gaya\" data-sim=\"gaya\" data-cfg=\"{&quot;id&quot;:&quot;kmo6-gaya&quot;,&quot;xLabel&quot;:&quot;Perilaku tugas&quot;,&quot;yLabel&quot;:&quot;Perilaku hubungan&quot;,&quot;wait&quot;:&quot;Pilih 1–5 untuk setiap pernyataan.&quot;,&quot;levels&quot;:[&quot;Hampir tidak pernah&quot;,&quot;Jarang&quot;,&quot;Kadang-kadang&quot;,&quot;Sering&quot;,&quot;Hampir selalu&quot;],&quot;items&quot;:[{&quot;k&quot;:&quot;t&quot;,&quot;t&quot;:&quot;Saya membuat rencana dan pembagian tugas yang jelas sebelum tim mulai bekerja.&quot;},{&quot;k&quot;:&quot;r&quot;,&quot;t&quot;:&quot;Saya menanyakan kabar dan kesulitan anggota tim.&quot;},{&quot;k&quot;:&quot;t&quot;,&quot;t&quot;:&quot;Saya menetapkan target dan tenggat yang terukur.&quot;},{&quot;k&quot;:&quot;r&quot;,&quot;t&quot;:&quot;Saya meminta pendapat anggota sebelum mengambil keputusan.&quot;},{&quot;k&quot;:&quot;t&quot;,&quot;t&quot;:&quot;Saya memeriksa kemajuan pekerjaan secara berkala.&quot;},{&quot;k&quot;:&quot;r&quot;,&quot;t&quot;:&quot;Saya memberi apresiasi saat anggota bekerja dengan baik.&quot;}],&quot;zones&quot;:[{&quot;k&quot;:&quot;mid&quot;,&quot;lab&quot;:&quot;(5,5)&quot;,&quot;name&quot;:&quot;Seimbang di tengah&quot;,&quot;en&quot;:&quot;Middle-of-the-Road&quot;,&quot;r&quot;:[3.7,6.3,3.7,6.3],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Tugas dan hubungan sama-sama sedang. Tingkatkan satu perilaku tugas dan satu perilaku hubungan.&quot;},{&quot;k&quot;:&quot;team&quot;,&quot;lab&quot;:&quot;(9,9)&quot;,&quot;name&quot;:&quot;Tugas dan orang tinggi&quot;,&quot;en&quot;:&quot;Team&quot;,&quot;r&quot;:[5,9,5,9],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Anda menjaga hasil sekaligus orang. Tetap sesuaikan gaya dengan anggota (ingat SLII).&quot;},{&quot;k&quot;:&quot;auth&quot;,&quot;lab&quot;:&quot;(9,1)&quot;,&quot;name&quot;:&quot;Tugas tinggi, orang rendah&quot;,&quot;en&quot;:&quot;Authority–Compliance&quot;,&quot;r&quot;:[5,9,1,5],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Kuat merencanakan dan menagih hasil. Latih: tanyakan kesulitan anggota, beri apresiasi.&quot;},{&quot;k&quot;:&quot;club&quot;,&quot;lab&quot;:&quot;(1,9)&quot;,&quot;name&quot;:&quot;Orang tinggi, tugas rendah&quot;,&quot;en&quot;:&quot;Country-Club&quot;,&quot;r&quot;:[1,5,5,9],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Kuat menjaga suasana. Latih: target terukur, pembagian peran, cek kemajuan.&quot;},{&quot;k&quot;:&quot;low&quot;,&quot;lab&quot;:&quot;(1,1)&quot;,&quot;name&quot;:&quot;Tugas dan orang rendah&quot;,&quot;en&quot;:&quot;Impoverished&quot;,&quot;r&quot;:[1,5,1,5],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Mulai dari satu kebiasaan: rencana kerja singkat dan sapaan rutin kepada anggota.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.76em;margin-top:.3em\">Pernyataan disusun dosen, bukan instrumen baku; skor dan zona disederhanakan dari Leadership Grid (Northouse, 2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi kelompok</span><span>Kelompok Tugas 1 · 22 menit · indikator 2</span></div><h2>Lensa untuk membaca pimpinan mitra</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Lensa</th><th>Pertanyaan untuk pimpinan atau anggota</th></tr></thead><tbody><tr><td>Kekuasaan</td><td>Mengapa anggota mengikuti arahan pimpinan?</td></tr><tr><td>Sifat</td><td>Sifat apa yang paling sering disebut anggota? Apa buktinya?</td></tr><tr><td>Perilaku</td><td>Bagaimana pimpinan membagi tugas? Apa yang ia lakukan saat anggota kesulitan?</td></tr><tr><td>Situasional</td><td>Apakah cara memimpin anggota baru berbeda dengan anggota senior?</td></tr><tr><td>Transformasional</td><td>Bagaimana pimpinan menggerakkan anggota: visi, teladan, atau imbalan?</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Langkah</h3><ol><li>Kumpulkan catatan tentang pimpinan dari wawancara P4–5.</li><li>Tulis minimal 3 perilaku konkret pimpinan.</li><li>Pilih lensa yang paling menjelaskan; beri dugaan gayanya.</li><li>Rencanakan wawancara pimpinan dan 1 anggota.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Kepemimpinan</b> = proses memengaruhi kelompok menuju tujuan bersama; sumbernya lima basis <b>kekuasaan</b>.</li><li><b>Sifat</b>: siapa pemimpinnya. <b>Perilaku</b>: apa yang ia lakukan (tugas dan hubungan).</li><li><b>Situasional</b>: gaya S1–S4 disesuaikan dengan tingkat perkembangan D1–D4.</li><li><b>Transformasional</b>: teladan, visi, stimulasi intelektual, perhatian individual; melengkapi transaksional.</li><li>Gaya pimpinan mitra disimpulkan dari <b>perilaku konkret</b>, bukan kesan.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · satu per satu</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;kmo6-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Kepala bagian memberi bonus kepada staf yang mencapai target bulanan dan menegur yang tidak. Perilaku ini paling dekat dengan kepemimpinan…&quot;,&quot;o&quot;:[&quot;transformasional&quot;,&quot;laissez-faire&quot;,&quot;transaksional&quot;,&quot;servant&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Imbalan untuk kinerja (contingent reward) dan koreksi saat menyimpang (management-by-exception) adalah ciri kepemimpinan transaksional.&quot;},{&quot;q&quot;:&quot;Rekan kerja selalu menuruti saran Andi karena Andi paling paham server kantor, padahal jabatan mereka setara. Basis kekuasaan Andi adalah…&quot;,&quot;o&quot;:[&quot;legitimate&quot;,&quot;expert&quot;,&quot;reward&quot;,&quot;coercive&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Pengaruh yang berasal dari keahlian adalah expert power, termasuk kekuasaan pribadi.&quot;},{&quot;q&quot;:&quot;Anggota baru sangat bersemangat, tetapi belum punya keterampilan untuk tugasnya. Menurut kepemimpinan situasional, gaya yang cocok adalah…&quot;,&quot;o&quot;:[&quot;S1 Directing&quot;,&quot;S2 Coaching&quot;,&quot;S3 Supporting&quot;,&quot;S4 Delegating&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Anggota D1 (kompetensi rendah, komitmen tinggi) membutuhkan arahan jelas: S1 Directing.&quot;},{&quot;q&quot;:&quot;Ketua organisasi selalu menjaga suasana nyaman dan menghindari konflik, tetapi program kerja jarang tuntas. Dalam Leadership Grid, gayanya dekat dengan…&quot;,&quot;o&quot;:[&quot;Authority–Compliance&quot;,&quot;Team Management&quot;,&quot;Impoverished Management&quot;,&quot;Country-Club Management&quot;],&quot;a&quot;:3,&quot;why&quot;:&quot;Perhatian tinggi pada orang dan rendah pada hasil adalah Country-Club Management (1,9).&quot;},{&quot;q&quot;:&quot;Pendekatan yang berfokus pada apa yang dilakukan pemimpin, yaitu perilaku tugas dan perilaku hubungan, adalah…&quot;,&quot;o&quot;:[&quot;pendekatan sifat&quot;,&quot;pendekatan transformasional&quot;,&quot;pendekatan perilaku&quot;,&quot;pendekatan situasional&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Pendekatan perilaku (style approach) mengamati perilaku pemimpin; pendekatan sifat mengamati pribadinya.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1C di Elin)</h3><ul><li>Wawancarai pimpinan mitra dan minimal 1 anggota.</li><li>Analisis gaya pimpinan dengan minimal 3 perilaku konkret.</li><li>Susun laporan Tugas 1C (kepemimpinan + kesimpulan terpadu) dan slide presentasi (7 menit + 3 menit tanya jawab).</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab servant leadership dan authentic leadership dalam Northouse (2025), persiapan Pertemuan 7.</p></div></div><p class=\"muted\" style=\"margin-top:.8em\">Tenggat Tugas 1A, 1B, dan 1C: Rabu, 4 November 2026, 23.59 WIB di Elin. Presentasi di Pertemuan 7.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Leadership</span></dt><dd>Proses ketika seseorang memengaruhi sekelompok orang untuk mencapai tujuan bersama. <i>(kepemimpinan)</i></dd></div><div><dt><span class=\"en\">Power</span></dt><dd>Kapasitas atau potensi untuk memengaruhi sikap, keyakinan, dan tindakan orang lain. <i>(kekuasaan)</i></dd></div><div><dt><span class=\"en\">Position power</span></dt><dd>Kekuasaan yang berasal dari jabatan atau posisi seseorang dalam organisasi. <i>(kekuasaan posisi)</i></dd></div><div><dt><span class=\"en\">Personal power</span></dt><dd>Kekuasaan yang berasal dari diri pemimpin karena ia disukai dan dianggap cakap oleh pengikut. <i>(kekuasaan pribadi)</i></dd></div><div><dt><span class=\"en\">Trait approach</span></dt><dd>Pendekatan yang menjelaskan kepemimpinan dari sifat pribadi pemimpin, mis. kecerdasan, percaya diri, integritas. <i>(pendekatan sifat)</i></dd></div><div><dt><span class=\"en\">Behavioral (style) approach</span></dt><dd>Pendekatan yang berfokus pada apa yang dilakukan pemimpin: perilaku tugas dan perilaku hubungan. <i>(pendekatan perilaku)</i></dd></div><div><dt><span class=\"en\">Task behavior</span></dt><dd>Perilaku pemimpin yang membantu anggota mencapai tujuan: menetapkan target, mengatur kerja, memeriksa hasil. <i>(perilaku tugas)</i></dd></div><div><dt><span class=\"en\">Relationship behavior</span></dt><dd>Perilaku pemimpin yang membuat anggota nyaman dengan diri, rekan, dan situasi kerjanya. <i>(perilaku hubungan)</i></dd></div><div><dt><span class=\"en\">Leadership Grid</span></dt><dd>Model Blake dan Mouton yang memetakan gaya pemimpin pada dua sumbu: perhatian pada hasil dan perhatian pada orang. <i>(kisi kepemimpinan)</i></dd></div><div><dt><span class=\"en\">Situational leadership</span></dt><dd>Pendekatan yang menyesuaikan gaya pemimpin dengan tingkat perkembangan anggota pada tugas tertentu. <i>(kepemimpinan situasional)</i></dd></div><div><dt><span class=\"en\">Development level</span></dt><dd>Tingkat kompetensi dan komitmen anggota untuk satu tugas tertentu (D1–D4). <i>(tingkat perkembangan)</i></dd></div><div><dt><span class=\"en\">Transformational leadership</span></dt><dd>Kepemimpinan yang menggerakkan pengikut melampaui kepentingan diri lewat teladan, visi, tantangan berpikir, dan perhatian pribadi. <i>(kepemimpinan transformasional)</i></dd></div><div><dt><span class=\"en\">Transactional leadership</span></dt><dd>Kepemimpinan berbasis pertukaran: imbalan untuk kinerja, koreksi untuk penyimpangan. <i>(kepemimpinan transaksional)</i></dd></div><div><dt><span class=\"en\">Laissez-faire</span></dt><dd>Ketiadaan kepemimpinan: pemimpin menghindari keputusan dan tanggung jawab, tidak memberi arah atau umpan balik. <i>(kepemimpinan lepas tangan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Northouse, P. G. (2025). <i>Leadership: Theory and practice</i> (10th ed.). SAGE Publications.</li><li>Yukl, G. A., &amp; Gardner, W. L. (2020). <i>Leadership in organizations</i> (9th ed.). Pearson.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 7.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":7,"title":"Kepemimpinan Berbasis Nilai","subtitle":"Servant dan authentic leadership, shiddiq, amanah, tabligh, fathanah · presentasi Tugas 1","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 7</span><span>Kepemimpinan dan Manajemen Organisasi · SI24W20</span></div><h1>Kepemimpinan Berbasis Nilai</h1><p class=\"lead\">Servant dan authentic leadership, shiddiq, amanah, tabligh, fathanah · presentasi Tugas 1</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 6–7 · Sub-CPMK-4</div><div><b>Hari ini</b>Nilai dalam kepemimpinan + presentasi Tugas 1</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menerapkan teori dan gaya kepemimpinan, termasuk kepemimpinan berbasis nilai, pada kasus organisasi (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1, 3, dan 4)</span></h3><ol><li>Ketepatan membedakan pendekatan sifat, perilaku, situasional, transformasional, dan servant leadership.</li><li>Ketepatan mengidentifikasi gaya kepemimpinan pimpinan organisasi mitra. <span class=\"muted\">(Pertemuan 6)</span></li><li>Ketepatan mengaitkan kepemimpinan dengan nilai shiddiq, amanah, tabligh, dan fathanah.</li><li>Kualitas presentasi hasil analisis.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-2</dt><dd>Mahasiswa mampu menerapkan kepemimpinan berbasis nilai (jujur, amanah, adil, dan kolaboratif) dalam memimpin tim dan perubahan.</dd><dt>CPL-1</dt><dd class=\"id\">Mampu mengintegrasikan sikap As Shidqu (kejujuran), Al Amanah Wal Wafa Bil Ahdi (bertanggung jawab), Al Adalah (selalu berpedoman pada norma dan peraturan yang berlaku) dan At Taawun (berkolaborasi) dalam perkembangan ilmu pengetahuan dan teknologi.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Proyek (Tugas 1: 10%) dan Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 6 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Apa beda pendekatan sifat dan pendekatan perilaku?</li><li>Anggota sudah mampu tetapi ragu. Gaya SLII apa yang cocok?</li><li>Sebutkan empat faktor kepemimpinan transformasional.</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Slide presentasi sudah siap?</li><li>Ada minimal 3 perilaku konkret pimpinan mitra?</li><li>Sudah tahu urutan tampil?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>2 menit · angkat tangan</span></div><h2>Melayani atau dilayani?</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Ketua A</h3><p>Datang paling awal, ikut menata kursi, terakhir makan, menanyakan anggota yang belum kebagian tugas.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Ketua B</h3><p>Datang saat acara dimulai, duduk di kursi depan, menunggu laporan, menegur bila ada yang kurang.</p></div></div><div class=\"callout\" style=\"margin-top:.7em\">Ketua mana yang ingin Anda ikuti? Mengapa? Apakah Ketua B pasti pemimpin yang buruk?</div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Servant leadership</span><span>Indikator 1</span></div><h2>Melayani dahulu, lalu memimpin</h2><div class=\"cols wr\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The servant-leader is servant first. It begins with the natural feeling that one wants to serve, to serve first. Then conscious choice brings one to aspire to lead.\"</p><p class=\"tr\">\"Pemimpin-pelayan adalah pelayan terlebih dahulu. Hal itu dimulai dengan perasaan alami bahwa seseorang ingin melayani, melayani terlebih dahulu. Kemudian pilihan sadar membawa seseorang untuk bercita-cita memimpin.\"</p><div class=\"src\">Greenleaf (1970), dikutip dalam Northouse (2025); terjemahan harfiah penyusun</div></blockquote></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Inti servant leadership</h3><ul><li><b>Fokus</b>: kebutuhan dan pertumbuhan pengikut didahulukan.</li><li><b>Paradoks</b>: memengaruhi dengan cara melayani.</li><li><b>Ukuran berhasil</b>: pengikut tumbuh, makin mandiri, dan ikut melayani.</li><li><b>Lebih luas</b>: memperhatikan masyarakat dan pihak yang lemah.</li></ul></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\"><button type=\"button\" class=\"term\" data-term=\"servant-leadership\">Servant leadership</button>, diadaptasi dari Northouse (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Servant leadership</span><span>Indikator 1 dan 3</span></div><h2>Sepuluh ciri pemimpin-pelayan</h2><div class=\"grid5\" style=\"font-size:.86em\"><div class=\"card\" style=\"padding:.5em .6em\"><b>Listening</b><br><span class=\"muted\">mendengar dahulu</span></div><div class=\"card\" style=\"padding:.5em .6em\"><b>Empathy</b><br><span class=\"muted\">memahami sudut pandang anggota</span></div><div class=\"card\" style=\"padding:.5em .6em\"><b>Healing</b><br><span class=\"muted\">memulihkan yang terluka</span></div><div class=\"card\" style=\"padding:.5em .6em\"><b>Awareness</b><br><span class=\"muted\">peka pada diri dan sekitar</span></div><div class=\"card\" style=\"padding:.5em .6em\"><b>Persuasion</b><br><span class=\"muted\">meyakinkan, bukan memaksa</span></div><div class=\"card\" style=\"padding:.5em .6em\"><b>Conceptualization</b><br><span class=\"muted\">melihat gambaran besar</span></div><div class=\"card\" style=\"padding:.5em .6em\"><b>Foresight</b><br><span class=\"muted\">memperkirakan akibat</span></div><div class=\"card hl\" style=\"padding:.5em .6em\"><b><button type=\"button\" class=\"term\" data-term=\"stewardship\">Stewardship</button></b><br><span class=\"muted\">menjaga titipan</span></div><div class=\"card\" style=\"padding:.5em .6em\"><b>Growth of people</b><br><span class=\"muted\">menumbuhkan anggota</span></div><div class=\"card\" style=\"padding:.5em .6em\"><b>Building community</b><br><span class=\"muted\">membangun kebersamaan</span></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Sepuluh karakteristik menurut Spears, sebagaimana dirangkum Northouse (2025). Padanan Indonesia oleh dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Authentic leadership</span><span>Jembatan ke nilai</span></div><h2>Jujur pada nilai diri</h2><p class=\"lead\" style=\"margin-bottom:.6em\"><button type=\"button\" class=\"term\" data-term=\"authentic-leadership\">Kepemimpinan autentik</button>: pemimpin bertindak dari nilai yang benar-benar ia pegang, dan terbuka kepada pengikutnya.</p><div class=\"grid4\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg><button type=\"button\" class=\"term\" data-term=\"self-awareness\">Self-awareness</button></h3><p>Paham nilai, kekuatan, dan kelemahan diri.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg><button type=\"button\" class=\"term\" data-term=\"internalized-moral-perspective\">Moral perspective</button></h3><p>Bertindak sesuai standar moral, bukan tekanan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"balanced-processing\">Balanced processing</button></h3><p>Menimbang pendapat yang berbeda sebelum memutuskan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg><button type=\"button\" class=\"term\" data-term=\"relational-transparency\">Relational transparency</button></h3><p>Terbuka dan jujur kepada orang lain.</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Empat komponen kepemimpinan autentik (Walumbwa dkk.), diadaptasi dari Northouse (2025).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pembanding</span><span>Indikator 1 · bekal UTS</span></div><h2>Lima pendekatan dalam satu tabel</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><thead><tr><th>Pendekatan</th><th>Yang dilihat</th><th>Pertanyaan kunci</th><th>Tanda di pimpinan mitra</th></tr></thead><tbody><tr><td><b>Sifat</b></td><td>pribadi pemimpin</td><td>Sifat apa yang ia miliki?</td><td>anggota menyebut \"tegas\", \"jujur\", \"cerdas\"</td></tr><tr><td><b>Perilaku</b></td><td>tindakan: tugas dan hubungan</td><td>Apa yang ia lakukan?</td><td>cara membagi tugas dan menyapa anggota</td></tr><tr><td><b>Situasional</b></td><td>kecocokan gaya dan anggota</td><td>Apakah gayanya berubah sesuai anggota?</td><td>arahan rinci ke yang baru, delegasi ke yang senior</td></tr><tr><td><b>Transformasional</b></td><td>visi, teladan, inspirasi</td><td>Bagaimana ia menggerakkan anggota melampaui imbalan?</td><td>visi yang diulang, teladan, ajakan berinovasi</td></tr><tr><td><b>Servant</b></td><td>melayani kebutuhan anggota</td><td>Apakah anggota tumbuh karena dipimpinnya?</td><td>membela, melatih, mendahulukan anggota</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Ringkasan dari Northouse (2025). Satu pemimpin bisa dibaca dengan beberapa pendekatan sekaligus.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kepemimpinan berbasis nilai</span><span>Indikator 3</span></div><h2>Empat sifat teladan kepemimpinan</h2><div class=\"grid4\"><div class=\"card hl\"><h3><button type=\"button\" class=\"term\" data-term=\"shiddiq\">Shiddiq</button></h3><p><b>Jujur dan benar</b> dalam kata dan perbuatan.</p><p class=\"muted\" style=\"font-size:.85em\">Tampak: laporan apa adanya, mengakui kesalahan.</p><p class=\"muted\" style=\"font-size:.85em\">Lawannya: <i>kidzb</i> (dusta).</p></div><div class=\"card hl\"><h3><button type=\"button\" class=\"term\" data-term=\"amanah\">Amanah</button></h3><p><b>Dapat dipercaya</b> menjaga titipan dan wewenang.</p><p class=\"muted\" style=\"font-size:.85em\">Tampak: dana dan data dijaga, jabatan tidak untuk diri.</p><p class=\"muted\" style=\"font-size:.85em\">Lawannya: <i>khianat</i>.</p></div><div class=\"card hl\"><h3><button type=\"button\" class=\"term\" data-term=\"tabligh\">Tabligh</button></h3><p><b>Menyampaikan</b> yang perlu diketahui dengan jelas.</p><p class=\"muted\" style=\"font-size:.85em\">Tampak: informasi terbuka, arahan jelas, umpan balik.</p><p class=\"muted\" style=\"font-size:.85em\">Lawannya: <i>kitman</i> (menyembunyikan).</p></div><div class=\"card hl\"><h3><button type=\"button\" class=\"term\" data-term=\"fathanah\">Fathanah</button></h3><p><b>Cerdas dan bijaksana</b> membaca masalah.</p><p class=\"muted\" style=\"font-size:.85em\">Tampak: keputusan berbasis data, solusi tepat situasi.</p><p class=\"muted\" style=\"font-size:.85em\">Lawannya: <i>baladah</i> (bodoh, lalai).</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Definisi kerja mata kuliah dari empat sifat wajib rasul; contoh perilaku oleh dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Nilai</span><span>Amanah · adil</span></div><h2>Amanah kepada yang berhak</h2><div class=\"cols wq\"><div><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">اِنَّ اللّٰهَ يَأْمُرُكُمْ اَنْ تُؤَدُّوا الْاَمٰنٰتِ اِلٰٓى اَهْلِهَا ۙ وَاِذَا حَكَمْتُمْ بَيْنَ النَّاسِ اَنْ تَحْكُمُوْا بِالْعَدْلِ ۗ اِنَّ اللّٰهَ نِعِمَّا يَعِظُكُمْ بِهٖ ۗ اِنَّ اللّٰهَ كَانَ سَمِيْعًاۢ بَصِيْرًا</p><p class=\"quote\">\"Sesungguhnya Allah menyuruh kamu menyampaikan amanah kepada pemiliknya. Apabila kamu menetapkan hukum di antara manusia, hendaklah kamu tetapkan secara adil. Sesungguhnya Allah memberi pengajaran yang paling baik kepadamu. Sesungguhnya Allah Maha Mendengar lagi Maha Melihat.\"</p><div class=\"src\">QS. An-Nisa' [4]: 58 · Terjemahan Kemenag RI (2019)</div></blockquote></div><div style=\"font-size:.92em\"><ul><li>Jabatan dan tugas diberikan kepada yang <b>mampu dan berhak</b>.</li><li>Titipan (dana, data, wewenang) <b>dikembalikan</b> dan dipertanggungjawabkan.</li><li>Keputusan atas orang lain diambil secara <b>adil</b>.</li><li>Sejalan dengan CPL-1: Al Amanah dan Al Adalah.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Nilai dan teori</span><span>Indikator 1 dan 3 · lensa Tugas 1C</span></div><h2>Dari nilai ke perilaku yang teramati</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><thead><tr><th>Nilai</th><th>Bersinggungan dengan</th><th>Pertanyaan untuk mitra</th></tr></thead><tbody><tr><td><b>Shiddiq</b></td><td>integrity (sifat); moral perspective (autentik)</td><td>Pernahkah pimpinan mengakui kesalahan di depan anggota?</td></tr><tr><td><b>Amanah</b></td><td>stewardship (servant); kekuasaan posisi dipakai sesuai mandat</td><td>Bagaimana dana, data, dan wewenang dipertanggungjawabkan?</td></tr><tr><td><b>Tabligh</b></td><td>relational transparency; inspirational motivation</td><td>Bagaimana keputusan dan informasi penting sampai ke anggota?</td></tr><tr><td><b>Fathanah</b></td><td>intelligence (sifat); intellectual stimulation; diagnosis situasional</td><td>Bagaimana pimpinan memutuskan saat ada masalah baru?</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Pemetaan adalah definisi kerja mata kuliah untuk membantu analisis, bukan padanan yang sama persis.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario interaktif</span><span>Anda kepala unit TI</span></div><h2>Satu malam sebelum rapat pimpinan</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;kmo7-nilai&quot;,&quot;start&quot;:&quot;s1&quot;,&quot;ask&quot;:&quot;Apa yang Anda lakukan?&quot;,&quot;nodes&quot;:{&quot;s1&quot;:{&quot;text&quot;:&quot;Anda kepala UPT TIK sebuah kampus (kasus ilustrasi). Malam ini sistem pendaftaran mahasiswa baru error: berkas 40 pendaftar hilang sebagian. Penyebabnya konfigurasi yang diubah Fikri, staf baru. Besok pagi rapat pimpinan.&quot;,&quot;say&quot;:[[&quot;Fikri&quot;,&quot;Pak, maaf… sepertinya ini salah saya waktu update kemarin.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Laporkan kejadian apa adanya ke pimpinan besok, minta waktu pemulihan, dan siapkan pemberitahuan untuk 40 pendaftar.&quot;,&quot;tag&quot;:&quot;Jujur dan terbuka&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;fb&quot;:&quot;Shiddiq dan tabligh: kejadian disampaikan apa adanya kepada pimpinan dan pihak terdampak.&quot;},{&quot;t&quot;:&quot;Pulihkan diam-diam malam ini; di rapat cukup laporkan \\&quot;sistem berjalan lancar\\&quot;.&quot;,&quot;tag&quot;:&quot;Menutupi&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;fb&quot;:&quot;Melanggar shiddiq dan tabligh. Bila pendaftar mengeluh belakangan, kepercayaan pada unit TI rusak (amanah).&quot;},{&quot;t&quot;:&quot;Laporkan ke pimpinan dan sebutkan bahwa Fikri penyebabnya.&quot;,&quot;tag&quot;:&quot;Jujur, tetapi melempar&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;fb&quot;:&quot;Jujur, tetapi pemimpin ikut bertanggung jawab atas timnya. Menunjuk nama di forum bisa merusak kepercayaan tim.&quot;}]},&quot;s2&quot;:{&quot;text&quot;:&quot;Tim punya dua opsi: memulihkan dari backup dua hari lalu (aman, tetapi data dua hari harus dimasukkan ulang), atau memperbaiki basis data langsung (cepat, tetapi berisiko).&quot;,&quot;say&quot;:[[&quot;Teknisi senior&quot;,&quot;Saya condong ke backup, Pak. Tapi Mas Dani yakin perbaikan langsung bisa.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Minta keduanya memaparkan data risiko 10 menit, lalu putuskan dan bagi tugas pemulihan.&quot;,&quot;tag&quot;:&quot;Menimbang, lalu memutuskan&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;fb&quot;:&quot;Fathanah dan balanced processing: pendapat berbeda ditimbang dengan data sebelum memutuskan.&quot;},{&quot;t&quot;:&quot;Langsung pilih perbaikan langsung karena paling cepat.&quot;,&quot;tag&quot;:&quot;Cepat tanpa menimbang&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;fb&quot;:&quot;Tegas, tetapi risiko kehilangan data lebih besar belum ditimbang.&quot;},{&quot;t&quot;:&quot;Serahkan ke tim, Anda pulang dulu karena sudah malam.&quot;,&quot;tag&quot;:&quot;Lepas tangan&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;fb&quot;:&quot;Laissez-faire saat krisis. Amanah jabatan menuntut pemimpin hadir saat tim paling membutuhkan.&quot;}]},&quot;s3&quot;:{&quot;text&quot;:&quot;Data pulih menjelang subuh. Paginya Fikri mengirim pesan.&quot;,&quot;say&quot;:[[&quot;Fikri&quot;,&quot;Pak, saya merasa tidak pantas di tim ini. Saya mau mengundurkan diri.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Ajak bicara empat mata: akui ini tanggung jawab bersama, susun checklist update dan pendampingan untuk Fikri.&quot;,&quot;tag&quot;:&quot;Melayani dan menumbuhkan&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;end&quot;,&quot;fb&quot;:&quot;Servant leadership: kesalahan menjadi bahan belajar; Fikri (D1–D2) butuh arahan dan dukungan.&quot;},{&quot;t&quot;:&quot;Terima pengunduran dirinya agar kejadian tidak terulang.&quot;,&quot;tag&quot;:&quot;Membuang orang&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;end&quot;,&quot;fb&quot;:&quot;Masalah sistem (tidak ada prosedur update) tidak selesai; tim belajar bahwa kesalahan harus disembunyikan.&quot;},{&quot;t&quot;:&quot;Tegur keras di grup tim agar semua belajar.&quot;,&quot;tag&quot;:&quot;Menegur di depan umum&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;end&quot;,&quot;fb&quot;:&quot;Mempermalukan di depan umum merusak kepercayaan dan membuat anggota menutupi kesalahan berikutnya.&quot;}]},&quot;end&quot;:{&quot;end&quot;:&quot;Lihat jejak pilihan di atas. Jalur yang dianjurkan memperlihatkan empat nilai: jujur kepada pimpinan (shiddiq), menyampaikan kepada pendaftar (tabligh), menimbang dengan data (fathanah), dan menjaga serta menumbuhkan tim (amanah, servant).&quot;,&quot;title&quot;:&quot;Selesai: cek jejak pilihan Anda&quot;,&quot;k&quot;:&quot;mid&quot;}}}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Presentasi Tugas 1</span><span>Indikator 4 · 7 menit + 3 menit tanya jawab</span></div><h2>Aturan main presentasi</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Kelompok yang tampil</h3><ol><li>Mitra dan strukturnya (1A).</li><li>Budaya dan keberagaman (1B).</li><li>Gaya pimpinan dengan bukti perilaku (1C).</li><li>Shiddiq, amanah, tabligh, fathanah: bukti atau kesenjangan.</li><li>Kesimpulan dan 3–5 rekomendasi.</li></ol><p class=\"muted\" style=\"font-size:.85em\">Setiap anggota berbicara. Maksimal 10 slide.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok yang menyimak</h3><ul><li>Isi penilaian sejawat di ponsel (slide berikut).</li><li>Siapkan satu pertanyaan: \"Apa buktinya bahwa…?\"</li><li>Santun: yang dikritik analisisnya, bukan orangnya.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Menilai presentasi kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;kmo7-sejawat&quot;,&quot;title&quot;:&quot;Penilaian sejawat · Presentasi Tugas 1 (KMO P7)&quot;,&quot;levels&quot;:[&quot;Belum tampak&quot;,&quot;Mulai tampak&quot;,&quot;Tampak&quot;,&quot;Menonjol&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai (nama mitra)&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 3 · koperasi pesantren&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik dari presentasi mereka&quot;,&quot;tipLabel&quot;:&quot;Saran (pakai pesan-saya)&quot;,&quot;tipPh&quot;:&quot;\\&quot;Saya belum menangkap… akan lebih kuat bila…\\&quot;&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu banyak perbaikan&quot;},{&quot;min&quot;:8,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:11,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Pendekatan kepemimpinan tepat&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Pendekatan tidak disebut atau keliru.&quot;,&quot;Pendekatan disebut tanpa alasan.&quot;,&quot;Pendekatan tepat dan alasannya jelas.&quot;,&quot;Pendekatan tepat, alasan kuat, dan dibandingkan dengan pendekatan lain.&quot;]},{&quot;t&quot;:&quot;Gaya pimpinan berbukti&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Gaya hanya berupa kesan.&quot;,&quot;Ada satu atau dua perilaku, buktinya lemah.&quot;,&quot;Minimal tiga perilaku konkret dengan sumber.&quot;,&quot;Bukti dari pimpinan dan anggota, saling dikuatkan.&quot;]},{&quot;t&quot;:&quot;Kaitan dengan empat nilai&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Nilai tidak dibahas.&quot;,&quot;Nilai disebut secara umum tanpa bukti.&quot;,&quot;Keempat nilai dikaitkan dengan bukti atau kesenjangan.&quot;,&quot;Bukti, kesenjangan, dan saran santun untuk tiap nilai.&quot;]},{&quot;t&quot;:&quot;Kualitas presentasi&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Tidak runtut atau jauh lewat waktu.&quot;,&quot;Runtut sebagian, banyak membaca slide.&quot;,&quot;Runtut, tepat waktu, semua anggota bicara.&quot;,&quot;Runtut, menarik, tepat waktu, menjawab pertanyaan dengan bukti.&quot;]}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.5em\">Isian hanya tersimpan di perangkat Anda. Tekan Copy summary, lalu kirim ke kelompok yang dinilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Servant leadership</b>: melayani dahulu; ukuran berhasil adalah pertumbuhan pengikut.</li><li><b>Authentic leadership</b>: sadar diri, bermoral, menimbang berimbang, terbuka.</li><li>Lima pendekatan dibedakan dari <b>pertanyaan kunci</b> yang dijawabnya.</li><li><b>Shiddiq, amanah, tabligh, fathanah</b> dibaca dari perilaku yang teramati.</li><li>Amanah diserahkan kepada yang berhak dan keputusan diambil secara adil (QS. An-Nisa' [4]: 58).</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · satu per satu</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;kmo7-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Seorang kepala bagian menjadikan pertumbuhan dan kesejahteraan stafnya sebagai tujuan utama, dan sering mendahulukan kebutuhan staf. Pendekatannya paling dekat dengan…&quot;,&quot;o&quot;:[&quot;kepemimpinan transaksional&quot;,&quot;servant leadership&quot;,&quot;laissez-faire&quot;,&quot;Authority–Compliance&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Servant leadership menempatkan kebutuhan dan pertumbuhan pengikut di depan.&quot;},{&quot;q&quot;:&quot;Sebelum memutuskan, ketua organisasi sengaja meminta pendapat anggota yang tidak sependapat dengannya. Komponen kepemimpinan autentik yang tampak adalah…&quot;,&quot;o&quot;:[&quot;self-awareness&quot;,&quot;relational transparency&quot;,&quot;balanced processing&quot;,&quot;internalized moral perspective&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Menimbang pendapat yang berbeda sebelum memutuskan adalah balanced processing.&quot;},{&quot;q&quot;:&quot;Pengurus sengaja menyembunyikan rencana kenaikan iuran dari anggota sampai rapat selesai. Nilai yang paling jelas dilanggar adalah…&quot;,&quot;o&quot;:[&quot;shiddiq&quot;,&quot;amanah&quot;,&quot;tabligh&quot;,&quot;fathanah&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Tabligh berarti menyampaikan yang perlu diketahui; lawannya kitman (menyembunyikan).&quot;},{&quot;q&quot;:&quot;Bendahara memakai uang kas kegiatan untuk keperluan pribadi walaupun berniat mengembalikannya. Nilai yang dilanggar adalah…&quot;,&quot;o&quot;:[&quot;tabligh&quot;,&quot;amanah&quot;,&quot;fathanah&quot;,&quot;shiddiq&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Dana organisasi adalah titipan; memakainya untuk diri sendiri melanggar amanah.&quot;},{&quot;q&quot;:&quot;Perbedaan utama servant leadership dan kepemimpinan transformasional adalah…&quot;,&quot;o&quot;:[&quot;Servant tidak memperhatikan pengikut, transformasional memperhatikan&quot;,&quot;Servant mengutamakan pertumbuhan pengikut, transformasional mengarahkan pengikut ke visi organisasi&quot;,&quot;Servant memakai imbalan, transformasional memakai hukuman&quot;,&quot;Keduanya sama persis&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Keduanya memperhatikan pengikut, tetapi fokus akhir servant adalah pengikut, sedangkan transformasional adalah tujuan atau visi organisasi.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas dan persiapan UTS</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 di Elin)</h3><ul><li>Perbaiki laporan 1C berdasarkan masukan presentasi.</li><li>Unggah Tugas 1A, 1B, dan 1C. Setiap anggota mengunggah berkas yang sama dan menekan Submit.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Persiapan UTS</h3><p>Materi Pertemuan 1–7 (Sub-CPMK-1 sampai 4). Pelajari rangkuman tiap pertemuan, tabel lima pendekatan, dan empat nilai. Ujian tertulis 3×50 menit.</p></div></div><p class=\"muted\" style=\"margin-top:.8em\">Tenggat Tugas 1A, 1B, dan 1C: Rabu, 4 November 2026, 23.59 WIB di Elin. UTS di Pertemuan 8.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Servant leadership</span></dt><dd>Pendekatan kepemimpinan yang menempatkan kebutuhan dan perkembangan pengikut di atas kepentingan pemimpin; pemimpin melayani dahulu, lalu memimpin. <i>(kepemimpinan melayani)</i></dd></div><div><dt><span class=\"en\">Stewardship</span></dt><dd>Sikap memegang organisasi dan sumber dayanya sebagai titipan yang harus dijaga untuk kepentingan bersama. <i>(kepengurusan, sikap menjaga titipan)</i></dd></div><div><dt><span class=\"en\">Authentic leadership</span></dt><dd>Kepemimpinan yang bersumber dari kesadaran diri, nilai moral yang dipegang, keterbukaan, dan pertimbangan yang berimbang; pemimpin jujur pada dirinya dan pengikut. <i>(kepemimpinan autentik)</i></dd></div><div><dt><span class=\"en\">Self-awareness</span></dt><dd>Pemahaman pemimpin tentang nilai, kekuatan, kelemahan, dan dampak dirinya pada orang lain. <i>(kesadaran diri)</i></dd></div><div><dt><span class=\"en\">Internalized moral perspective</span></dt><dd>Pemimpin bertindak berdasarkan standar moral dirinya, bukan karena tekanan kelompok atau organisasi. <i>(perspektif moral yang terinternalisasi)</i></dd></div><div><dt><span class=\"en\">Balanced processing</span></dt><dd>Pemimpin menimbang informasi dan pendapat, termasuk yang berbeda, sebelum memutuskan. <i>(pertimbangan berimbang)</i></dd></div><div><dt><span class=\"en\">Relational transparency</span></dt><dd>Pemimpin terbuka dan jujur tentang pikiran, perasaan, dan informasi kepada orang lain secara tepat. <i>(keterbukaan relasional)</i></dd></div><div><dt><span class=\"en\">Shiddiq</span></dt><dd>Benar dan jujur dalam perkataan dan perbuatan; satu dari empat sifat wajib rasul. <i>(jujur, benar)</i></dd></div><div><dt><span class=\"en\">Amanah</span></dt><dd>Dapat dipercaya; menjaga dan menunaikan titipan, tugas, dan wewenang sebagaimana mestinya. <i>(dapat dipercaya)</i></dd></div><div><dt><span class=\"en\">Tabligh</span></dt><dd>Menyampaikan yang benar dan perlu diketahui secara terbuka, jelas, dan tidak menyembunyikannya. <i>(menyampaikan)</i></dd></div><div><dt><span class=\"en\">Fathanah</span></dt><dd>Cerdas dan bijaksana: memahami persoalan dan memutuskan dengan tepat. <i>(cerdas, bijaksana)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Northouse, P. G. (2025). <i>Leadership: Theory and practice</i> (10th ed.). SAGE Publications.</li><li>Yukl, G. A., &amp; Gardner, W. L. (2020). <i>Leadership in organizations</i> (9th ed.). Pearson.</li><li>Kementerian Agama Republik Indonesia. (2019). <i>Al-Qur'an dan terjemahannya</i> (Edisi penyempurnaan 2019). Lajnah Pentashihan Mushaf Al-Qur'an. https://quran.kemenag.go.id</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di UTS (Pertemuan 8).</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":8,"title":"Ujian Tengah Semester (UTS)","subtitle":"Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class const SIMS={gaya(el,cfg,s){
    const I=cfg.items||[], L=cfg.levels||['1','2','3','4','5'], Z=cfg.zones||[];
    if(!s.v) s.v={};
    const cnt=k=>I.filter(x=>x.k===k).length;
    const sum=k=>I.reduce((a,x,i)=>a+(x.k===k?(s.v[i]||0):0),0);
    const sc=k=>{const c=cnt(k); return c?Math.round((1+(sum(k)-c)*8/(c*4))*10)/10:1;};
    const filled=()=>I.filter((x,i)=>s.v[i]).length;
    const zoneOf=(t,r)=>Z.find(z=>t>=z.r[0]&&t<=z.r[1]&&r>=z.r[2]&&r<=z.r[3])||Z[Z.length-1];
    const W=230,H=230,PL=34,PB=34,PT=8,PR=8;
    const X=v=>PL+(v-1)/8*(W-PL-PR), Y=v=>H-PB-(v-1)/8*(H-PB-PT);
    const row=i=>'<div class="pa-row"><div class="pa-c"><b>'+(i+1)+'. '+I[i].t+'</b></div><div class="pa-lv" role="group" aria-label="Pernyataan '+(i+1)+'">'+
      L.map((l,j)=>'<button type="button" data-i="'+i+'" data-l="'+(j+1)+'" aria-pressed="'+(s.v[i]===j+1)+'" title="'+l+'">'+(j+1)+'</button>').join('')+'</div></div>';
    const plot=()=>{const ok=filled()===I.length, t=sc('t'), r=sc('r');
      let o=Z.slice().reverse().map(z=>{const v=z.v||z.r;return '<rect x="'+X(v[0])+'" y="'+Y(v[3])+'" width="'+(X(v[1])-X(v[0]))+'" height="'+(Y(v[2])-Y(v[3]))+'" class="'+(z.cls||'s-box')+'"/><text x="'+((X(v[0])+X(v[1]))/2)+'" y="'+((Y(v[2])+Y(v[3]))/2+4)+'" text-anchor="middle" class="s-s" style="font-size:9.5px">'+z.lab+'</text>';}).join('');
      o+='<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'" class="s-line"/><line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(H-PB)+'" class="s-line"/>';
      o+='<text x="'+((PL+W-PR)/2)+'" y="'+(H-10)+'" text-anchor="middle" class="s-s" style="font-size:11px">'+cfg.xLabel+' →</text><text transform="translate(14 '+((PT+H-PB)/2)+') rotate(-90)" text-anchor="middle" class="s-s" style="font-size:11px">'+cfg.yLabel+' →</text>';
      if(ok) o+='<circle class="g2-dot" r="9" cx="'+X(t)+'" cy="'+Y(r)+'"/>';
      return '<svg class="g2-svg" style="cursor:default;max-width:11em" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Posisi skor perilaku tugas dan hubungan">'+o+'</svg>';};
    const out=()=>{const f=filled();
      if(f<I.length) return '<p class="muted" style="margin:.3em 0 0">'+(cfg.wait||'Isi semua pernyataan.')+' ('+f+'/'+I.length+')</p>';
      const t=sc('t'), r=sc('r'), z=zoneOf(t,r);
      return '<div class="g2-name">'+z.name+(z.en?' <span>'+z.en+'</span>':'')+'</div><div class="g2-tag">Tugas '+t+' · Hubungan '+r+' (skala 1–9)</div><p>'+z.d+'</p>';};
    el.innerHTML='<div class="pa"><div class="pa-grid">'+I.map((x,i)=>row(i)).join('')+'</div><div class="pa-side"><div class="g2-fig">'+plot()+'</div><div class="g2-out" aria-live="polite">'+out()+'</div>'+
      '<div class="pa-act"><button type="button" class="wbtn" data-act="clear">Clear</button></div></div></div>';
    const upd=()=>{el.querySelector('.g2-fig').innerHTML=plot(); const o=el.querySelector('.g2-out'); o.innerHTML=out(); o.classList.remove('in'); void o.offsetWidth; o.classList.add('in');};
    el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.l){ const i=+b.dataset.i; s.v[i]=+b.dataset.l;
        el.querySelectorAll('[data-i="'+i+'"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===b.dataset.l)); upd(); return; }
      if(b.dataset.act==='clear'){ s.v={}; el.querySelectorAll('.pa-lv button').forEach(x=>x.setAttribute('aria-pressed','false')); upd(); }
    };

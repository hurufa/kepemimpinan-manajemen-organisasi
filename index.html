xt-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mengevaluasi</text><text x=\"815\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">hasil</text><path d=\"M158 34 v-12 h286 v12\" class=\"s-line\" style=\"fill:none\"/><text x=\"301\" y=\"16\" text-anchor=\"middle\" class=\"s-hd\">ANALISIS SWOT</text><path d=\"M10 140 v12 h576 v-12\" class=\"s-dash\"/><text x=\"298\" y=\"172\" text-anchor=\"middle\" class=\"s-s\">langkah 1–4: perencanaan (dibahas hari ini)</text><path d=\"M602 140 v12 h278 v-12\" class=\"s-dash\"/><text x=\"741\" y=\"172\" text-anchor=\"middle\" class=\"s-s\">langkah 5–6: Pertemuan 11–15</text></svg><figcaption>Proses manajemen strategis enam langkah, diadaptasi dari Robbins et al. (2024).</figcaption></figure><p style=\"margin-top:.4em\"><button type=\"button\" class=\"term\" data-term=\"strategy\">Strategi</button> menjawab: apa yang akan dilakukan organisasi, bagaimana ia bersaing atau melayani, dan bagaimana menarik serta memuaskan penggunanya <span class=\"cite\">(Robbins et al., 2024)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis SWOT</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"swot\">SWOT</button>: melihat ke dalam dan ke luar</h2><div class=\"cols w\"><div><figure class=\"fig\"><svg viewBox=\"0 0 700 270\" style=\"max-height:14em\" role=\"img\" aria-label=\"Matriks SWOT dua kali dua. Baris atas faktor internal: strengths (membantu) dan weaknesses (menghambat). Baris bawah faktor eksternal: opportunities (membantu) dan threats (menghambat).\"><text x=\"265\" y=\"20\" text-anchor=\"middle\" class=\"s-hd\">MEMBANTU</text><text x=\"535\" y=\"20\" text-anchor=\"middle\" class=\"s-hd\">MENGHAMBAT</text><text x=\"100\" y=\"92\" text-anchor=\"end\" class=\"s-hd\">INTERNAL</text><text x=\"100\" y=\"110\" text-anchor=\"end\" class=\"s-s\">dapat dikendalikan</text><text x=\"100\" y=\"212\" text-anchor=\"end\" class=\"s-hd\">EKSTERNAL</text><text x=\"100\" y=\"230\" text-anchor=\"end\" class=\"s-s\">di luar kendali</text><rect x=\"130\" y=\"30\" width=\"270\" height=\"112\" rx=\"12\" class=\"s-soft\"/><text x=\"265\" y=\"72\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:18px\">S · Strengths</text><text x=\"265\" y=\"98\" text-anchor=\"middle\" class=\"s-s\">sumber daya &amp; kemampuan unggul</text><rect x=\"404\" y=\"30\" width=\"270\" height=\"112\" rx=\"12\" class=\"s-warn\"/><text x=\"539\" y=\"72\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:18px\">W · Weaknesses</text><text x=\"539\" y=\"98\" text-anchor=\"middle\" class=\"s-s\">kekurangan yang dimiliki</text><rect x=\"130\" y=\"148\" width=\"270\" height=\"112\" rx=\"12\" class=\"s-acc\"/><text x=\"265\" y=\"190\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:18px\">O · Opportunities</text><text x=\"265\" y=\"216\" text-anchor=\"middle\" class=\"s-s\">tren positif di lingkungan</text><rect x=\"404\" y=\"148\" width=\"270\" height=\"112\" rx=\"12\" class=\"s-box\"/><text x=\"539\" y=\"190\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:18px\">T · Threats</text><text x=\"539\" y=\"216\" text-anchor=\"middle\" class=\"s-s\">tren negatif di lingkungan</text></svg><figcaption>Matriks SWOT: gabungan analisis internal (S, W) dan eksternal (O, T), diadaptasi dari Robbins et al. (2024).</figcaption></figure></div><div><h3>Pertanyaan pemandu</h3><ul><li><b>S</b>: <button type=\"button\" class=\"term\" data-term=\"resources\">sumber daya</button> atau kemampuan apa yang unggul? Adakah <button type=\"button\" class=\"term\" data-term=\"core-competency\">kompetensi inti</button>?</li><li><b>W</b>: apa yang kurang dibanding kebutuhan atau pesaing?</li><li><b>O</b>: tren, kebijakan, atau teknologi apa yang bisa dimanfaatkan?</li><li><b>T</b>: perubahan apa di luar yang bisa merugikan?</li></ul><div class=\"callout\" style=\"margin-top:.6em\">Setiap butir harus didukung <b>bukti</b> dari mitra: data, wawancara, atau dokumen.</div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh SWOT</span><span>Kasus ilustrasi · indikator 2</span></div><h2>SWOT unit TI sebuah kampus swasta</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Strengths</h3><ul><li>Tim pengembang lulusan sendiri, paham proses akademik</li><li>SIAKAD dikembangkan mandiri, mudah disesuaikan</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Weaknesses</h3><ul><li>Hanya 4 staf untuk 20 aplikasi</li><li>Dokumentasi dan pencadangan tidak rutin</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Opportunities</h3><ul><li>Layanan cloud dengan harga khusus pendidikan</li><li>Mahasiswa SI bisa magang di unit TI</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Threats</h3><ul><li>Serangan siber ke situs perguruan tinggi</li><li>Tuntutan pelaporan data ke pemerintah makin banyak</li></ul></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dari SWOT ke strategi</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"tows\">Matriks TOWS</button> <span class=\"cite\">(Weihrich, 1982)</span></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th></th><th>Strengths (S)</th><th>Weaknesses (W)</th></tr></thead><tbody><tr><td><b>Opportunities (O)</b></td><td><b>SO</b>: pakai kekuatan untuk meraih peluang<br><span class=\"muted\">tim pengembang memanfaatkan cloud pendidikan untuk layanan baru</span></td><td><b>WO</b>: atasi kelemahan dengan memanfaatkan peluang<br><span class=\"muted\">program magang mahasiswa SI untuk menambah tenaga</span></td></tr><tr><td><b>Threats (T)</b></td><td><b>ST</b>: pakai kekuatan untuk menghadapi ancaman<br><span class=\"muted\">SIAKAD mandiri segera ditambal saat ada celah keamanan</span></td><td><b>WT</b>: kurangi kelemahan dan hindari ancaman<br><span class=\"muted\">jadwal pencadangan rutin dan dokumentasi sebelum insiden</span></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Nama empat strategi mengikuti Weihrich (1982); contoh melanjutkan kasus ilustrasi unit TI.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Hati-hati</span><span>Indikator 2</span></div><h2>Kesalahan umum dalam SWOT</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Tertukar</h3><p>Faktor eksternal ditulis sebagai kelemahan, atau sebaliknya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Terlalu umum</h3><p>\"SDM kurang\", \"promosi kurang\" tanpa angka atau contoh.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Tanpa bukti</h3><p>Ditulis dari tebakan, bukan dari wawancara, data, atau dokumen.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Daftar kepanjangan</h3><p>Puluhan butir tanpa prioritas; yang penting tenggelam.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Berhenti di daftar</h3><p>Tidak diturunkan menjadi strategi (TOWS).</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Satu suara</h3><p>Hanya dari pimpinan; suara anggota atau pengguna tidak didengar.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 20 menit</span></div><h2>Bentuk kelompok, pilih organisasi mitra</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 4–5 orang. Tetapkan peran awal:</p><ul><li>Koordinator kelompok</li><li>Penghubung mitra</li><li>Pencatat wawancara dan data</li><li>Penanggung jawab dokumen dan sumber</li></ul><p class=\"muted\">Peran dirotasi di Tugas 2 agar setiap anggota berlatih memimpin.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria mitra yang baik</h3><ul><li>Organisasi nyata: UMKM, instansi pemerintah, organisasi kemahasiswaan, atau pesantren/lembaga NU.</li><li>Punya pimpinan dan minimal 5 anggota/pegawai.</li><li>Bersedia diwawancarai 3–4 kali dan diamati selama semester.</li><li>Ada dokumen yang bisa dilihat: visi-misi, struktur, program kerja (boleh sederhana).</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Analisis organisasi dan kepemimpinan mitra</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>P2–3 · 10%</h3><p>Visi-misi, tujuan SMART, SWOT/TOWS, dan analisis struktur organisasi mitra.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>P4–5 · 10%</h3><p>Observasi dan wawancara budaya organisasi, motivasi, dan keberagaman.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>P6–7 · 10%</h3><p>Analisis gaya kepemimpinan pimpinan mitra; laporan lengkap dipresentasikan di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai organisasi yang <b>sama</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Perencanaan</b> menetapkan tujuan, strategi, dan rencana; memberi arah dan standar pengendalian.</li><li><b>Visi</b> (ke mana), <b>misi</b> (mengapa ada), <b>tujuan</b> (hasil terukur), <b>rencana</b> (siapa, apa, kapan).</li><li>Tujuan yang baik memenuhi <b>S.M.A.R.T.</b> versi Doran: Specific, Measurable, Assignable, Realistic, Time-related.</li><li><b>SWOT</b> = analisis internal (S, W) + eksternal (O, T), berbasis bukti.</li><li><b>TOWS</b> mengubah SWOT menjadi strategi SO, ST, WO, WT.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Doran menulis Assignable: jelas siapa yang akan mengerjakannya.\"><p class=\"q\">Dalam artikel asli Doran (1981), huruf A pada S.M.A.R.T. berarti…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Achievable</button><button type=\"button\" data-o=\"b\">B. Assignable</button><button type=\"button\" data-o=\"c\">C. Accurate</button><button type=\"button\" data-o=\"d\">D. Attractive</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Faktor eksternal yang bisa merugikan: threat.\"><p class=\"q\">\"Pesantren baru berfasilitas lengkap berdiri di kecamatan sebelah\" dalam SWOT pesantren termasuk…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Strength</button><button type=\"button\" data-o=\"b\">B. Weakness</button><button type=\"button\" data-o=\"c\">C. Opportunity</button><button type=\"button\" data-o=\"d\">D. Threat</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"a\" data-why=\"Kekuatan (S) dipakai untuk meraih peluang (O).\"><p class=\"q\">\"Tim pengembang yang kuat memanfaatkan layanan cloud murah\" termasuk strategi TOWS…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. SO</button><button type=\"button\" data-o=\"b\">B. ST</button><button type=\"button\" data-o=\"c\">C. WO</button><button type=\"button\" data-o=\"d\">D. WT</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab perencanaan dan manajemen strategis dalam Robbins et al. (2024), serta bab pengorganisasian dan desain struktur sebagai persiapan Pertemuan 3.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Pastikan mitra dan minta izin.</li><li>Kumpulkan visi, misi, program kerja, dan bagan struktur (foto atau salinan).</li><li>Wawancarai pimpinan dan minimal satu anggota/pengguna layanan.</li><li>Susun draf: evaluasi visi-misi, dua tujuan SMART usulan, SWOT (3–5 butir per kuadran, berbukti), dan TOWS.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa draf dan bagan struktur mitra ke Pertemuan 3.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Planning</span></dt><dd>Fungsi manajemen untuk menetapkan tujuan, menyusun strategi, dan membuat rencana kerja. <i>(perencanaan)</i></dd></div><div><dt><span class=\"en\">Goal</span></dt><dd>Hasil atau sasaran yang ingin dicapai organisasi, kelompok, atau individu. <i>(tujuan)</i></dd></div><div><dt><span class=\"en\">Vision</span></dt><dd>Gambaran masa depan jangka panjang yang ingin diwujudkan organisasi. <i>(visi)</i></dd></div><div><dt><span class=\"en\">Mission</span></dt><dd>Pernyataan tentang alasan keberadaan organisasi: apa yang dikerjakan, untuk siapa, dan bagaimana. <i>(misi)</i></dd></div><div><dt><span class=\"en\">S.M.A.R.T.</span></dt><dd>Kriteria penulisan tujuan menurut Doran (1981): Specific, Measurable, Assignable, Realistic, Time-related. <i>(kriteria tujuan SMART)</i></dd></div><div><dt><span class=\"en\">Strategy</span></dt><dd>Rencana tentang apa yang akan dilakukan organisasi, bagaimana bersaing atau melayani, dan cara menarik serta memuaskan pengguna. <i>(strategi)</i></dd></div><div><dt><span class=\"en\">Strategic management</span></dt><dd>Apa yang dilakukan manajer untuk mengembangkan strategi organisasi. <i>(manajemen strategis)</i></dd></div><div><dt><span class=\"en\">SWOT analysis</span></dt><dd>Analisis kekuatan dan kelemahan internal serta peluang dan ancaman eksternal organisasi. <i>(analisis SWOT)</i></dd></div><div><dt><span class=\"en\">TOWS matrix</span></dt><dd>Matriks Weihrich (1982) yang memasangkan faktor internal dan eksternal untuk merumuskan strategi SO, ST, WO, dan WT. <i>(matriks TOWS)</i></dd></div><div><dt><span class=\"en\">Resources</span></dt><dd>Aset yang dimiliki organisasi: keuangan, fisik, manusia, informasi, dan reputasi. <i>(sumber daya)</i></dd></div><div><dt><span class=\"en\">Core competency</span></dt><dd>Keahlian atau kemampuan utama organisasi yang menciptakan nilai dan sulit ditiru. <i>(kompetensi inti)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh keputusan organisasi. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Efficiency</span></dt><dd>Mendapatkan hasil sebesar mungkin dari masukan (waktu, uang, tenaga) sekecil mungkin; \"doing things right\". <i>(efisiensi)</i></dd></div><div><dt><span class=\"en\">Effectiveness</span></dt><dd>Mengerjakan kegiatan yang memang membantu organisasi mencapai tujuannya; \"doing the right things\". <i>(efektivitas)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Doran, G. T. (1981). There's a S.M.A.R.T. way to write management's goals and objectives. <i>Management Review, 70</i>(11), 35–36.</li><li>Robbins, S. P., Coulter, M. A., &amp; Long, L. (2024). <i>Management</i> (16th ed.). Pearson.</li><li>Weihrich, H. (1982). The TOWS matrix—A tool for situational analysis. <i>Long Range Planning, 15</i>(2), 54–66. https://doi.org/10.1016/0024-6301(82)90120-0</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Pengorganisasian & Desain Struktur","subtitle":"Struktur organisasi, rentang kendali, sentralisasi, organisasi TI dan tim lintas fungsi","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Sub-CPMK-2 (Pertemuan 2–3) · CPMK-1 · CPL-6</span></div><h1>Pengorganisasian & Desain Struktur</h1><p class=\"lead\">Struktur organisasi, rentang kendali, sentralisasi, organisasi TI dan tim lintas fungsi</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menganalisis perencanaan dan desain struktur suatu organisasi (C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":4,"title":"Perilaku Individu & Motivasi","subtitle":"Perilaku individu dan persepsi, teori motivasi","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Sub-CPMK-3 (Pertemuan 4–5) · CPMK-1 · CPL-6</span></div><h1>Perilaku Individu & Motivasi</h1><p class=\"lead\">Perilaku individu dan persepsi, teori motivasi</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menganalisis perilaku individu, motivasi, budaya, dan keberagaman dalam organisasi (C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":5,"title":"Budaya Organisasi & Keberagaman","subtitle":"Budaya organisasi, keberagaman dan inklusi, budaya berbasis nilai di pesantren dan lembaga NU","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag /* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    v.innerHTML='<div class="stage" id="stage"><section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section></div>'+
      '<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Init ---------- */
$('#brandLogo').src=LOGO;
$('#bMenu').innerHTML=ic('menu','');
$('#bMode1').innerHTML=ic('slides','')+'<span class="lbl">Slides</span>';
$('#bMode2').innerHTML=ic('book','')+'<span class="lbl">Read</span>';
$('#bMenu').onclick=()=>toggleMenu(); $('#scrim').onclick=()=>toggleMenu(false);
$('#bMode1').onclick=()=>setMode('slide'); $('#bMode2').onclick=()=>setMode('read');
$('#bNotes').onclick=toggleNotes; $('#bTheme').onclick=toggleTheme;
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();const pw=$('#pw').value;if(pw)tryUnlock(pw,false);});
$('#pwCancel').onclick=closeUnlock;
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock();});
if(store.get('collapsed',false)&&!window.matchMedia('(max-width:900px)').matches)$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
buildSide(); readHash(); paintTheme(); render();
const saved=sess.get('pw'); if(saved) tryUnlock(saved,true);
window.addEventListener('hashchange',()=>{readHash();render();});
})();


</script>

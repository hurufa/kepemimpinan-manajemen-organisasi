quot;Langsung voting saja: pakai cara lama atau cara baru?\\&quot;&quot;,&quot;tag&quot;:&quot;Voting cepat&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;e_vote&quot;,&quot;fb&quot;:&quot;Voting sebelum mendengar alasan membuat yang kalah merasa tidak didengar, dan pilihan yang lebih baik bisa terlewat.&quot;}]},&quot;s2&quot;:{&quot;text&quot;:&quot;Nadia menunjukkan rancangan layar. Yosef mengusulkan fitur pengingat stok. Pak Hasan mulai tersinggung.&quot;,&quot;say&quot;:[[&quot;Pak Hasan&quot;,&quot;Kalian ini mau mengajari saya soal koperasi?&quot;],[&quot;Nadia&quot;,&quot;Maaf, Pak. Kami memang belum tahu aturan simpan pinjamnya.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;\\&quot;Pak Hasan yang paling paham aturan koperasi. Bagaimana kalau Bapak memeriksa alur pembukuan di rancangan Nadia, dan Nadia menyesuaikan layarnya?\\&quot;&quot;,&quot;tag&quot;:&quot;Pasangkan keahlian&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;e_baik&quot;,&quot;fb&quot;:&quot;Tepat. Anda menjaga muka Pak Hasan (face-enhancing) dan memadukan keahlian domain dengan keahlian teknis: keberagaman menjadi kekuatan.&quot;},{&quot;t&quot;:&quot;\\&quot;Pak, zaman sudah berubah. Cara lama sudah tidak cocok.\\&quot;&quot;,&quot;tag&quot;:&quot;Merendahkan senior&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;e_kubu&quot;,&quot;fb&quot;:&quot;Kalimat ini merendahkan berdasarkan usia (stereotip generasi). Tim terbelah menjadi kubu tua dan muda.&quot;}]},&quot;e_senior&quot;:{&quot;end&quot;:&quot;Aplikasi meniru buku kas lama dan sulit dipakai di ponsel. Nadia dan Yosef kehilangan semangat; Yosef bahkan tidak paham keputusan rapat karena bahasanya.&quot;,&quot;title&quot;:&quot;Akhir: seragam, tetapi rapuh&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_vote&quot;:{&quot;end&quot;:&quot;Cara baru menang tipis. Pak Hasan merasa diabaikan dan enggan membantu menjelaskan aturan koperasi; aplikasi banyak salah hitung.&quot;,&quot;title&quot;:&quot;Akhir: menang suara, kalah tim&quot;,&quot;k&quot;:&quot;mid&quot;},&quot;e_kubu&quot;:{&quot;end&quot;:&quot;Pak Hasan berhenti datang rapat. Tim kehilangan satu-satunya orang yang paham pembukuan koperasi.&quot;,&quot;title&quot;:&quot;Akhir: tim terbelah&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_baik&quot;:{&quot;end&quot;:&quot;Aplikasi selesai dengan alur pembukuan yang benar, layar yang mudah, dan pengingat stok usulan Yosef. Pak Hasan kini rajin mencoba aplikasi baru.&quot;,&quot;title&quot;:&quot;Akhir: keberagaman menjadi kekuatan&quot;,&quot;k&quot;:&quot;good&quot;}}}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis video kasus</span><span>Kasus ilustrasi · indikator 2 dan 3</span></div><h2>Toko batik keluarga go online</h2><div class=\"cols w\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg>Transkrip ringkas</h3><ul style=\"font-size:.9em\"><li><b>Bu Ratna</b> (pemilik, 58 th): \"Di sini semua lewat saya. Dari dulu begitu, makanya awet.\"</li><li><b>Dimas</b> (admin daring, 23 th): \"Pesanan malam baru bisa diproses besok karena harus izin Ibu dulu.\"</li><li><b>Mbak Sri</b> (pembatik, 20 tahun bekerja): \"Anak-anak baru itu kerjanya cuma pegang HP.\"</li><li>Setiap Jumat semua makan siang bersama di lantai, termasuk Bu Ratna.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Analisis</h3><ol><li>Unsur budaya: cerita, ritual, simbol, bahasa?</li><li>Karakteristik mana yang tinggi atau rendah?</li><li>Keberagaman apa, dan pengaruhnya?</li><li>Usulan apa?</li></ol><p class=\"muted\" style=\"font-size:.82em\">Video: [PERLU DIISI]. Bila tidak ada, pakai transkrip ini.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi kelompok</span><span>Kelompok Tugas 1 · 25 menit · indikator 2, 3, 4</span></div><h2>Memetakan budaya mitra</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Bagian</th><th>Yang diisi (dengan bukti dan sumber)</th></tr></thead><tbody><tr><td>Tujuh karakteristik</td><td>rendah / sedang / tinggi + satu bukti</td></tr><tr><td>Empat jalur budaya</td><td>cerita, ritual, simbol, bahasa yang teramati</td></tr><tr><td>Budaya dominan dan subbudaya</td><td>adakah bagian yang berbeda?</td></tr><tr><td>Keberagaman</td><td>lapis permukaan dan mendalam; pengaruhnya pada kerja tim</td></tr><tr><td>Data yang masih kurang</td><td>siapa lagi yang perlu diwawancarai, apa yang perlu diamati</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Langkah</h3><ol><li>Gabungkan catatan wawancara dan observasi.</li><li>Isi tabel dengan bukti.</li><li>Tandai bagian yang buktinya lemah.</li><li>Tukar draf dengan kelompok lain untuk penilaian sejawat.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Umpan balik untuk kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;kmo5-sejawat&quot;,&quot;title&quot;:&quot;Penilaian sejawat · Draf data budaya mitra (KMO P5)&quot;,&quot;levels&quot;:[&quot;Belum tampak&quot;,&quot;Mulai tampak&quot;,&quot;Tampak&quot;,&quot;Menonjol&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai (nama mitra)&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 2 · UMKM batik&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik dari draf mereka&quot;,&quot;tipLabel&quot;:&quot;Saran (pakai pesan-saya)&quot;,&quot;tipPh&quot;:&quot;\\&quot;Saya belum menemukan… akan lebih kuat bila…\\&quot;&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu banyak perbaikan&quot;},{&quot;min&quot;:8,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:11,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Unsur budaya teridentifikasi&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Unsur budaya belum disebut atau hanya kesan umum.&quot;,&quot;Sebagian unsur disebut, buktinya belum jelas.&quot;,&quot;Unsur budaya (karakteristik dan jalur) disebut dengan bukti.&quot;,&quot;Unsur lengkap, bukti kuat, dan saling dihubungkan.&quot;]},{&quot;t&quot;:&quot;Analisis keberagaman&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Keberagaman belum dibahas.&quot;,&quot;Menyebut perbedaan anggota tanpa pengaruhnya.&quot;,&quot;Menjelaskan pengaruh keberagaman pada kerja tim dengan contoh.&quot;,&quot;Membedakan lapis permukaan dan mendalam serta menilai cara pengelolaannya.&quot;]},{&quot;t&quot;:&quot;Kelengkapan data&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Data sangat sedikit, sumber tidak jelas.&quot;,&quot;Data ada, tetapi narasumber atau waktu belum dicatat.&quot;,&quot;Data dari beberapa narasumber dan observasi, sumber tercatat.&quot;,&quot;Data lengkap, beragam level narasumber, dan kekurangan data sudah direncanakan.&quot;]},{&quot;t&quot;:&quot;Kejujuran dan etika data&quot;,&quot;ind&quot;:&quot;CPL-1&quot;,&quot;d&quot;:[&quot;Ada data yang tampak dikarang atau identitas terbuka.&quot;,&quot;Sebagian sumber tidak jelas.&quot;,&quot;Data apa adanya dan identitas narasumber dijaga.&quot;,&quot;Data apa adanya, identitas dijaga, keterbatasan data diakui.&quot;]}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.5em\">Isian hanya tersimpan di perangkat Anda. Tekan Copy summary, lalu kirim ke kelompok yang dinilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Budaya organisasi</b> = sistem makna bersama; dinilai lewat <b>tujuh karakteristik</b>.</li><li>Budaya dipelajari lewat <b>cerita, ritual, simbol, bahasa</b>; inilah bukti yang diamati.</li><li>Budaya terbentuk dari pendiri, seleksi, pimpinan, dan sosialisasi; budaya kuat bisa <b>menghambat perubahan</b>.</li><li>Keberagaman punya lapis <b>permukaan</b> dan <b>mendalam</b>; dampaknya pada tim bergantung pada <b>pengelolaan yang inklusif</b>.</li><li>Nilai pesantren dan NU hidup lewat ritual dan teladan, bukan hanya tulisan.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · satu per satu</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;kmo5-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Di sebuah kantor, ruang kepala bagian paling luas dan semua pegawai berseragam batik setiap Jumat. Jalur budaya yang tampak adalah…&quot;,&quot;o&quot;:[&quot;stories&quot;,&quot;rituals&quot;,&quot;material symbols&quot;,&quot;language&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Ruang dan pakaian adalah simbol material yang menyampaikan siapa yang penting dan perilaku yang diharapkan.&quot;},{&quot;q&quot;:&quot;Pimpinan hanya menilai pegawai dari capaian target, tidak peduli bagaimana caranya. Karakteristik budaya yang tinggi…&quot;,&quot;o&quot;:[&quot;people orientation&quot;,&quot;outcome orientation&quot;,&quot;stability&quot;,&quot;attention to detail&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Outcome orientation: fokus pada hasil, bukan teknik atau proses.&quot;},{&quot;q&quot;:&quot;Dua anggota tim berasal dari kota yang sama, tetapi satu mengutamakan ketelitian dan satu mengutamakan kecepatan. Ini contoh keberagaman…&quot;,&quot;o&quot;:[&quot;surface-level&quot;,&quot;deep-level&quot;,&quot;demografis&quot;,&quot;struktural&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Perbedaan nilai dan preferensi kerja termasuk keberagaman mendalam (deep-level).&quot;},{&quot;q&quot;:&quot;Budaya kuat \\&quot;semua harus tanda tangan basah\\&quot; membuat layanan daring kampus tidak dipakai. Ini contoh budaya sebagai…&quot;,&quot;o&quot;:[&quot;penghambat perubahan&quot;,&quot;pemberi identitas&quot;,&quot;penghambat penggabungan&quot;,&quot;mekanisme kendali yang efektif&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Budaya kuat bisa menjadi liabilitas saat lingkungan menuntut perubahan.&quot;},{&quot;q&quot;:&quot;Pernyataan paling tepat tentang keberagaman dalam tim adalah…&quot;,&quot;o&quot;:[&quot;Keberagaman selalu menurunkan kinerja karena memicu konflik&quot;,&quot;Keberagaman selalu meningkatkan kinerja&quot;,&quot;Keberagaman berpotensi meningkatkan kreativitas dan keputusan bila dikelola inklusif&quot;,&quot;Keberagaman permukaan lebih menentukan daripada keberagaman mendalam&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Dampaknya dua arah; pengelolaan yang inklusif menentukan apakah potensi atau risiko yang muncul.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 · bagian P4–5)</h3><ul><li>Lengkapi data observasi dan wawancara budaya mitra sesuai baris \"data yang masih kurang\".</li><li>Susun analisis budaya (tujuh karakteristik, empat jalur) dan keberagaman.</li><li>Gabungkan dengan analisis motivasi dari Pertemuan 4.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab budaya organisasi dan bab keberagaman dalam Robbins &amp; Judge (2023). Persiapan Pertemuan 6: bab pengantar kepemimpinan dalam Northouse (2025).</p></div></div><p class=\"muted\" style=\"margin-top:.8em\">Tenggat: [PERLU DIISI]. Laporan lengkap Tugas 1 dipresentasikan di Pertemuan 7.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Organizational culture</span></dt><dd>Sistem makna bersama yang dianut anggota dan membedakan organisasi itu dari organisasi lain. <i>(budaya organisasi)</i></dd></div><div><dt><span class=\"en\">Core values</span></dt><dd>Nilai utama yang diterima di seluruh organisasi. <i>(nilai inti)</i></dd></div><div><dt><span class=\"en\">Dominant culture</span></dt><dd>Nilai inti yang dianut sebagian besar anggota; inilah yang biasa disebut budaya organisasi. <i>(budaya dominan)</i></dd></div><div><dt><span class=\"en\">Subculture</span></dt><dd>Budaya kecil di bagian atau lokasi tertentu yang mencerminkan situasi dan pengalaman bersama anggotanya. <i>(subbudaya)</i></dd></div><div><dt><span class=\"en\">Strong culture</span></dt><dd>Budaya yang nilai intinya dipegang kuat dan dianut luas oleh anggota. <i>(budaya kuat)</i></dd></div><div><dt><span class=\"en\">Socialization</span></dt><dd>Proses yang membantu anggota baru menyesuaikan diri dengan budaya organisasi. <i>(sosialisasi)</i></dd></div><div><dt><span class=\"en\">Rituals</span></dt><dd>Kegiatan berulang yang menegaskan dan memperkuat nilai-nilai kunci organisasi. <i>(ritual)</i></dd></div><div><dt><span class=\"en\">Material symbols</span></dt><dd>Benda, tata ruang, dan pakaian yang menyampaikan siapa yang penting dan perilaku apa yang diharapkan. <i>(simbol material)</i></dd></div><div><dt><span class=\"en\">Workforce diversity</span></dt><dd>Keadaan ketika anggota organisasi berbeda satu sama lain dalam ciri demografis, nilai, dan pengalaman. <i>(keberagaman tenaga kerja)</i></dd></div><div><dt><span class=\"en\">Surface-level diversity</span></dt><dd>Perbedaan ciri yang mudah terlihat (usia, jenis kelamin, suku, disabilitas) yang belum tentu mencerminkan cara berpikir seseorang. <i>(keberagaman permukaan)</i></dd></div><div><dt><span class=\"en\">Deep-level diversity</span></dt><dd>Perbedaan nilai, kepribadian, dan preferensi kerja yang makin penting setelah orang saling mengenal. <i>(keberagaman mendalam)</i></dd></div><div><dt><span class=\"en\">Inclusion</span></dt><dd>Keadaan ketika setiap anggota merasa dihargai, didengar, dan dapat berkontribusi penuh. Definisi kerja mata kuliah ini. <i>(inklusi)</i></dd></div><div><dt><span class=\"en\">Discrimination</span></dt><dd>Perlakuan tidak adil terhadap seseorang berdasarkan anggapan tentang kelompoknya, bukan kemampuan atau kinerjanya. <i>(diskriminasi)</i></dd></div><div><dt><span class=\"en\">Tasamuh</span></dt><dd>Sikap toleran dan menghargai perbedaan; salah satu sikap kemasyarakatan yang dipegang warga NU. <i>(toleransi)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Robbins, S. P., &amp; Judge, T. A. (2023). <i>Organizational behavior</i> (19th ed., Global ed.). Pearson.</li><li>Robbins, S. P., Coulter, M. A., &amp; Long, L. (2024). <i>Management</i> (16th ed.). Pearson.</li><li>Northouse, P. G. (2025). <i>Leadership: Theory and practice</i> (10th ed.). SAGE Publications.</li><li>Kementerian Agama Republik Indonesia. (2019). <i>Al-Qur'an dan terjemahannya</i> (Edisi penyempurnaan 2019). Lajnah Pentashihan Mushaf Al-Qur'an. https://quran.kemenag.go.id</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 6.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":6,"title":"Teori Kepemimpinan","subtitle":"Kepemimpinan dan kekuasaan, teori sifat, perilaku, dan situasional, kepemimpinan transformasional","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 6</span><span>Kepemimpinan dan Manajemen Organisasi · SI24W20</span></div><h1>Teori Kepemimpinan</h1><p class=\"lead\">Kepemimpinan dan kekuasaan, teori sifat, perilaku, dan situasional, kepemimpinan transformasional</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 6–7 · Sub-CPMK-4</div><div><b>Hari ini</b>Membaca gaya pemimpin + refleksi gaya diri</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menerapkan teori dan gaya kepemimpinan, termasuk kepemimpinan berbasis nilai, pada kasus organisasi (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2)</span></h3><ol><li>Ketepatan membedakan pendekatan sifat, perilaku, situasional, transformasional, dan servant leadership.</li><li>Ketepatan mengidentifikasi gaya kepemimpinan pimpinan organisasi mitra.</li><li>Ketepatan mengaitkan kepemimpinan dengan nilai shiddiq, amanah, tabligh, dan fathanah. <span class=\"muted\">(Pertemuan 7)</span></li><li>Kualitas presentasi hasil analisis. <span class=\"muted\">(Pertemuan 7)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-2</dt><dd>Mahasiswa mampu menerapkan kepemimpinan berbasis nilai (jujur, amanah, adil, dan kolaboratif) dalam memimpin tim dan perubahan.</dd><dt>CPL-1</dt><dd class=\"id\">Mampu mengintegrasikan sikap As Shidqu (kejujuran), Al Amanah Wal Wafa Bil Ahdi (bertanggung jawab), Al Adalah (selalu berpedoman pada norma dan peraturan yang berlaku) dan At Taawun (berkolaborasi) dalam perkembangan ilmu pengetahuan dan teknologi.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Proyek (Tugas 1: 10%) dan Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 5 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Sebutkan empat jalur budaya dipelajari.</li><li>Bedakan keberagaman permukaan dan mendalam dengan satu contoh.</li><li>Kapan budaya kuat justru menjadi beban?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Draf Tugas 1A dan 1B sudah dimulai?</li><li>Pimpinan mitra yang akan diwawancarai sudah jelas?</li><li>Ada catatan perilaku pimpinan dari wawancara sebelumnya?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>4 menit · berpasangan</span></div><h2>Pemimpin yang membuat Anda mau mengikuti</h2><div class=\"cols w\"><div><p class=\"lead\">Ingat satu pemimpin yang benar-benar Anda ikuti: ketua OSIS, pelatih, ustaz, kepala desa, atasan magang.</p><ol><li>Seperti apa <b>orangnya</b>?</li><li>Apa yang ia <b>lakukan</b>?</li><li>Apakah ia memperlakukan semua orang <b>sama</b>?</li><li>Mengapa Anda <b>menurut</b>?</li></ol></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Papan tulis: empat kolom</h3><ul><li><b>Orangnya</b>: jujur, tenang, cerdas…</li><li><b>Yang dilakukan</b>: memberi contoh, membagi tugas…</li><li><b>Tergantung siapa</b>: tegas ke yang baru, longgar ke senior…</li><li><b>Alasan menurut</b>: segan, kagum, takut, butuh…</li></ul><p class=\"muted\" style=\"font-size:.85em\">Keempat kolom ini adalah pintu ke teori hari ini.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Apa itu kepemimpinan?</h2><div class=\"cols wr\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Leadership is a process whereby an individual influences a group of individuals to achieve a common goal.\"</p><p class=\"tr\">\"<button type=\"button\" class=\"term\" data-term=\"leadership\">Kepemimpinan</button> adalah suatu proses di mana seorang individu memengaruhi sekelompok individu untuk mencapai suatu tujuan bersama.\"</p><div class=\"src\">Northouse (2025); terjemahan harfiah penyusun</div></blockquote><p class=\"muted\" style=\"font-size:.85em;margin:.4em 0 0\">Bedanya dengan manajemen sudah dibahas di Pertemuan 1.</p></div><div class=\"grid2\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Proses</h3><p>Interaksi dua arah, bukan sifat bawaan semata.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Pengaruh</h3><p>Inti kepemimpinan; tanpa pengaruh, tidak ada kepemimpinan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok</h3><p>Terjadi dalam kelompok, kecil atau besar.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Tujuan bersama</h3><p>Pemimpin dan pengikut menuju tujuan yang sama.</p></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kekuasaan</span><span>Indikator 1 dan 2</span></div><h2>Mengapa orang menurut?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Basis</th><th>Sumber pengaruh</th><th>Contoh di sekitar kita</th></tr></thead><tbody><tr><td colspan=\"3\"><b><button type=\"button\" class=\"term\" data-term=\"position-power\">Position power</button></b> · dari jabatan</td></tr><tr><td><button type=\"button\" class=\"term\" data-term=\"legitimate-power\">Legitimate</button></td><td>jabatan formal yang diakui</td><td>kaprodi menetapkan jadwal ujian</td></tr><tr><td><button type=\"button\" class=\"term\" data-term=\"reward-power\">Reward</button></td><td>bisa memberi imbalan</td><td>pemilik UMKM memberi bonus Lebaran</td></tr><tr><td><button type=\"button\" class=\"term\" data-term=\"coercive-power\">Coercive</button></td><td>bisa memberi sanksi</td><td>pengurus asrama memberi hukuman piket</td></tr><tr><td colspan=\"3\"><b><button type=\"button\" class=\"term\" data-term=\"personal-power\">Personal power</button></b> · dari diri pemimpin</td></tr><tr><td><button type=\"button\" class=\"term\" data-term=\"referent-power\">Referent</button></td><td>disukai dan diteladani</td><td>kiai yang dihormati santri dan warga</td></tr><tr><td><button type=\"button\" class=\"term\" data-term=\"expert-power\">Expert</button></td><td>keahlian dan pengetahuan</td><td>staf TI yang paling paham server</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.3em\">Lima basis <button type=\"button\" class=\"term\" data-term=\"power\">kekuasaan</button> French &amp; Raven (1959) dan pembagian posisi–pribadi, diadaptasi dari Northouse (2025) serta Yukl &amp; Gardner (2020). Contoh oleh dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta pendekatan</span><span>Tekan Play atau klik tiap tahap</span></div><h2>Lima pertanyaan, lima pendekatan</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;kmo6-peta&quot;,&quot;ms&quot;:3200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Sifat&quot;,&quot;en&quot;:&quot;Trait approach&quot;,&quot;d&quot;:&quot;Pertanyaan kunci: sifat apa yang membuat seseorang menjadi pemimpin? Fokus pada pribadi pemimpin.&quot;,&quot;ex&quot;:&quot;\\&quot;Pak Kades itu memang cerdas dan berwibawa sejak muda.\\&quot;&quot;},{&quot;t&quot;:&quot;Perilaku&quot;,&quot;en&quot;:&quot;Behavioral (style) approach&quot;,&quot;d&quot;:&quot;Pertanyaan kunci: apa yang dilakukan pemimpin? Fokus pada perilaku tugas dan perilaku hubungan.&quot;,&quot;ex&quot;:&quot;\\&quot;Ketua HIMA selalu membagi tugas jelas dan menanyakan kabar anggota.\\&quot;&quot;},{&quot;t&quot;:&quot;Situasional&quot;,&quot;en&quot;:&quot;Situational approach&quot;,&quot;d&quot;:&quot;Pertanyaan kunci: gaya apa yang cocok untuk anggota dan situasi ini? Gaya disesuaikan dengan tingkat perkembangan anggota.&quot;,&quot;ex&quot;:&quot;\\&quot;Kepala TU mengarahkan rinci staf baru, tetapi melepas staf senior.\\&quot;&quot;},{&quot;t&quot;:&quot;Transformasional&quot;,&quot;en&quot;:&quot;Transformational leadership&quot;,&quot;d&quot;:&quot;Pertanyaan kunci: bagaimana pemimpin menggerakkan pengikut melampaui kepentingan diri? Fokus pada visi, teladan, dan pengembangan pengikut.&quot;,&quot;ex&quot;:&quot;\\&quot;Bu Kepala UPT TIK membuat tim bangga mewujudkan kampus tanpa antre.\\&quot;&quot;},{&quot;t&quot;:&quot;Servant dan authentic&quot;,&quot;en&quot;:&quot;Pertemuan 7&quot;,&quot;d&quot;:&quot;Pertanyaan kunci: apakah pemimpin melayani pengikut dan jujur pada nilai dirinya? Dibahas bersama kepemimpinan berbasis nilai di Pertemuan 7.&quot;,&quot;ex&quot;:&quot;Teladan shiddiq, amanah, tabligh, fathanah.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Urutan pendekatan diadaptasi dari Northouse (2025). Contoh: kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pendekatan sifat</span><span>Indikator 1</span></div><h2>Apakah pemimpin itu dilahirkan?</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Intelligence</h3><p>Kemampuan verbal, nalar, dan persepsi yang baik.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01\"/></svg>Self-confidence</h3><p>Yakin pada kemampuan dan keputusannya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Determination</h3><p>Gigih, berinisiatif, tidak mudah menyerah.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Integrity</h3><p>Jujur, dapat dipercaya, bertanggung jawab.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Sociability</h3><p>Ramah, peka, dan pandai bergaul.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Kelemahan</h3><p>Daftar sifat tidak pasti dan tidak memperhatikan situasi.</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Lima sifat utama dalam <button type=\"button\" class=\"term\" data-term=\"trait-approach\">pendekatan sifat</button>, diadaptasi dari Northouse (2025); nama sifat sesuai sumber.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pendekatan perilaku</span><span>Indikator 1 dan 2</span></div><h2>Yang dilihat: apa yang dilakukan pemimpin</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"task-behavior\">Perilaku tugas</button></h3><ul><li>menetapkan target dan tenggat</li><li>membagi peran dan prosedur</li><li>memeriksa hasil kerja</li></ul><p class=\"muted\" style=\"font-size:.85em\">Ohio State: <i>initiating structure</i> · Michigan: <i>production orientation</i></p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z

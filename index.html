const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  mountW(v); startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea,select'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if((k===' '||k==='Enter')&&e.target.closest&&e.target.closest('button,a,summary'))return; /* let focused buttons work */
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage')&&!e.target.closest('input,textarea,.g2-svg'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Interactive widgets (v4.4) ----------
   Slide HTML holds <div class="sim" data-sim="type" data-cfg="{json}">, made by W() in data.js.
   Built-in types: quizset, stepper, grid2, scenario, peer. Course-specific types: SIMS in data.js.
   UI labels in English; all content comes from cfg (Indonesian). State lives in memory per widget id. */
const WST={};
let wTimers=[];
const WIDGETS={quizset:wQuiz,stepper:wStep,grid2:wGrid,scenario:wScen,peer:wPeer};
function mountW(scope){
  wTimers.forEach(clearInterval); wTimers=[];
  scope.querySelectorAll('[data-sim]').forEach(el=>{
    let cfg={}; try{cfg=JSON.parse(el.getAttribute('data-cfg')||'{}');}catch(e){}
    const id=cfg.id||'w'; if(!WST[id]) WST[id]={};
    const f=WIDGETS[el.dataset.sim]||(typeof SIMS!=='undefined'&&SIMS[el.dataset.sim]);
    if(!f){el.innerHTML='<p class="muted">Unknown widget.</p>';return;}
    try{f(el,cfg,WST[id]);}catch(e){el.innerHTML='<p class="muted">This simulation could not be loaded.</p>';if(window.console)console.error(e);}
  });
}
const kb=e=>e&&e.detail===0; // activated from keyboard
function refocus(el,sel){const b=el.querySelector(sel);if(b)b.focus({preventScroll:true});}

/* Quiz, one question at a time, with score */
function wQuiz(el,cfg,s){
  const Q=cfg.items||[]; if(s.i===undefined){s.i=0;s.ans=[];}
  const L='ABCDEF';
  const draw=()=>{
    if(s.i>=Q.length){
      const ok=Q.filter((q,i)=>s.ans[i]===q.a).length;
      el.innerHTML='<div class="qs-end"><div class="qs-score" aria-live="polite"><b>'+ok+'</b><span>/ '+Q.length+'</span></div><div><p class="qs-msg">'+(ok===Q.length?'Excellent!':ok>=Math.ceil(Q.length*.6)?'Good work.':'Review the material and try again.')+'</p>'+
        '<ol class="qs-rev">'+Q.map((q,i)=>'<li class="'+(s.ans[i]===q.a?'ok':'no')+'"><span>'+q.q+'</span><small>'+L[q.a]+'. '+q.o[q.a]+'</small></li>').join('')+'</ol>'+
        '<button type="button" class="wbtn" data-act="again">↺ Try again</button></div></div>';
      return;
    }
    const q=Q[s.i], a=s.ans[s.i], done=a!==undefined;
    el.innerHTML='<div class="qs-top"><span>Question '+(s.i+1)+' of '+Q.length+'</span><span class="qs-dots" aria-hidden="true">'+
      Q.map((x,i)=>'<i class="'+(i===s.i?'cur ':'')+(s.ans[i]===undefined?'':(s.ans[i]===x.a?'ok':'no'))+'"></i>').join('')+'</span></div>'+
      '<p class="q">'+q.q+'</p><div class="opts">'+q.o.map((o,i)=>'<button type="button" data-o="'+i+'" class="'+(done&&i===q.a?'right':'')+(done&&i===a&&i!==q.a?' wrong':'')+'"'+(done?' aria-disabled="true"':'')+'>'+L[i]+'. '+o+'</button>').join('')+'</div>'+
      '<p class="fb" aria-live="polite">'+(done?(a===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why:'')+'</p>'+
      '<div class="qs-nav"><button type="button" class="wbtn" data-act="prev"'+(s.i?'':' disabled')+'>← Back</button><button type="button" class="wbtn pri" data-act="next"'+(done?'':' disabled')+'>'+(s.i===Q.length-1?'See score':'Next question')+' →</button></div>';
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.dataset.o!==undefined){ if(s.ans[s.i]!==undefined) return; s.ans[s.i]=+b.dataset.o; draw(); if(kb(e)) refocus(el,'[data-act=next]'); return; }
    const act=b.dataset.act;
    if(act==='next') s.i++; else if(act==='prev') s.i=Math.max(0,s.i-1); else if(act==='again'){s.i=0;s.ans=[];}
    draw(); if(kb(e)) refocus(el,s.i>=Q.length?'[data-act=again]':'.opts button');
  };
  draw();
}

/* Animated step-by-step process (Play / ← →) */
function wStep(el,cfg,s){
  const S=cfg.steps||[]; if(s.i===undefined) s.i=0;
  el.innerHTML='<ol class="st-row" style="--n:'+S.length+'">'+S.map((x,i)=>'<li><button type="button" data-i="'+i+'"><span class="st-no">'+(i+1)+'</span><span class="st-t">'+x.t+'</span>'+(x.en?'<span class="st-en">'+x.en+'</span>':'')+'</button></li>').join('')+'</ol>'+
    '<div class="st-bar" aria-hidden="true"><i></i></div><div class="st-panel" aria-live="polite"></div>'+
    '<div class="st-nav"><button type="button" class="wbtn" data-act="prev" aria-label="Previous step">←</button><button type="button" class="wbtn pri" data-act="play">▶ Play</button><button type="button" class="wbtn" data-act="next" aria-label="Next step">→</button></div>';
  let timer=null;
  const playBtn=el.querySelector('[data-act=play]');
  const show=()=>{
    el.querySelectorAll('.st-row button').forEach((b,i)=>{b.classList.toggle('on',i===s.i);b.classList.toggle('done',i<s.i);b.setAttribute('aria-current',i===s.i?'step':'false');});
    el.querySelector('.st-bar i').style.width=(S.length>1?s.i/(S.length-1)*100:100)+'%';
    const p=el.querySelector('.st-panel'), x=S[s.i];
    p.classList.remove('in'); void p.offsetWidth;
    p.innerHTML='<h4>'+(s.i+1)+'. '+x.t+(x.en?' <span class="st-en">'+x.en+'</span>':'')+'</h4><p>'+x.d+'</p>'+(x.ex?'<p class="st-ex">'+x.ex+'</p>':'');
    p.classList.add('in');
  };
  const stop=()=>{ if(timer){clearInterval(timer);timer=null;} playBtn.textContent='▶ Play'; };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.i!==undefined){ stop(); s.i=+b.dataset.i; show(); return; }
    const act=b.dataset.act;
    if(act==='prev'){ stop(); s.i=Math.max(0,s.i-1); show(); }
    else if(act==='next'){ stop(); s.i=Math.min(S.length-1,s.i+1); show(); }
    else if(act==='play'){
      if(timer){ stop(); return; }
      if(s.i>=S.length-1){ s.i=0; show(); }
      playBtn.textContent='❚❚ Pause';
      timer=setInterval(()=>{ if(!el.isConnected||s.i>=S.length-1){ stop(); return; } s.i++; show(); }, cfg.ms||2800);
      wTimers.push(timer);
    }
  };
  show();
}

/* Two-axis simulation: sliders (or click/drag) move a point across labelled zones */
function wGrid(el,cfg,s){
  const Z=cfg.zones||[], max=cfg.max||10;
  if(s.x===undefined){ s.x=(cfg.init||[max/2,max/2])[0]; s.y=(cfg.init||[max/2,max/2])[1]; }
  const W=320,H=320,PL=40,PB=40,PT=10,PR=10;
  const X=v=>PL+v/max*(W-PL-PR), Y=v=>H-PB-v/max*(H-PB-PT);
  const zoneOf=()=>Z.find(z=>s.x>=z.r[0]&&s.x<=z.r[1]&&s.y>=z.r[2]&&s.y<=z.r[3])||Z[Z.length-1];
  const rects=Z.slice().reverse().map(z=>{const v=z.v||z.r, x0=X(v[0]),x1=X(v[1]),y0=Y(v[3]),y1=Y(v[2]); /* v: optional visual rect */
    return '<g class="g2-z" data-z="'+z.k+'"><rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" class="'+(z.cls||'s-box')+'"/><text x="'+((x0+x1)/2)+'" y="'+((y0+y1)/2+4)+'" text-anchor="middle" class="s-t" style="font-size:'+Math.min(13,Math.max(8,(x1-x0-6)/(String(z.en).length*.6))).toFixed(1)+'px">'+z.en+'</text></g>';}).join('');
  el.innerHTML='<div class="g2"><div class="g2-fig"><svg class="g2-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(cfg.aria||'Interactive grid')+'">'+rects+
    '<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'" class="s-line"/><line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(H-PB)+'" class="s-line"/>'+
    '<text x="'+((PL+W-PR)/2)+'" y="'+(H-12)+'" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.x.label+' →</text>'+
    '<text transform="translate(16 '+((PT+H-PB)/2)+') rotate(-90)" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.y.label+' →</text>'+
    '<text x="'+PL+'" y="'+(H-PB+16)+'" class="s-s" style="font-size:10px">'+(cfg.x.lo||'rendah')+'</text><text x="'+(W-PR)+'" y="'+(H-PB+16)+'" text-anchor="end" class="s-s" style="font-size:10px">'+(cfg.x.hi||'tinggi')+'</text>'+
    '<circle class="g2-dot" r="11" cx="'+X(s.x)+'" cy="'+Y(s.y)+'"/></svg></div>'+
    '<div class="g2-side"><label class="g2-sl"><span>'+cfg.x.label+' <b data-v="x">'+s.x+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.x+'" data-ax="x" aria-label="'+cfg.x.label+'"></label>'+
    '<label class="g2-sl"><span>'+cfg.y.label+' <b data-v="y">'+s.y+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.y+'" data-ax="y" aria-label="'+cfg.y.label+'"></label>'+
    '<div class="g2-out" aria-live="polite"></div></div></div>';
  const dot=el.querySelector('.g2-dot'), out=el.querySelector('.g2-out'); let last=null;
  const upd=()=>{
    dot.setAttribute('cx',X(s.x)); dot.setAttribute('cy',Y(s.y));
    el.querySelector('[data-v=x]').textContent=s.x; el.querySelector('[data-v=y]').textContent=s.y;
    el.querySelector('[data-ax=x]').value=s.x; el.querySelector('[data-ax=y]').value=s.y;
    const z=zoneOf(); el.querySelectorAll('.g2-z').forEach(g=>g.classList.toggle('on',g.dataset.z===z.k));
    if(last!==z.k){ last=z.k; out.classList.remove('in'); void out.offsetWidth;
      out.innerHTML='<div class="g2-name">'+z.name+(z.en?' <span>'+z.en+'</span>':'')+'</div>'+(z.tag?'<div class="g2-tag">'+z.tag+'</div>':'')+'<p>'+z.d+'</p>'+(z.ex?'<p class="g2-ex">'+z.ex+'</p>':'');
      out.classList.add('in'); }
  };
  el.oninput=e=>{const r=e.target.closest('input[type=range]'); if(!r) return; s[r.dataset.ax]=+r.value; upd();};
  const svg=el.querySelector('svg'); let drag=false;
  const fromPt=e=>{const m=svg.getScreenCTM(); if(!m) return; const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(m.inverse());
    s.x=Math.max(0,Math.min(max,Math.round((q.x-PL)/(W-PL-PR)*max))); s.y=Math.max(0,Math.min(max,Math.round((H-PB-q.y)/(H-PB-PT)*max))); upd();};
  svg.addEventListener('pointerdown',e=>{drag=true; try{svg.setPointerCapture(e.pointerId);}catch(_){} fromPt(e);});
  svg.addEventListener('pointermove',e=>{if(drag) fromPt(e);});
  svg.addEventListener('pointerup',()=>{drag=false;}); svg.addEventListener('pointercancel',()=>{drag=false;});
  upd();
}

/* Branching scenario: choices lead to feedback and new situations */
function wScen(el,cfg,s){
  const N=cfg.nodes||{};
  if(!s.node){ s.node=cfg.start; s.path=[]; s.fb=null; }
  const draw=()=>{
    const n=N[s.node]; let h='';
    if(s.path.length) h+='<div class="sc-path" aria-label="Choices so far">'+s.path.map((p,i)=>'<span class="sc-tag '+(p.k||'')+'">'+(i+1)+'. '+p.tag+'</span>').join('')+'</div>';
    if(s.fb){
      h+='<div class="sc-fb '+(s.fb.k||'')+'"><div class="sc-fbh">'+(s.fb.k==='good'?'✔':s.fb.k==='bad'?'✖':'◐')+' '+s.fb.tag+'</div><p>'+s.fb.fb+'</p></div><div class="sc-nav"><button type="button" class="wbtn pri" data-act="go">Continue →</button></div>';
    } else {
      h+='<div class="sc-scene">'+(n.text?'<p class="sc-text">'+n.text+'</p>':'')+(n.say||[]).map(b=>'<div class="sc-say"><b>'+b[0]+'</b><span>'+b[1]+'</span></div>').join('')+'</div>';
      if(n.end) h+='<div class="sc-end '+(n.k||'')+'"><div class="sc-fbh">'+n.title+'</div><p>'+n.end+'</p></div><div class="sc-nav"><button type="button" class="wbtn" data-act="restart">↺ Start again</button></div>';
      else h+='<p class="sc-ask">'+(n.ask||cfg.ask||'')+'</p><div class="sc-ch">'+n.ch.map((c,i)=>'<button type="button" data-c="'+i+'">'+c.t+'</button>').join('')+'</div>';
    }
    el.innerHTML=h;
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.c!==undefined){ const c=N[s.node].ch[+b.dataset.c]; s.fb={k:c.k,tag:c.tag,fb:c.fb,to:c.to}; s.path.push({tag:c.tag,k:c.k}); draw(); if(kb(e)) refocus(el,'[data-act=go]'); return; }
    if(b.dataset.act==='go'){ s.node=s.fb.to; s.fb=null; }
    else if(b.dataset.act==='restart'){ s.node=cfg.start; s.path=[]; s.fb=null; }
    draw(); if(kb(e)) refocus(el,'.sc-ch button,[data-act=restart]');
  };
  draw();
}

/* Peer assessment (formative): criteria x levels, comments, copyable summary.
   Draft is kept only in this browser (localStorage) and is never sent anywhere. */
function wPeer(el,cfg,s){
  const C=cfg.criteria||[], Lv=cfg.levels||['1','2','3','4'], K='peer:'+cfg.id, maxS=C.length*Lv.length;
  if(!s.v){ const d=store.get(K,null); s.v=d&&typeof d==='object'?d:{who:'',sc:{},good:'',tip:''}; if(!s.v.sc) s.v.sc={}; }
  const save=()=>store.set(K,s.v);
  const total=()=>C.reduce((a,c,i)=>a+(s.v.sc[i]||0),0);
  const filled=()=>C.filter((c,i)=>s.v.sc[i]).length;
  const band=t=>{const b=(cfg.bands||[]).slice().sort((x,y)=>y.min-x.min).find(x=>t>=x.min); return b?b.t:'';};
  const rowHTML=i=>{const c=C[i], v=s.v.sc[i]||0;
    return '<div class="pa-row" data-r="'+i+'"><div class="pa-c"><b>'+c.t+'</b>'+(c.ind?'<small>'+c.ind+'</small>':'')+'</div><div class="pa-lv" role="group" aria-label="'+c.t.replace(/<[^>]+>/g,'')+'">'+
      Lv.map((l,j)=>'<button type="button" data-r="'+i+'" data-l="'+(j+1)+'" aria-pressed="'+(v===j+1)+'" title="'+l+'">'+(j+1)+'</button>').join('')+
      '</div><div class="pa-d">'+(v?'<b>'+Lv[v-1]+':</b> '+c.d[v-1]:'<span class="muted">'+(cfg.pick||'Pick a level.')+'</span>')+'</div></div>';};
  const sumHTML=()=>{const t=total(), f=filled();
    return '<div class="pa-total"><span><b>'+t+'</b> / '+maxS+'</span><div class="pa-meter"><i style="width:'+(t/maxS*100)+'%"></i></div></div><div class="pa-band">'+(f===C.length?band(t):(f+' of '+C.length+' criteria rated'))+'</div>';};
  el.innerHTML='<div class="pa"><div class="pa-grid">'+C.map((c,i)=>rowHTML(i)).join('')+'</div>'+
    '<div class="pa-side"><label class="pa-f"><span>'+(cfg.whoLabel||'Peer')+'</span><input type="text" data-f="who" maxlength="80" value="'+String(s.v.who).replace(/"/g,'&quot;')+'" placeholder="'+(cfg.whoPh||'')+'"></label>'+
    '<label class="pa-f"><span>'+(cfg.goodLabel||'What went well')+'</span><textarea data-f="good" rows="2" maxlength="400" placeholder="'+(cfg.goodPh||'')+'"></textarea></label>'+
    '<label class="pa-f"><span>'+(cfg.tipLabel||'Suggestion')+'</span><textarea data-f="tip" rows="2" maxlength="400" placeholder="'+(cfg.tipPh||'')+'"></textarea></label>'+
    '<div class="pa-sum" aria-live="polite">'+sumHTML()+'</div>'+
    '<div class="pa-act"><button type="button" class="wbtn pri" data-act="copy">Copy summary</button><button type="button" class="wbtn" data-act="clear">Clear</button><span class="pa-msg" aria-live="polite"></span></div></div></div>';
  el.querySelector('[data-f=good]').value=s.v.good||''; el.querySelector('[data-f=tip]').value=s.v.tip||'';
  const msg=t=>{const m=el.querySelector('.pa-msg'); m.textContent=t; setTimeout(()=>{if(m.textContent===t)m.textContent='';},2500);};
  el.oninput=e=>{const f=e.target.dataset&&e.target.dataset.f; if(!f) return; s.v[f]=e.target.value; save();};
  const plain=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
  const text=()=>[plain(cfg.title||'Peer assessment'),(cfg.whoLabel||'Peer')+': '+(s.v.who||'-')]
    .concat(C.map((c,i)=>'- '+plain(c.t)+': '+(s.v.sc[i]?s.v.sc[i]+' ('+Lv[s.v.sc[i]-1]+')':'-')))
    .concat(['Total: '+total()+' / '+maxS+(filled()===C.length?' · '+plain(band(total())):''),(cfg.goodLabel||'What went well')+': '+(s.v.good||'-'),(cfg.tipLabel||'Suggestion')+': '+(s.v.tip||'-')]).join('\n');
  const copy=()=>{const t=text();
    const fallback=()=>{const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ok=document.execCommand('copy');}catch(_){} ta.remove(); msg(ok?'Copied.':'Copy failed. Select the text manually.');};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>msg('Copied.'),fallback); else fallback();};
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.l){ const i=+b.dataset.r; s.v.sc[i]=+b.dataset.l; save();
      const r=el.querySelector('.pa-row[data-r="'+i+'"]'); r.outerHTML=rowHTML(i); el.querySelector('.pa-sum').innerHTML=sumHTML();
      if(kb(e)) refocus(el,'.pa-row[data-r="'+i+'"] [data-l="'+b.dataset.l+'"]'); return; }
    if(b.dataset.act==='copy') copy();
    else if(b.dataset.act==='clear'){ s.v={who:'',sc:{},good:'',tip:''}; save(); wPeer(el,cfg,s); msg('Cleared.'); }
  };
}

<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --surface-2:#ECF0EF; --ink:#2C2E31; --ink-2:#45474B; --muted:#646A6F;
  --line:#D9DFDD; --primary:#495E57; --primary-ink:#FFFFFF; --primary-soft:#E3EBE8;
  --accent:#F4CE14; --accent-soft:#FCF3C4; --accent-ink:#2C2E31;
  --green:#0F7A45; --warn:#C2410C; --warn-soft:#FDE9DD; --ok:#2E7D4F; --ok-soft:#E1F2E7; --bad:#B42318; --bad-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(35,45,40,.06),0 8px 24px rgba(35,45,40,.08);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:288px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
    --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
    --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
    --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
  --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
  --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
  --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.app.collapsed{grid-template-columns:0 1fr}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s ease}
.app.collapsed .side{transform:translateX(-100%);visibility:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{width:44px;height:auto;flex:none}
.brand b{display:block;color:var(--ink);font-size:15px;line-height:1.25}
.brand span{font-size:12px;color:var(--muted)}
.side h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 18px 6px;font-weight:700}
.mlist{list-style:none;margin:0;padding:0 10px 18px;display:grid;gap:2px}
.mbtn{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:10px;cursor:pointer}
.mbtn:hover{background:var(--surface-2)}
.mbtn[aria-current="true"]{background:var(--primary-soft)}
.mbtn .no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--primary);background:var(--surface-2);border-radius:7px;text-align:center;padding:3px 0}
.mbtn[aria-current="true"] .no{background:var(--primary);color:var(--primary-ink)}
.mbtn .t{font-size:13.5px;line-height:1.3;color:var(--ink)}
.mbtn.soon .t{color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.tag.soon{background:var(--surface-2);color:var(--muted)}
.tag.exam{background:var(--warn-soft);color:var(--warn)}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* Top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .title{flex:1;min-width:160px;font-weight:700;color:var(--ink);font-size:15px;line-height:1.3}
.top .title small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.ibtn:hover{border-color:var(--primary)}
.ibtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.ibtn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.seg svg{width:16px;height:16px}

/* Slide mode */
.view{padding:20px 16px 40px;width:100%;max-width:1320px;margin:0 auto}
.stage{container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.stage .slide{position:absolute;inset:0;overflow:auto;font-size:clamp(9px,1.55cqw,30px)}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ctrl .count{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.hint{font-size:12px;color:var(--muted)}
.notes{margin-top:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;padding:12px 16px;color:var(--ink)}
.notes h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.notes p,.notes li{margin:.25em 0;font-size:14.5px}
.notes ul{margin:.2em 0;padding-left:1.2em}
:fullscreen .stage, .stage:fullscreen{border-radius:0;border:0}
.stage:fullscreen{background:var(--surface)}

/* Read mode */
.read{max-width:880px;margin:0 auto;display:grid;gap:18px}
.read .slide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:16.5px}
.read .notes{margin-top:-8px}

/* Slide content */
.slide{padding:2.6em 3.4em;color:var(--ink-2)}
.slide h1,.slide h2{color:var(--ink);line-height:1.15;text-wrap:balance;margin:0 0 .55em;letter-spacing:-.01em}
.slide h2{font-size:2em;font-weight:800}
.slide h1{font-size:2.9em;font-weight:800}
.slide h3{color:var(--ink);font-size:1.15em;margin:0 0 .35em}
.slide p{margin:.35em 0}
.slide ul,.slide ol{margin:.3em 0;padding-left:1.25em}
.slide li{margin:.32em 0}
.slide li::marker{color:var(--primary);font-weight:700}
.eyebrow{font-family:var(--mono);font-size:.78em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:.6em;display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.eyebrow .chip{background:var(--primary-soft);padding:.15em .6em;border-radius:99px}
.lead{font-size:1.2em;color:var(--ink)}
.muted{color:var(--muted)}
.id{color:var(--muted);font-style:italic}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;align-items:start}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.w{grid-template-columns:1.25fr 1fr}
.card{background:var(--surface-2);border-radius:.8em;padding:.9em 1.1em}
.card h3{display:flex;gap:.45em;align-items:center}
.card p{font-size:.95em}
.card.hl{background:var(--accent-soft)}
.card.warn{background:var(--warn-soft)}
.card.warn h3{color:var(--warn)}
.card.ok{background:var(--ok-soft)}
.ic{width:1.3em;height:1.3em;flex:none;color:var(--primary)}
.warn .ic{color:var(--warn)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.8em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em}
.big{font-size:1.5em;font-weight:800;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;align-items:baseline}
.kv dt{font-family:var(--mono);font-size:.8em;font-weight:600;color:var(--primary);white-space:nowrap}
.kv dd{margin:0}
.callout{border-left:.3em solid var(--accent);background:var(--accent-soft);padding:.7em 1em;border-radius:0 .6em .6em 0;color:var(--ink)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.quote{font-size:1.25em;font-weight:600;color:var(--ink);line-height:1.4}
table.t{border-collapse:collapse;width:100%;font-size:.95em}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.45em .6em;text-align:left;vertical-align:top}
table.t th{color:var(--ink);font-size:.85em;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.phrase{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.1em .45em;border-radius:.35em;color:var(--ink)}

/* Title slide */
.cover{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.3em;background:
  radial-gradient(60em 30em at 110% -10%,var(--primary-soft),transparent 60%),
  linear-gradient(transparent 0 0)}
.cover .logo{width:5.2em;margin-bottom:1em}
.cover .meta{margin-top:1.6em;display:flex;gap:2.2em;flex-wrap:wrap;font-size:.9em}
.cover .meta b{display:block;color:var(--ink)}
.cover .strip{position:absolute;left:0;right:0;bottom:0;height:.55em;background:linear-gradient(90deg,var(--primary) 0 60%,var(--accent) 60% 100%)}
.read .cover{min-height:26em;position:relative}

/* Figures */
figure.fig{margin:.6em 0 0}
figure.fig svg{width:100%;height:auto;max-height:17em;display:block;color:var(--ink)}
figure.fig figcaption{font-size:.82em;color:var(--muted);margin-top:.4em}
.s-box{fill:var(--surface);stroke:var(--primary);stroke-width:2}
.s-soft{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.s-hl{fill:var(--accent);stroke:none}
.s-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.s-line{stroke:currentColor;stroke-width:2;fill:none}
.s-dash{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 6;fill:none}
.s-warnline{stroke:var(--warn);stroke-width:2.2;fill:none}
.s-t{fill:currentColor;font-family:var(--font);font-size:15px;font-weight:700}
.s-s{fill:var(--muted);font-family:var(--font);font-size:12.5px;font-weight:500}
.s-tw{fill:var(--warn);font-family:var(--font);font-size:13px;font-weight:700}
.s-ta{fill:var(--accent-ink);font-family:var(--font);font-size:15px;font-weight:800}
.s-hd{fill:var(--primary);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em}

/* Assessment bar */
.assess{display:flex;height:3.4em;border-radius:.6em;overflow:hidden;margin:.6em 0 .4em;font-size:.9em}
.assess div{display:flex;flex-direction:column;justify-content:center;padding:0 .8em;color:var(--primary-ink);min-width:0}
.assess div b{font-size:1.15em}
.assess .a1{background:var(--primary)}
.assess .a2{background:var(--accent);color:var(--accent-ink)}
.assess .a3{background:color-mix(in srgb,var(--primary) 70%,var(--ink))}
.assess .a4{background:var(--warn);color:#fff}
.weeks{display:grid;grid-template-columns:repeat(16,1fr);gap:.25em;margin-top:.8em}
.weeks span{font-family:var(--mono);font-size:.7em;text-align:center;padding:.35em 0;border-radius:.35em;background:var(--surface-2);color:var(--muted)}
.weeks span.ex{background:var(--warn-soft);color:var(--warn);font-weight:700}
.weeks span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* Chat mockup */
.chat{background:var(--surface-2);border-radius:.8em;padding:.8em;display:grid;gap:.45em;font-size:.92em}
.chat .who{font-size:.75em;color:var(--muted);font-weight:700}
.bub{max-width:88%;padding:.45em .7em;border-radius:.8em;background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.bub.me{justify-self:end;background:var(--primary-soft)}
.bub small{display:block;color:var(--muted);font-size:.72em;text-align:right}

/* Glossary term + tooltip */
.term{border-bottom:2px dotted var(--primary);cursor:help;color:inherit;font-weight:600;background:none;padding:0;border-top:0;border-left:0;border-right:0;font-size:inherit;line-height:inherit;font-family:inherit}
.tip{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);pointer-events:none}
.tip b{display:block;font-size:14px}
.tip i{display:block;color:var(--accent);font-style:normal;font-weight:700;font-size:12.5px;margin-top:4px}
.gl dt{font-weight:700;color:var(--ink)}
.gl dd{margin:0 0 .5em}
.gl dd i{color:var(--primary);font-style:normal;font-weight:600}
.gl{columns:2;column-gap:2em;font-size:.92em}
.gl div{break-inside:avoid}

/* Quiz */
.quiz{display:grid;gap:.5em;margin-bottom:.9em}
.quiz .q{font-weight:700;color:var(--ink);margin:0}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.quiz button{border:1px solid var(--line);background:var(--surface);border-radius:.55em;padding:.45em .7em;text-align:left;cursor:pointer;font-size:.92em}
.quiz button:hover{border-color:var(--primary)}
.quiz button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.quiz button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.quiz .fb{font-size:.88em;margin:0;min-height:1.3em;color:var(--ink)}

/* Placeholder */
.soonbox{display:flex;flex-direction:column;justify-content:center;height:100%}
.soonbox .pill{align-self:flex-start;margin-bottom:1em}

/* Closing */
.closing{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;background:radial-gradient(50em 26em at 50% 120%,var(--accent-soft),transparent 70%)}
.read .closing{min-height:24em}
.closing h1{font-size:3.6em;margin-bottom:.2em}
.closing .qwrap{max-width:34em;min-height:6.5em;position:relative;z-index:2}
.closing .qt{font-size:1.3em;font-weight:600;color:var(--ink);line-height:1.4;transition:opacity .5s}
.closing .qa{margin-top:.5em;color:var(--muted);font-size:.9em;transition:opacity .5s}
.closing .emo{position:absolute;inset:0;pointer-events:none;z-index:1}
.closing .emo span{position:absolute;bottom:-2em;font-size:1.8em;opacity:.8;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14em) translateX(1em) rotate(12deg)}100%{transform:translateY(-30em) translateX(-1em) rotate(-8deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.closing .emo span{animation:none;display:none}.side{transition:none}.bar i{transition:none}}

/* Menu button for phone */
.menu-t{display:none}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:50;transform:translateX(-100%);box-shadow:var(--shadow);visibility:hidden}
  .app.open .side{transform:none;visibility:visible}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .top .lbl{display:none}
  .slide{padding:1.8em 2em}
  .read .slide{padding:1.4em 1.2em}
  .cols,.cols.w,.cols.c3{grid-template-columns:1fr}
  .grid5,.grid4{grid-template-columns:1fr 1fr}
  .quiz .opts{grid-template-columns:1fr}
  .gl{columns:1}
}
@media print{.side,.top,.ctrl{display:none}}



/* ===== Revisi v2 ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.cite{color:var(--muted);font-weight:500;font-size:.85em;white-space:nowrap}
.en{font-style:italic}
.notes dl.nt{margin:.2em 0 0;display:grid;gap:.15em}
.notes dl.nt dt{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-top:.55em}
.notes dl.nt dt:first-child{margin-top:.1em}
.notes dl.nt dd{margin:0;font-size:14.5px;line-height:1.55}
.notes dl.nt dd ul,.notes dl.nt dd ol{margin:.2em 0;padding-left:1.2em}
ol.refs{list-style:none;padding:0;margin:.4em 0 0;display:grid;gap:.55em}
ol.refs li{padding-left:2.2em;text-indent:-2.2em;margin:0;line-height:1.45}
.closing .emo span{opacity:.4}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
.grid3>*,.grid4>*,.grid5>*,.cols>*{min-width:0}
.card{overflow-wrap:break-word}
@media (max-width:600px){.grid3,.grid5,.grid4{grid-template-columns:1fr!important}.read .slide{font-size:15.5px}}
.card.obek{font-size:.84em}
.stage .gl{columns:3;column-gap:1.6em;font-size:.8em}
.stage .gl dd{margin-bottom:.35em}
.stage .quiz{gap:.28em;margin-bottom:.45em}
.stage .quiz button{padding:.32em .6em}
.stage .quiz .fb{min-height:1.1em}
.read{grid-template-columns:minmax(0,1fr)}.view{min-width:0}
.notes .nhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.notes .nhead h4{margin:0}
.lockb{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.lockb svg{width:13px;height:13px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal form{width:min(380px,100%);background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--ink);display:flex;gap:8px;align-items:center}
.modal h2 svg{width:18px;height:18px;color:var(--primary)}
.modal p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.modal input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.modal input:focus{outline:3px solid var(--accent);outline-offset:1px}
.modal .err{color:var(--bad);font-size:13px;min-height:1.3em;margin:6px 0 10px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.modal .row button.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ===== Revisi v3.1 (MPSI): URL panjang di referensi, slide padat ===== */
ol.refs li{overflow-wrap:anywhere}
.stage ol.refs{font-size:.9em;gap:.4em}
.stage .gl{font-size:.74em}


/* ===== Revisi v3.3 (KMO): judul berkata panjang di HP, kuis lebih rapat ===== */
@media (max-width:600px){.read .soonbox h1,.read .cover h1,.read .closing h1{font-size:2.1em;overflow-wrap:break-word;hyphens:auto}}
.stage .quiz{gap:.2em;margin-bottom:.35em}
.stage .quiz .opts{gap:.25em}

</style>

const GLOSSARY={"organization":{"t":"Organization","d":"Susunan orang-orang yang disengaja untuk mencapai suatu tujuan tertentu.","id":"organisasi"},"management":{"t":"Management","d":"Kegiatan mengoordinasikan dan mengawasi pekerjaan orang lain agar selesai secara efisien dan efektif.","id":"manajemen"},"efficiency":{"t":"Efficiency","d":"Mendapatkan hasil sebesar mungkin dari masukan (waktu, uang, tenaga) sekecil mungkin; \"doing things right\".","id":"efisiensi"},"effectiveness":{"t":"Effectiveness","d":"Mengerjakan kegiatan yang memang membantu organisasi mencapai tujuannya; \"doing the right things\".","id":"efektivitas"},"planning":{"t":"Planning","d":"Fungsi manajemen untuk menetapkan tujuan, menyusun strategi, dan membuat rencana kerja.","id":"perencanaan"},"organizing":{"t":"Organizing","d":"Fungsi manajemen untuk menentukan pekerjaan apa yang dilakukan, oleh siapa, dan bagaimana dikelompokkan.","id":"pengorganisasian"},"leading":{"t":"Leading","d":"Fungsi manajemen untuk memotivasi, mengarahkan, dan memengaruhi orang agar bekerja mencapai tujuan.","id":"kepemimpinan / pengarahan"},"controlling":{"t":"Controlling","d":"Fungsi manajemen untuk memantau kinerja, membandingkannya dengan tujuan, dan melakukan koreksi.","id":"pengendalian"},"actuating":{"t":"Actuating","d":"Istilah Terry untuk fungsi menggerakkan anggota agar melaksanakan rencana; sepadan dengan leading.","id":"penggerakan"},"managerial-roles":{"t":"Managerial roles","d":"Kelompok perilaku yang diharapkan dari seorang manajer; Mintzberg menyebut sepuluh peran.","id":"peran manajerial"},"conceptual-skills":{"t":"Conceptual skills","d":"Kemampuan melihat organisasi secara utuh, memahami keterkaitan bagian-bagiannya, dan berpikir abstrak.","id":"keterampilan konseptual"},"human-skills":{"t":"Human skills","d":"Kemampuan bekerja sama dengan orang lain, baik perorangan maupun kelompok.","id":"keterampilan hubungan antarmanusia"},"scientific-management":{"t":"Scientific management","d":"Pendekatan Taylor yang memakai metode ilmiah untuk menentukan cara terbaik mengerjakan suatu pekerjaan.","id":"manajemen ilmiah"},"bureaucracy":{"t":"Bureaucracy","d":"Bentuk organisasi menurut Weber yang dicirikan pembagian kerja, hierarki jelas, aturan tertulis, dan hubungan impersonal.","id":"birokrasi"},"systems-approach":{"t":"Systems approach","d":"Memandang organisasi sebagai sistem terbuka yang saling bergantung dan berinteraksi dengan lingkungannya.","id":"pendekatan sistem"},"contingency-approach":{"t":"Contingency approach","d":"Pandangan bahwa tidak ada satu cara terbaik; cara mengelola bergantung pada situasi.","id":"pendekatan kontingensi / situasional"},"stakeholder":{"t":"Stakeholder","d":"Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh keputusan organisasi.","id":"pemangku kepentingan"},"goal":{"t":"Goal","d":"Hasil atau sasaran yang ingin dicapai organisasi, kelompok, atau individu.","id":"tujuan"},"vision":{"t":"Vision","d":"Gambaran masa depan jangka panjang yang ingin diwujudkan organisasi.","id":"visi"},"mission":{"t":"Mission","d":"Pernyataan tentang alasan keberadaan organisasi: apa yang dikerjakan, untuk siapa, dan bagaimana.","id":"misi"},"smart":{"t":"S.M.A.R.T.","d":"Kriteria penulisan tujuan menurut Doran (1981): Specific, Measurable, Assignable, Realistic, Time-related.","id":"kriteria tujuan SMART"},"strategy":{"t":"Strategy","d":"Rencana tentang apa yang akan dilakukan organisasi, bagaimana bersaing atau melayani, dan cara menarik serta memuaskan pengguna.","id":"strategi"},"strategic-management":{"t":"Strategic management","d":"Apa yang dilakukan manajer untuk mengembangkan strategi organisasi.","id":"manajemen strategis"},"swot":{"t":"SWOT analysis","d":"Analisis kekuatan dan kelemahan internal serta peluang dan ancaman eksternal organisasi.","id":"analisis SWOT"},"tows":{"t":"TOWS matrix","d":"Matriks Weihrich (1982) yang memasangkan faktor internal dan eksternal untuk merumuskan strategi SO, ST, WO, dan WT.","id":"matriks TOWS"},"core-competency":{"t":"Core competency","d":"Keahlian atau kemampuan utama organisasi yang menciptakan nilai dan sulit ditiru.","id":"kompetensi inti"},"resources":{"t":"Resources","d":"Aset yang dimiliki organisasi: keuangan, fisik, manusia, informasi, dan reputasi.","id":"sumber daya"}};
const QUOTES=[{"q":"There is surely nothing quite so useless as doing with great efficiency what should not be done at all.","a":"Peter F. Drucker","s":"\"Managing for Business Effectiveness\", Harvard Business Review, May 1963"},{"q":"Managers are people who do things right and leaders are people who do the right thing.","a":"Warren Bennis & Burt Nanus","s":"Leaders: The Strategies for Taking Charge, 1985"},{"q":"The first responsibility of a leader is to define reality. The last is to say thank you. In between, the leader is a servant.","a":"Max De Pree","s":"Leadership Is an Art, 1987"},{"q":"The servant-leader is servant first.","a":"Robert K. Greenleaf","s":"The Servant as Leader, 1970"},{"q":"All of you are guardians. The Imam (ruler) is the guardian of his subjects and is responsible for them.","a":"Prophet Muhammad ﷺ","s":"Sahih al-Bukhari 893 (tr. M. Muhsin Khan)"}];
const MEETINGS=[{"no":1,"title":"Organisasi, Manajemen & Evolusi Teori","subtitle":"Konsep organisasi, fungsi dan peran manajer, evolusi teori manajemen","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 1</span><span>Kepemimpinan dan Manajemen Organisasi · SI24W20</span></div><h1>Organisasi, Manajemen &amp; Evolusi Teori</h1><p class=\"lead\">Konsep organisasi, fungsi dan peran manajer, evolusi teori manajemen</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Program Studi</b>Sistem Informasi, Unusida</div><div><b>Semester</b>3 · 3 SKS</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-1</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan konsep organisasi, manajemen, dan evolusi teori manajemen (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian </h3><ol><li>Ketepatan menjelaskan unsur dan jenis organisasi.</li><li>Ketepatan menjelaskan fungsi manajemen (POAC).</li><li>Ketepatan membedakan aliran teori manajemen klasik, perilaku, dan kontemporer.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis fungsi manajemen, struktur, dan budaya organisasi secara logis, kritis, dan sistematis dengan memperhatikan keberagaman.</dd><dt>CPL-6</dt><dd class=\"id\">Mampu menerapkan pemikiran logis, kritis, sistematis, dan inovatif dalam pengembangan serta implementasi sistem informasi, dengan memperhatikan nilai humaniora dan keberagaman budaya.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta perkuliahan</span><span>16 pertemuan · 3 SKS · Experiential Learning</span></div><h2>Belajar memimpin dengan mengalami</h2><p>Setiap kelompok mendampingi <b>satu organisasi mitra nyata</b> (UMKM, instansi pemerintah, organisasi kemahasiswaan, atau pesantren/lembaga NU) sepanjang semester.</p><div class=\"assess\" role=\"img\" aria-label=\"Penilaian: Tugas 1 30 persen, UTS 20 persen, Tugas 2 30 persen, UAS 20 persen\"><div class=\"a1\" style=\"width:30%\"><b>30%</b>Tugas 1</div><div class=\"a2\" style=\"width:20%\"><b>20%</b>UTS</div><div class=\"a3\" style=\"width:30%\"><b>30%</b>Tugas 2</div><div class=\"a4\" style=\"width:20%\"><b>20%</b>UAS</div></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Tugas 1 · Menganalisis organisasi</h3><p>Visi dan SWOT, struktur, budaya dan keberagaman, serta gaya kepemimpinan pimpinan mitra. Dipresentasikan di Pertemuan 7.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Tugas 2 · Proyek kepemimpinan</h3><p>Refleksi simulasi memimpin tim, OKR dan KPI, analisis keputusan etis, serta rancangan program pengembangan organisasi mitra.</p></div></div><div class=\"weeks\" aria-hidden=\"true\"><span class=\"on\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"ex\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"\">12</span><span class=\"\">13</span><span class=\"\">14</span><span class=\"\">15</span><span class=\"ex\">16</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kontrak kuliah</span><span>Kita sepakati bersama</span></div><h2>Kesepakatan kelas kita</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tepat waktu</h3><p>Hadir sebelum kelas dimulai. Tugas dikumpulkan sesuai tenggat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kerja tim</h3><p>Setiap anggota punya peran dan kontribusi yang tercatat (<i>At Taawun</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Menjaga mitra</h3><p>Santun, menepati janji, dan menjaga kerahasiaan informasi mitra (<i>Al Amanah</i>).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur</h3><p>Data observasi apa adanya. Hasil AI generatif tidak diakui sebagai tulisan sendiri (<i>As Shidqu</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Adil &amp; terbuka</h3><p>Pendapat berbeda dihargai; keputusan kelompok lewat musyawarah (<i>Al Adalah</i>).</p></div></div><p class=\"muted\" style=\"margin-top:1em\">Ketentuan lain (kehadiran, keterlambatan pengumpulan) mengikuti peraturan akademik Unusida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>5 menit · berpasangan</span></div><h2>Organisasi yang pernah Anda ikuti</h2><div class=\"cols w\"><div><p class=\"lead\">Pilih satu organisasi yang pernah Anda ikuti: OSIS, HIMA, IPNU/IPPNU, karang taruna, remaja masjid, tim lomba, atau tempat kerja.</p><ol><li>Apa <b>tujuannya</b>?</li><li>Siapa saja <b>anggotanya</b>, dan bagaimana tugas dibagi?</li><li>Satu momen organisasi itu <b>berjalan baik</b>, dan satu momen <b>kacau</b>. Apa penyebabnya?</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Petunjuk</h3><p>Perhatikan apakah masalahnya soal <b>rencana</b>, <b>pembagian tugas</b>, <b>cara memimpin</b>, atau <b>pemantauan</b>.</p><p class=\"muted\">Jawaban Anda akan kita pakai di slide fungsi manajemen.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Apa itu organisasi?</h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\"><button type=\"button\" class=\"term\" data-term=\"organization\">Organisasi</button> adalah susunan orang-orang yang disengaja untuk mencapai suatu tujuan tertentu.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(Robbins et al., 2024, terjemahan bebas)</span></div></div><h3 style=\"margin-top:.9em\">Tiga unsur organisasi</h3><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Tujuan</h3><p>Ada tujuan yang jelas dan khas.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Orang</h3><p>Tujuan dicapai lewat orang-orang.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Struktur</h3><p>Ada susunan yang disengaja: peran, aturan, hubungan kerja.</p></div></div></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Jenis organisasi</h3><ul><li><b>Bisnis</b> (mencari laba): UMKM, startup, BUMN</li><li><b>Pemerintah</b>: kelurahan, dinas, kementerian</li><li><b>Pendidikan</b>: sekolah, perguruan tinggi</li><li><b>Keagamaan &amp; sosial</b>: pesantren, lembaga NU, takmir masjid, LSM</li><li><b>Kemahasiswaan</b>: HIMA, BEM, UKM</li></ul><p class=\"muted\" style=\"font-size:.82em\">Dilihat dari tujuannya: profit dan nirlaba; dari bentuknya: formal dan informal. Pengelompokan jenis adalah definisi kerja mata kuliah ini.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2>Apa itu manajemen?</h2><div class=\"callout\"><span class=\"quote\" style=\"font-size:1.05em\"><button type=\"button\" class=\"term\" data-term=\"management\">Manajemen</button> adalah kegiatan mengoordinasikan dan mengawasi pekerjaan orang lain agar selesai secara efisien dan efektif.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(Robbins et al., 2024, terjemahan bebas)</span></div></div><figure class=\"fig\"><svg viewBox=\"0 0 860 190\" style=\"max-height:10em\" role=\"img\" aria-label=\"Dua kotak. Kiri: efisiensi, berkaitan dengan cara atau means, memakai sumber daya sehemat mungkin, rendah pemborosan. Kanan: efektivitas, berkaitan dengan tujuan atau ends, mencapai tujuan. Di tengah: manajemen yang baik mengejar keduanya.\"><rect x=\"10\" y=\"20\" width=\"330\" height=\"150\" rx=\"14\" class=\"s-soft\"/><text x=\"175\" y=\"52\" text-anchor=\"middle\" class=\"s-hd\">EFFICIENCY · MEANS</text><text x=\"175\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">Cara: hemat sumber daya</text><text x=\"175\" y=\"110\" text-anchor=\"middle\" class=\"s-s\">pemborosan rendah</text><text x=\"175\" y=\"132\" text-anchor=\"middle\" class=\"s-s\">\"doing things right\"</text><rect x=\"520\" y=\"20\" width=\"330\" height=\"150\" rx=\"14\" class=\"s-acc\"/><text x=\"685\" y=\"52\" text-anchor=\"middle\" class=\"s-hd\">EFFECTIVENESS · ENDS</text><text x=\"685\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">Hasil: tujuan tercapai</text><text x=\"685\" y=\"110\" text-anchor=\"middle\" class=\"s-s\">pencapaian tinggi</text><text x=\"685\" y=\"132\" text-anchor=\"middle\" class=\"s-s\">\"doing the right things\"</text><circle cx=\"430\" cy=\"95\" r=\"58\" class=\"s-box\"/><text x=\"430\" y=\"90\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Manajemen</text><text x=\"430\" y=\"110\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">mengejar keduanya</text></svg><figcaption>Efisiensi dan efektivitas dalam manajemen, diadaptasi dari Robbins et al. (2024). Istilah ditulis sesuai sumber.</figcaption></figure><p style=\"margin-top:.4em\"><button type=\"button\" class=\"term\" data-term=\"efficiency\">Efisien</button> tetapi tidak <button type=\"button\" class=\"term\" data-term=\"effectiveness\">efektif</button> = hemat, tetapi mengerjakan hal yang salah.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Fungsi manajemen</span><span>Indikator 2</span></div><h2>Empat fungsi manajemen</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 250\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Empat fungsi manajemen berurutan dengan panah: planning, organizing, leading, controlling, lalu kembali ke planning. Di bawahnya padanan POAC menurut Terry: planning, organizing, actuating, controlling. Leading sepadan dengan actuating.\"><defs><marker id=\"pc\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"10\" y=\"20\" class=\"s-hd\">POLC · ROBBINS ET AL. (2024)</text><rect x=\"10\" y=\"32\" width=\"196\" height=\"96\" rx=\"12\" class=\"s-soft\"/><text x=\"108\" y=\"64\" text-anchor=\"middle\" class=\"s-t\">Planning</text><text x=\"108\" y=\"88\" text-anchor=\"middle\" class=\"s-s\">tujuan, strategi,</text><text x=\"108\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">rencana</text><line x1=\"208\" y1=\"80\" x2=\"230\" y2=\"80\" class=\"s-line\" marker-end=\"url(#pc)\"/><rect x=\"232\" y=\"32\" width=\"196\" height=\"96\" rx=\"12\" class=\"s-soft\"/><text x=\"330\" y=\"64\" text-anchor=\"middle\" class=\"s-t\">Organizing</text><text x=\"330\" y=\"88\" text-anchor=\"middle\" class=\"s-s\">tugas, siapa,</text><text x=\"330\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">struktur</text><line x1=\"430\" y1=\"80\" x2=\"452\" y2=\"80\" class=\"s-line\" marker-end=\"url(#pc)\"/><rect x=\"454\" y=\"32\" width=\"196\" height=\"96\" rx=\"12\" class=\"s-acc\"/><text x=\"552\" y=\"64\" text-anchor=\"middle\" class=\"s-t\">Leading</text><text x=\"552\" y=\"88\" text-anchor=\"middle\" class=\"s-s\">memotivasi,</text><text x=\"552\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">mengarahkan</text><line x1=\"652\" y1=\"80\" x2=\"674\" y2=\"80\" class=\"s-line\" marker-end=\"url(#pc)\"/><rect x=\"676\" y=\"32\" width=\"196\" height=\"96\" rx=\"12\" class=\"s-soft\"/><text x=\"774\" y=\"64\" text-anchor=\"middle\" class=\"s-t\">Controlling</text><text x=\"774\" y=\"88\" text-anchor=\"middle\" class=\"s-s\">memantau,</text><text x=\"774\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">mengoreksi</text><path d=\"M774 130 C774 156 108 156 108 132\" class=\"s-dash\" marker-end=\"url(#pc)\"/><text x=\"440\" y=\"172\" text-anchor=\"middle\" class=\"s-s\">siklus berulang: hasil pengendalian menjadi dasar perencanaan berikutnya</text><text x=\"10\" y=\"200\" class=\"s-hd\">POAC · TERRY &amp; FRANKLIN (1982)</text><rect x=\"10\" y=\"210\" width=\"196\" height=\"34\" rx=\"17\" class=\"s-box\"/><text x=\"108\" y=\"232\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Planning</text><rect x=\"232\" y=\"210\" width=\"196\" height=\"34\" rx=\"17\" class=\"s-box\"/><text x=\"330\" y=\"232\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Organizing</text><rect x=\"454\" y=\"210\" width=\"196\" height=\"34\" rx=\"17\" class=\"s-acc\"/><text x=\"552\" y=\"232\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Actuating</text><rect x=\"676\" y=\"210\" width=\"196\" height=\"34\" rx=\"17\" class=\"s-box\"/><text x=\"774\" y=\"232\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Controlling</text></svg><figcaption>Empat fungsi manajemen menurut Robbins et al. (2024) dan padanannya dalam POAC menurut Terry &amp; Franklin (1982). Kotak kuning: <i>leading</i> ≈ <i>actuating</i>.</figcaption></figure><div class=\"grid4\" style=\"margin-top:.5em\"><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"planning\">Planning</button></b>: \"Apa tujuan kita dan bagaimana mencapainya?\"</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"organizing\">Organizing</button></b>: \"Siapa mengerjakan apa, melapor ke siapa?\"</p></div><div class=\"card hl\"><p><b><button type=\"button\" class=\"term\" data-term=\"leading\">Leading</button></b> / <b><button type=\"button\" class=\"term\" data-term=\"actuating\">actuating</button></b>: \"Bagaimana menggerakkan orang?\"</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"controlling\">Controlling</button></b>: \"Apakah sudah sesuai rencana?\"</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peran manajer</span><span>Indikator 2</span></div><h2>Sepuluh peran manajer <span class=\"cite\">(Mintzberg, 1973)</span></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Kelompok</th><th>Peran</th><th>Contoh: ketua HIMA SI</th></tr></thead><tbody><tr><td><b>Interpersonal</b></td><td>Figurehead · Leader · Liaison</td><td>menandatangani surat resmi; memotivasi pengurus; menjalin hubungan dengan HIMA prodi lain</td></tr><tr><td><b>Informational</b></td><td>Monitor · Disseminator · Spokesperson</td><td>memantau info dari fakultas; meneruskan ke pengurus; mewakili HIMA di forum mahasiswa</td></tr><tr><td><b>Decisional</b></td><td>Entrepreneur · Disturbance handler · Resource allocator · Negotiator</td><td>merintis program baru; menangani konflik panitia; membagi anggaran; bernegosiasi dengan sponsor</td></tr></tbody></table></div><p style=\"margin-top:.6em\">Tiga level manajer: <b>top</b> (pimpinan puncak), <b>middle</b> (kepala bagian/unit), <b>first-line</b> (koordinator/supervisor lapangan) <span class=\"cite\">(Robbins et al., 2024)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Keterampilan manajer</span><span>Indikator 2</span></div><h2>Tiga keterampilan manajer</h2><figure class=\"fig\"><svg viewBox=\"0 0 760 230\" style=\"max-height:12em\" role=\"img\" aria-label=\"Tiga level manajer: top, middle, first-line. Tiap level membutuhkan tiga keterampilan Katz: conceptual, human, technical. Makin ke atas, porsi keterampilan konseptual makin besar; makin ke bawah, porsi keterampilan teknis makin besar; keterampilan hubungan antarmanusia penting di semua level.\"><text x=\"10\" y=\"20\" class=\"s-hd\">LEVEL</text><text x=\"190\" y=\"20\" class=\"s-hd\">PORSI KETERAMPILAN (ILUSTRATIF)</text><text x=\"10\" y=\"64\" class=\"s-t\" style=\"font-size:14px\">Top managers</text><rect x=\"190\" y=\"34\" width=\"280\" height=\"46\" class=\"s-acc\"/><text x=\"330\" y=\"62\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Conceptual</text><rect x=\"470\" y=\"34\" width=\"168\" height=\"46\" class=\"s-soft\"/><text x=\"554\" y=\"62\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Human</text><rect x=\"638\" y=\"34\" width=\"112\" height=\"46\" class=\"s-box\"/><text x=\"694\" y=\"62\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Technical</text><text x=\"10\" y=\"126\" class=\"s-t\" style=\"font-size:14px\">Middle managers</text><rect x=\"190\" y=\"96\" width=\"196\" height=\"46\" class=\"s-acc\"/><text x=\"288\" y=\"124\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Conceptual</text><rect x=\"386\" y=\"96\" width=\"196\" height=\"46\" class=\"s-soft\"/><text x=\"484\" y=\"124\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Human</text><rect x=\"582\" y=\"96\" width=\"168\" height=\"46\" class=\"s-box\"/><text x=\"666\" y=\"124\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Technical</text><text x=\"10\" y=\"188\" class=\"s-t\" style=\"font-size:14px\">First-line managers</text><rect x=\"190\" y=\"158\" width=\"112\" height=\"46\" class=\"s-acc\"/><text x=\"246\" y=\"186\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Conceptual</text><rect x=\"302\" y=\"158\" width=\"196\" height=\"46\" class=\"s-soft\"/><text x=\"400\" y=\"186\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Human</text><rect x=\"498\" y=\"158\" width=\"251.99999999999997\" height=\"46\" class=\"s-box\"/><text x=\"624\" y=\"186\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">Technical</text></svg><figcaption>Tiga keterampilan manajer (Katz, 1955) dan kebutuhannya menurut level manajemen, diadaptasi dari Robbins et al. (2024). Lebar kotak hanya ilustrasi arah, bukan data.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.4em\"><div class=\"card\"><p><b>Technical</b>: pengetahuan dan keahlian bidang tertentu, mis. mengelola server atau menyusun laporan keuangan.</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"human-skills\">Human</button></b>: bekerja sama, berkomunikasi, dan memotivasi orang.</p></div><div class=\"card hl\"><p><b><button type=\"button\" class=\"term\" data-term=\"conceptual-skills\">Conceptual</button></b>: melihat organisasi secara utuh dan memecahkan masalah yang rumit.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Manajemen &amp; kepemimpinan</span><span>Jembatan ke Pertemuan 6–7</span></div><h2>Manajer dan pemimpin: apa bedanya?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th></th><th>Manajemen</th><th>Kepemimpinan</th></tr></thead><tbody><tr><td><b>Menghasilkan</b></td><td>keteraturan dan konsistensi</td><td>perubahan dan gerak maju</td></tr><tr><td><b>Arah</b></td><td>planning and budgeting</td><td>establishing direction</td></tr><tr><td><b>Orang</b></td><td>organizing and staffing</td><td>aligning people</td></tr><tr><td><b>Pelaksanaan</b></td><td>controlling and problem solving</td><td>motivating and inspiring</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.85em;margin-top:.3em\">Diadaptasi dari Kotter (1990) sebagaimana disajikan Northouse (2025). Label fungsi ditulis sesuai sumber.</p><div class=\"callout\" style=\"margin-top:.6em\">Organisasi membutuhkan <b>keduanya</b>. Mata kuliah ini melatih Anda menjadi manajer yang juga memimpin.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Evolusi teori</span><span>Indikator 3</span></div><h2>Dari pabrik ke organisasi digital</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 220\" style=\"max-height:12em\" role=\"img\" aria-label=\"Garis waktu empat pendekatan manajemen. Classical approach sejak awal 1900-an: scientific management Taylor dan general administrative theory Fayol dan Weber. Behavioral approach: Hawthorne studies mulai 1924, perilaku dan motivasi manusia. Quantitative approach: sejak Perang Dunia II, statistik dan model optimasi. Contemporary approach: sejak 1960-an, pendekatan sistem dan kontingensi.\"><defs><marker id=\"ev\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><line x1=\"10\" y1=\"190\" x2=\"885\" y2=\"190\" class=\"s-line\" marker-end=\"url(#ev)\"/><text x=\"885\" y=\"212\" text-anchor=\"end\" class=\"s-hd\">WAKTU</text><rect x=\"10\" y=\"20\" width=\"200\" height=\"140\" rx=\"12\" class=\"s-soft\"/><text x=\"110\" y=\"50\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Classical</text><text x=\"110\" y=\"74\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">AWAL 1900-AN</text><text x=\"110\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">Taylor: scientific mgmt</text><text x=\"110\" y=\"126\" text-anchor=\"middle\" class=\"s-s\">Fayol, Weber: administrasi</text><line x1=\"110\" y1=\"162\" x2=\"110\" y2=\"186\" class=\"s-dash\"/><rect x=\"230\" y=\"20\" width=\"200\" height=\"140\" rx=\"12\" class=\"s-soft\"/><text x=\"330\" y=\"50\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Behavioral</text><text x=\"330\" y=\"74\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">HAWTHORNE MULAI 1924</text><text x=\"330\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">manusia, motivasi,</text><text x=\"330\" y=\"126\" text-anchor=\"middle\" class=\"s-s\">kelompok kerja</text><line x1=\"330\" y1=\"162\" x2=\"330\" y2=\"186\" class=\"s-dash\"/><rect x=\"450\" y=\"20\" width=\"200\" height=\"140\" rx=\"12\" class=\"s-soft\"/><text x=\"550\" y=\"50\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Quantitative</text><text x=\"550\" y=\"74\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">SEJAK PERANG DUNIA II</text><text x=\"550\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">statistik, optimasi,</text><text x=\"550\" y=\"126\" text-anchor=\"middle\" class=\"s-s\">model keputusan</text><line x1=\"550\" y1=\"162\" x2=\"550\" y2=\"186\" class=\"s-dash\"/><rect x=\"670\" y=\"20\" width=\"200\" height=\"140\" rx=\"12\" class=\"s-acc\"/><text x=\"770\" y=\"50\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Contemporary</text><text x=\"770\" y=\"74\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">SEJAK 1960-AN</text><text x=\"770\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">systems approach</text><text x=\"770\" y=\"126\" text-anchor=\"middle\" class=\"s-s\">contingency approach</text><line x1=\"770\" y1=\"162\" x2=\"770\" y2=\"186\" class=\"s-dash\"/></svg><figcaption>Empat pendekatan dalam sejarah manajemen, diadaptasi dari Robbins et al. (2024). Pendekatan lama tidak hilang; semuanya masih dipakai sesuai situasi.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teori dalam praktik</span><span>Kasus ilustrasi · indikator 3</span></div><h2>Jejak teori di organisasi sekitar kita</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Praktik</th><th>Pendekatan</th><th>Mengapa</th></tr></thead><tbody><tr><td>UMKM keripik menetapkan SOP menggoreng: suhu, waktu, dan takaran bumbu yang sama untuk semua karyawan</td><td><b>Classical</b> (<button type=\"button\" class=\"term\" data-term=\"scientific-management\">scientific mgmt</button>)</td><td>mencari satu cara terbaik dan menstandarkannya</td></tr><tr><td>Kelurahan melayani surat dengan alur, formulir, dan wewenang tanda tangan yang tertulis</td><td><b>Classical</b> (<button type=\"button\" class=\"term\" data-term=\"bureaucracy\">bureaucracy</button>)</td><td>hierarki dan aturan tertulis menjamin kepastian</td></tr><tr><td>Pengasuh pesantren rutin sowan dan berdialog dengan para ustaz untuk menjaga semangat mengajar</td><td><b>Behavioral</b></td><td>perhatian dan hubungan sosial memengaruhi kinerja</td></tr><tr><td>Kampus memakai data pendaftar untuk menentukan kuota tiap prodi</td><td><b>Quantitative</b></td><td>keputusan berbasis data dan model</td></tr><tr><td>Unit TI kampus memberi aturan ketat untuk keamanan server, tetapi kebebasan untuk tim pengembang aplikasi</td><td><b>Contemporary</b> (<button type=\"button\" class=\"term\" data-term=\"contingency-approach\">contingency</button>)</td><td>cara mengelola disesuaikan dengan situasi</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Tantangan</span><span>Organisasi berbasis TI</span></div><h2>Tantangan manajemen di era digital</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Perubahan cepat</h3><p>Teknologi, aplikasi, dan kebiasaan pengguna berubah lebih cepat dari siklus rencana tahunan.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kerja jarak jauh &amp; hybrid</h3><p>Memimpin tim yang tidak selalu bertemu tatap muka.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Data &amp; keamanan</h3><p>Keputusan makin berbasis data; kebocoran data merusak kepercayaan.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Etika</h3><p>Pemakaian data pribadi dan AI menuntut tanggung jawab yang jelas.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Talenta</h3><p>Kebutuhan orang yang paham teknologi sekaligus proses bisnis.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Keberagaman</h3><p>Tim lintas fungsi, lintas generasi, dan lintas budaya.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Rangkuman dosen; beberapa tema dibahas dalam Robbins et al. (2024). Setiap tantangan dibahas lagi pada pertemuan terkait.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi kasus</span><span>Kelompok 4–5 orang · 20 menit · kasus ilustrasi</span></div><h2>Koperasi pesantren yang kewalahan</h2><div class=\"cols w\"><div><p>Kopontren di sebuah pesantren di Sidoarjo melayani 1.200 santri. Pengelolanya enam orang: satu ketua, satu bendahara, empat pelayan toko bergiliran. Masalah tiga bulan terakhir:</p><ul><li>Stok kitab dan seragam sering habis menjelang awal semester.</li><li>Dua pelayan sama-sama belanja ke pemasok, satu barang dibeli dobel.</li><li>Pelayan mengeluh ketua jarang hadir dan hanya menegur saat ada selisih kas.</li><li>Laporan keuangan baru dibuat saat diminta pengasuh.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Tugas kelompok</h3><ol><li>Petakan setiap masalah ke fungsi manajemen yang lemah (POLC/POAC).</li><li>Peran Mintzberg mana yang belum dijalankan ketua?</li><li>Pendekatan teori mana yang bisa membantu? Beri satu usulan konkret per pendekatan.</li></ol></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Organisasi</b> punya tiga unsur: tujuan, orang, dan struktur yang disengaja.</li><li><b>Manajemen</b> mengoordinasikan pekerjaan orang lain agar <b>efisien</b> (cara) dan <b>efektif</b> (tujuan).</li><li>Empat fungsi: <b>planning, organizing, leading, controlling</b> (POLC); dalam POAC, leading = <b>actuating</b>.</li><li>Manajer menjalankan <b>10 peran</b> (Mintzberg) dan butuh keterampilan <b>technical, human, conceptual</b> (Katz).</li><li>Teori berkembang: <b>classical → behavioral → quantitative → contemporary</b>, dan semuanya masih dipakai.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Actuating (menggerakkan) sepadan dengan leading: memotivasi dan mengarahkan anggota.\"><p class=\"q\">Dalam POAC (Terry), fungsi yang sepadan dengan <i>leading</i> dalam POLC adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. planning</button><button type=\"button\" data-o=\"b\">B. organizing</button><button type=\"button\" data-o=\"c\">C. actuating</button><button type=\"button\" data-o=\"d\">D. controlling</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"a\" data-why=\"Birokrasi Weber: pembagian kerja, hierarki, dan aturan tertulis.\"><p class=\"q\">Kelurahan memakai alur, formulir, dan wewenang tanda tangan tertulis. Ini paling dekat dengan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. birokrasi Weber</button><button type=\"button\" data-o=\"b\">B. studi Hawthorne</button><button type=\"button\" data-o=\"c\">C. pendekatan kontingensi</button><button type=\"button\" data-o=\"d\">D. pendekatan kuantitatif</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Biayanya hemat (efisien), tetapi kegiatannya tidak membantu tujuan (tidak efektif).\"><p class=\"q\">Panitia mencetak 500 undangan sangat murah, padahal undangan tak diperlukan karena peserta mendaftar daring. Panitia itu…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. efektif dan efisien</button><button type=\"button\" data-o=\"b\">B. efisien tetapi tidak efektif</button><button type=\"button\" data-o=\"c\">C. efektif tetapi tidak efisien</button><button type=\"button\" data-o=\"d\">D. tidak efisien dan tidak efektif</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar Robbins et al. (2024), <i>Management</i>, tentang manajer dan manajemen, serta bagian sejarah manajemen.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Merangkum peran manajer</h3><p>Pilih <b>satu organisasi</b> yang Anda kenal. Wawancarai singkat atau amati pimpinannya. Tulis 300–400 kata dalam bahasa Indonesia: fungsi manajemen yang dijalankan, tiga peran Mintzberg yang paling menonjol beserta contohnya, dan keterampilan Katz yang paling dibutuhkan.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai pikirkan calon <b>organisasi mitra</b>. Kelompok dan mitra dibentuk di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Organization</span></dt><dd>Susunan orang-orang yang disengaja untuk mencapai suatu tujuan tertentu. <i>(organisasi)</i></dd></div><div><dt><span class=\"en\">Management</span></dt><dd>Kegiatan mengoordinasikan dan mengawasi pekerjaan orang lain agar selesai secara efisien dan efektif. <i>(manajemen)</i></dd></div><div><dt><span class=\"en\">Efficiency</span></dt><dd>Mendapatkan hasil sebesar mungkin dari masukan (waktu, uang, tenaga) sekecil mungkin; \"doing things right\". <i>(efisiensi)</i></dd></div><div><dt><span class=\"en\">Effectiveness</span></dt><dd>Mengerjakan kegiatan yang memang membantu organisasi mencapai tujuannya; \"doing the right things\". <i>(efektivitas)</i></dd></div><div><dt><span class=\"en\">Planning</span></dt><dd>Fungsi manajemen untuk menetapkan tujuan, menyusun strategi, dan membuat rencana kerja. <i>(perencanaan)</i></dd></div><div><dt><span class=\"en\">Organizing</span></dt><dd>Fungsi manajemen untuk menentukan pekerjaan apa yang dilakukan, oleh siapa, dan bagaimana dikelompokkan. <i>(pengorganisasian)</i></dd></div><div><dt><span class=\"en\">Leading</span></dt><dd>Fungsi manajemen untuk memotivasi, mengarahkan, dan memengaruhi orang agar bekerja mencapai tujuan. <i>(kepemimpinan / pengarahan)</i></dd></div><div><dt><span class=\"en\">Controlling</span></dt><dd>Fungsi manajemen untuk memantau kinerja, membandingkannya dengan tujuan, dan melakukan koreksi. <i>(pengendalian)</i></dd></div><div><dt><span class=\"en\">Actuating</span></dt><dd>Istilah Terry untuk fungsi menggerakkan anggota agar melaksanakan rencana; sepadan dengan leading. <i>(penggerakan)</i></dd></div><div><dt><span class=\"en\">Managerial roles</span></dt><dd>Kelompok perilaku yang diharapkan dari seorang manajer; Mintzberg menyebut sepuluh peran. <i>(peran manajerial)</i></dd></div><div><dt><span class=\"en\">Conceptual skills</span></dt><dd>Kemampuan melihat organisasi secara utuh, memahami keterkaitan bagian-bagiannya, dan berpikir abstrak. <i>(keterampilan konseptual)</i></dd></div><div><dt><span class=\"en\">Scientific management</span></dt><dd>Pendekatan Taylor yang memakai metode ilmiah untuk menentukan cara terbaik mengerjakan suatu pekerjaan. <i>(manajemen ilmiah)</i></dd></div><div><dt><span class=\"en\">Bureaucracy</span></dt><dd>Bentuk organisasi menurut Weber yang dicirikan pembagian kerja, hierarki jelas, aturan tertulis, dan hubungan impersonal. <i>(birokrasi)</i></dd></div><div><dt><span class=\"en\">Contingency approach</span></dt><dd>Pandangan bahwa tidak ada satu cara terbaik; cara mengelola bergantung pada situasi. <i>(pendekatan kontingensi / situasional)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Katz, R. L. (1955). Skills of an effective administrator. <i>Harvard Business Review, 33</i>(1), 33–42.</li><li>Kotter, J. P. (1990). <i>A force for change: How leadership differs from management</i>. Free Press.</li><li>Mintzberg, H. (1973). <i>The nature of managerial work</i>. Harper &amp; Row.</li><li>Northouse, P. G. (2025). <i>Leadership: Theory and practice</i> (10th ed.). SAGE Publications.</li><li>Robbins, S. P., Coulter, M. A., &amp; Long, L. (2024). <i>Management</i> (16th ed.). Pearson.</li><li>Taylor, F. W. (1911). <i>The principles of scientific management</i>. Harper &amp; Brothers.</li><li>Terry, G. R., &amp; Franklin, S. G. (1982). <i>Principles of management</i> (8th ed.). Richard D. Irwin.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Perencanaan & Analisis SWOT","subtitle":"Perencanaan dan tujuan organisasi, analisis SWOT, manajemen strategis dasar","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Kepemimpinan dan Manajemen Organisasi · SI24W20</span></div><h1>Perencanaan &amp; Analisis SWOT</h1><p class=\"lead\">Perencanaan dan tujuan organisasi, analisis SWOT, manajemen strategis dasar</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + bentuk kelompok &amp; pilih mitra</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis perencanaan dan desain struktur suatu organisasi (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2; indikator 3 dan 4 di Pertemuan 3)</span></h3><ol><li>Ketepatan merumuskan visi, misi, dan tujuan SMART.</li><li>Ketepatan analisis SWOT organisasi mitra.</li><li>Ketepatan menganalisis struktur organisasi, rentang kendali, dan sentralisasi. <span class=\"muted\">(Pertemuan 3)</span></li><li>Kelogisan usulan perbaikan desain organisasi. <span class=\"muted\">(Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis fungsi manajemen, struktur, dan budaya organisasi secara logis, kritis, dan sistematis dengan memperhatikan keberagaman.</dd><dt>CPL-6</dt><dd class=\"id\">Mampu menerapkan pemikiran logis, kritis, sistematis, dan inovatif dalam pengembangan serta implementasi sistem informasi, dengan memperhatikan nilai humaniora dan keberagaman budaya.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa tiga unsur organisasi menurut Robbins et al.?</li><li>Apa beda efisiensi dan efektivitas?</li><li>Sebutkan empat fungsi manajemen. Fungsi mana yang menjadi titik awal semua fungsi lainnya?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Planning</span></div><h2>Mengapa organisasi perlu merencanakan?</h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\" style=\"font-size:1.05em\"><button type=\"button\" class=\"term\" data-term=\"planning\">Perencanaan</button> mencakup menetapkan tujuan organisasi, menyusun strategi untuk mencapainya, dan membuat rencana untuk memadukan serta mengoordinasikan kegiatan kerja.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(Robbins et al., 2024, terjemahan bebas)</span></div></div></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Empat alasan merencanakan</h3><ol><li>Memberi <b>arah</b> bagi manajer dan anggota.</li><li>Mengurangi <b>ketidakpastian</b> dengan mengantisipasi perubahan.</li><li>Meminimalkan <b>pemborosan</b> dan pekerjaan dobel.</li><li>Menetapkan <b>tujuan dan standar</b> yang dipakai dalam pengendalian.</li></ol><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Robbins et al., 2024)</span></p></div></div><p style=\"margin-top:.7em\">Ingat kasus kopontren: stok habis dan belanja dobel adalah gejala <b>perencanaan yang lemah</b>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arah organisasi</span><span>Indikator 1</span></div><h2>Visi, misi, tujuan, rencana</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" style=\"max-height:11em\" role=\"img\" aria-label=\"Empat tingkat dari atas ke bawah seperti piramida terbalik: visi (ke mana, jangka panjang), misi (mengapa ada dan apa yang dikerjakan), tujuan SMART (hasil terukur 1 sampai 3 tahun), rencana dan program kerja (siapa melakukan apa, kapan). Makin ke bawah makin konkret.\"><defs><marker id=\"vm\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"8\" width=\"700\" height=\"40\" rx=\"10\" class=\"s-acc\"/><text x=\"26\" y=\"34\" class=\"s-t\" style=\"font-size:14px\">Visi</text><text x=\"696\" y=\"34\" text-anchor=\"end\" class=\"s-s\">ke mana organisasi menuju (jangka panjang)</text><rect x=\"30\" y=\"54\" width=\"660\" height=\"40\" rx=\"10\" class=\"s-soft\"/><text x=\"46\" y=\"80\" class=\"s-t\" style=\"font-size:14px\">Misi</text><text x=\"676\" y=\"80\" text-anchor=\"end\" class=\"s-s\">mengapa ada, apa dikerjakan, untuk siapa</text><rect x=\"50\" y=\"100\" width=\"620\" height=\"40\" rx=\"10\" class=\"s-soft\"/><text x=\"66\" y=\"126\" class=\"s-t\" style=\"font-size:14px\">Tujuan (SMART)</text><text x=\"656\" y=\"126\" text-anchor=\"end\" class=\"s-s\">hasil terukur dalam kurun tertentu</text><rect x=\"70\" y=\"146\" width=\"580\" height=\"40\" rx=\"10\" class=\"s-box\"/><text x=\"86\" y=\"172\" class=\"s-t\" style=\"font-size:14px\">Rencana &amp; program kerja</text><text x=\"636\" y=\"172\" text-anchor=\"end\" class=\"s-s\">siapa, apa, kapan, sumber daya</text><line x1=\"760\" y1=\"12\" x2=\"760\" y2=\"186\" class=\"s-line\" marker-end=\"url(#vm)\"/><text x=\"775\" y=\"90\" class=\"s-hd\">MAKIN</text><text x=\"775\" y=\"108\" class=\"s-hd\">KONKRET</text></svg><figcaption>Hierarki arah organisasi. Definisi kerja mata kuliah ini; istilah <i>mission</i>, <i>goals</i>, dan <i>plans</i> mengikuti Robbins et al. (2024).</figcaption></figure><div class=\"grid3\" style=\"margin-top:.4em\"><div class=\"card hl\"><p><b><button type=\"button\" class=\"term\" data-term=\"vision\">Visi</button></b>: \"Menjadi pusat oleh-oleh keripik khas Sidoarjo yang dikenal di Jawa Timur.\"</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"mission\">Misi</button></b>: \"Memproduksi keripik higienis dari bahan lokal, melayani pesanan daring dan luring, serta memberdayakan ibu-ibu sekitar.\"</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"goal\">Tujuan</button></b>: \"Menaikkan penjualan daring dari 200 menjadi 350 bungkus per bulan pada Juni 2027.\"</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi: UMKM keripik.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tujuan SMART</span><span>Indikator 1</span></div><h2>Menulis tujuan yang <button type=\"button\" class=\"term\" data-term=\"smart\">S.M.A.R.T.</button></h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Huruf</th><th>Kriteria asli <span class=\"cite\">(Doran, 1981)</span></th><th>Artinya</th></tr></thead><tbody><tr><td><b>S</b></td><td>Specific</td><td>menyasar satu area perbaikan yang jelas</td></tr><tr><td><b>M</b></td><td>Measurable</td><td>ada ukuran atau indikator kemajuan</td></tr><tr><td><b>A</b></td><td>Assignable</td><td>jelas siapa yang akan mengerjakannya</td></tr><tr><td><b>R</b></td><td>Realistic</td><td>realistis dengan sumber daya yang ada</td></tr><tr><td><b>T</b></td><td>Time-related</td><td>ada batas waktu pencapaian</td></tr></tbody></table></div><div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Belum SMART</h3><p>\"Meningkatkan kualitas layanan koperasi.\"</p></div><div class=\"card ok\" style=\"margin-top:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>SMART</h3><p>\"Bendahara kopontren menurunkan selisih kas harian dari rata-rata Rp50.000 menjadi di bawah Rp10.000 paling lambat Desember 2026.\"</p></div></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Banyak sumber kemudian memakai varian lain (mis. <i>Achievable</i>, <i>Relevant</i>). Di mata kuliah ini kita memakai versi asli Doran (1981). Contoh adalah ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 8 menit · kasus ilustrasi</span></div><h2>Jadikan tujuan ini SMART</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>HIMA SI</h3><p>\"Meningkatkan keaktifan anggota.\"</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Kelurahan</h3><p>\"Mempercepat layanan surat pengantar.\"</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Pesantren</h3><p>\"Memperbaiki hafalan santri.\"</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Pilih satu. Tulis ulang dengan kelima kriteria Doran, lalu tandai bagian yang memenuhi S, M, A, R, dan T.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Manajemen strategis</span><span>Indikator 1–2</span></div><h2>Proses <button type=\"button\" class=\"term\" data-term=\"strategic-management\">manajemen strategis</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 200\" style=\"max-height:11em\" role=\"img\" aria-label=\"Enam langkah proses manajemen strategis: 1 identifikasi misi, tujuan, dan strategi saat ini; 2 analisis eksternal; 3 analisis internal; 4 merumuskan strategi; 5 menerapkan strategi; 6 mengevaluasi hasil. Langkah 2 dan 3 bersama-sama disebut analisis SWOT. Langkah 1 sampai 4 adalah perencanaan.\"><defs><marker id=\"sp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-soft\"/><text x=\"75\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 1</text><text x=\"75\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Identifikasi</text><text x=\"75\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">misi, tujuan, strategi</text><line x1=\"141\" y1=\"85\" x2=\"156\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"158\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-acc\"/><text x=\"223\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 2</text><text x=\"223\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Analisis</text><text x=\"223\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">eksternal (O, T)</text><line x1=\"289\" y1=\"85\" x2=\"304\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"306\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-acc\"/><text x=\"371\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 3</text><text x=\"371\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Analisis</text><text x=\"371\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">internal (S, W)</text><line x1=\"437\" y1=\"85\" x2=\"452\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"454\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-soft\"/><text x=\"519\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 4</text><text x=\"519\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Merumuskan</text><text x=\"519\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">strategi</text><line x1=\"585\" y1=\"85\" x2=\"600\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"602\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-box\"/><text x=\"667\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 5</text><text x=\"667\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Menerapkan</text><text x=\"667\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">strategi</text><line x1=\"733\" y1=\"85\" x2=\"748\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"750\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-box\"/><text x=\"815\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 6</text><text x=\"815\" y=\"92\" te

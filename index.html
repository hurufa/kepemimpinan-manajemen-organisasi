ass=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Biayanya hemat (efisien), tetapi kegiatannya tidak membantu tujuan (tidak efektif).\"><p class=\"q\">Panitia mencetak 500 undangan sangat murah, padahal undangan tak diperlukan karena peserta mendaftar daring. Panitia itu…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. efektif dan efisien</button><button type=\"button\" data-o=\"b\">B. efisien tetapi tidak efektif</button><button type=\"button\" data-o=\"c\">C. efektif tetapi tidak efisien</button><button type=\"button\" data-o=\"d\">D. tidak efisien dan tidak efektif</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar Robbins et al. (2024), <i>Management</i>, tentang manajer dan manajemen, serta bagian sejarah manajemen.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Merangkum peran manajer</h3><p>Pilih <b>satu organisasi</b> yang Anda kenal. Wawancarai singkat atau amati pimpinannya. Tulis 300–400 kata dalam bahasa Indonesia: fungsi manajemen yang dijalankan, tiga peran Mintzberg yang paling menonjol beserta contohnya, dan keterampilan Katz yang paling dibutuhkan.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai pikirkan calon <b>organisasi mitra</b>. Kelompok dan mitra dibentuk di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Organization</span></dt><dd>Susunan orang-orang yang disengaja untuk mencapai suatu tujuan tertentu. <i>(organisasi)</i></dd></div><div><dt><span class=\"en\">Management</span></dt><dd>Kegiatan mengoordinasikan dan mengawasi pekerjaan orang lain agar selesai secara efisien dan efektif. <i>(manajemen)</i></dd></div><div><dt><span class=\"en\">Efficiency</span></dt><dd>Mendapatkan hasil sebesar mungkin dari masukan (waktu, uang, tenaga) sekecil mungkin; \"doing things right\". <i>(efisiensi)</i></dd></div><div><dt><span class=\"en\">Effectiveness</span></dt><dd>Mengerjakan kegiatan yang memang membantu organisasi mencapai tujuannya; \"doing the right things\". <i>(efektivitas)</i></dd></div><div><dt><span class=\"en\">Planning</span></dt><dd>Fungsi manajemen untuk menetapkan tujuan, menyusun strategi, dan membuat rencana kerja. <i>(perencanaan)</i></dd></div><div><dt><span class=\"en\">Organizing</span></dt><dd>Fungsi manajemen untuk menentukan pekerjaan apa yang dilakukan, oleh siapa, dan bagaimana dikelompokkan. <i>(pengorganisasian)</i></dd></div><div><dt><span class=\"en\">Leading</span></dt><dd>Fungsi manajemen untuk memotivasi, mengarahkan, dan memengaruhi orang agar bekerja mencapai tujuan. <i>(kepemimpinan / pengarahan)</i></dd></div><div><dt><span class=\"en\">Controlling</span></dt><dd>Fungsi manajemen untuk memantau kinerja, membandingkannya dengan tujuan, dan melakukan koreksi. <i>(pengendalian)</i></dd></div><div><dt><span class=\"en\">Actuating</span></dt><dd>Istilah Terry untuk fungsi menggerakkan anggota agar melaksanakan rencana; sepadan dengan leading. <i>(penggerakan)</i></dd></div><div><dt><span class=\"en\">Managerial roles</span></dt><dd>Kelompok perilaku yang diharapkan dari seorang manajer; Mintzberg menyebut sepuluh peran. <i>(peran manajerial)</i></dd></div><div><dt><span class=\"en\">Conceptual skills</span></dt><dd>Kemampuan melihat organisasi secara utuh, memahami keterkaitan bagian-bagiannya, dan berpikir abstrak. <i>(keterampilan konseptual)</i></dd></div><div><dt><span class=\"en\">Scientific management</span></dt><dd>Pendekatan Taylor yang memakai metode ilmiah untuk menentukan cara terbaik mengerjakan suatu pekerjaan. <i>(manajemen ilmiah)</i></dd></div><div><dt><span class=\"en\">Bureaucracy</span></dt><dd>Bentuk organisasi menurut Weber yang dicirikan pembagian kerja, hierarki jelas, aturan tertulis, dan hubungan impersonal. <i>(birokrasi)</i></dd></div><div><dt><span class=\"en\">Contingency approach</span></dt><dd>Pandangan bahwa tidak ada satu cara terbaik; cara mengelola bergantung pada situasi. <i>(pendekatan kontingensi / situasional)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Katz, R. L. (1955). Skills of an effective administrator. <i>Harvard Business Review, 33</i>(1), 33–42.</li><li>Kotter, J. P. (1990). <i>A force for change: How leadership differs from management</i>. Free Press.</li><li>Mintzberg, H. (1973). <i>The nature of managerial work</i>. Harper &amp; Row.</li><li>Northouse, P. G. (2025). <i>Leadership: Theory and practice</i> (10th ed.). SAGE Publications.</li><li>Robbins, S. P., Coulter, M. A., &amp; Long, L. (2024). <i>Management</i> (16th ed.). Pearson.</li><li>Taylor, F. W. (1911). <i>The principles of scientific management</i>. Harper &amp; Brothers.</li><li>Terry, G. R., &amp; Franklin, S. G. (1982). <i>Principles of management</i> (8th ed.). Richard D. Irwin.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Perencanaan & Analisis SWOT","subtitle":"Perencanaan dan tujuan organisasi, analisis SWOT, manajemen strategis dasar","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Kepemimpinan dan Manajemen Organisasi · SI24W20</span></div><h1>Perencanaan &amp; Analisis SWOT</h1><p class=\"lead\">Perencanaan dan tujuan organisasi, analisis SWOT, manajemen strategis dasar</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + bentuk kelompok &amp; pilih mitra</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis perencanaan dan desain struktur suatu organisasi (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2; indikator 3 dan 4 di Pertemuan 3)</span></h3><ol><li>Ketepatan merumuskan visi, misi, dan tujuan SMART.</li><li>Ketepatan analisis SWOT organisasi mitra.</li><li>Ketepatan menganalisis struktur organisasi, rentang kendali, dan sentralisasi. <span class=\"muted\">(Pertemuan 3)</span></li><li>Kelogisan usulan perbaikan desain organisasi. <span class=\"muted\">(Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis fungsi manajemen, struktur, dan budaya organisasi secara logis, kritis, dan sistematis dengan memperhatikan keberagaman.</dd><dt>CPL-6</dt><dd class=\"id\">Mampu menerapkan pemikiran logis, kritis, sistematis, dan inovatif dalam pengembangan serta implementasi sistem informasi, dengan memperhatikan nilai humaniora dan keberagaman budaya.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa tiga unsur organisasi menurut Robbins et al.?</li><li>Apa beda efisiensi dan efektivitas?</li><li>Sebutkan empat fungsi manajemen. Fungsi mana yang menjadi titik awal semua fungsi lainnya?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Planning</span></div><h2>Mengapa organisasi perlu merencanakan?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Planning involves defining the organization's goals, establishing strategies for achieving those goals, and developing plans to integrate and coordinate work activities.\"</p><p class=\"tr\">\"<button type=\"button\" class=\"term\" data-term=\"planning\">Perencanaan</button> melibatkan pendefinisian tujuan-tujuan organisasi, penetapan strategi-strategi untuk mencapai tujuan-tujuan tersebut, dan pengembangan rencana-rencana untuk memadukan dan mengoordinasikan kegiatan-kegiatan kerja.\"</p><div class=\"src\">Robbins et al. (2024); terjemahan harfiah penyusun</div></blockquote></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Empat alasan merencanakan</h3><ol><li>Memberi <b>arah</b> bagi manajer dan anggota.</li><li>Mengurangi <b>ketidakpastian</b> dengan mengantisipasi perubahan.</li><li>Meminimalkan <b>pemborosan</b> dan pekerjaan dobel.</li><li>Menetapkan <b>tujuan dan standar</b> yang dipakai dalam pengendalian.</li></ol><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Robbins et al., 2024)</span></p></div></div><p style=\"margin-top:.7em\">Ingat kasus kopontren: stok habis dan belanja dobel adalah gejala <b>perencanaan yang lemah</b>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arah organisasi</span><span>Indikator 1</span></div><h2>Visi, misi, tujuan, rencana</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" style=\"max-height:11em\" role=\"img\" aria-label=\"Empat tingkat dari atas ke bawah seperti piramida terbalik: visi (ke mana, jangka panjang), misi (mengapa ada dan apa yang dikerjakan), tujuan SMART (hasil terukur 1 sampai 3 tahun), rencana dan program kerja (siapa melakukan apa, kapan). Makin ke bawah makin konkret.\"><defs><marker id=\"vm\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"8\" width=\"700\" height=\"40\" rx=\"10\" class=\"s-acc\"/><text x=\"26\" y=\"34\" class=\"s-t\" style=\"font-size:14px\">Visi</text><text x=\"696\" y=\"34\" text-anchor=\"end\" class=\"s-s\">ke mana organisasi menuju (jangka panjang)</text><rect x=\"30\" y=\"54\" width=\"660\" height=\"40\" rx=\"10\" class=\"s-soft\"/><text x=\"46\" y=\"80\" class=\"s-t\" style=\"font-size:14px\">Misi</text><text x=\"676\" y=\"80\" text-anchor=\"end\" class=\"s-s\">mengapa ada, apa dikerjakan, untuk siapa</text><rect x=\"50\" y=\"100\" width=\"620\" height=\"40\" rx=\"10\" class=\"s-soft\"/><text x=\"66\" y=\"126\" class=\"s-t\" style=\"font-size:14px\">Tujuan (SMART)</text><text x=\"656\" y=\"126\" text-anchor=\"end\" class=\"s-s\">hasil terukur dalam kurun tertentu</text><rect x=\"70\" y=\"146\" width=\"580\" height=\"40\" rx=\"10\" class=\"s-box\"/><text x=\"86\" y=\"172\" class=\"s-t\" style=\"font-size:14px\">Rencana &amp; program kerja</text><text x=\"636\" y=\"172\" text-anchor=\"end\" class=\"s-s\">siapa, apa, kapan, sumber daya</text><line x1=\"760\" y1=\"12\" x2=\"760\" y2=\"186\" class=\"s-line\" marker-end=\"url(#vm)\"/><text x=\"775\" y=\"90\" class=\"s-hd\">MAKIN</text><text x=\"775\" y=\"108\" class=\"s-hd\">KONKRET</text></svg><figcaption>Hierarki arah organisasi. Definisi kerja mata kuliah ini; istilah <i>mission</i>, <i>goals</i>, dan <i>plans</i> mengikuti Robbins et al. (2024).</figcaption></figure><div class=\"grid3\" style=\"margin-top:.4em\"><div class=\"card hl\"><p><b><button type=\"button\" class=\"term\" data-term=\"vision\">Visi</button></b>: \"Menjadi pusat oleh-oleh keripik khas Sidoarjo yang dikenal di Jawa Timur.\"</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"mission\">Misi</button></b>: \"Memproduksi keripik higienis dari bahan lokal, melayani pesanan daring dan luring, serta memberdayakan ibu-ibu sekitar.\"</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"goal\">Tujuan</button></b>: \"Menaikkan penjualan daring dari 200 menjadi 350 bungkus per bulan pada Juni 2027.\"</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi: UMKM keripik.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tujuan SMART</span><span>Indikator 1</span></div><h2>Menulis tujuan yang <button type=\"button\" class=\"term\" data-term=\"smart\">S.M.A.R.T.</button></h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Huruf</th><th>Kriteria asli <span class=\"cite\">(Doran, 1981)</span></th><th>Artinya</th></tr></thead><tbody><tr><td><b>S</b></td><td>Specific</td><td>menyasar satu area perbaikan yang jelas</td></tr><tr><td><b>M</b></td><td>Measurable</td><td>ada ukuran atau indikator kemajuan</td></tr><tr><td><b>A</b></td><td>Assignable</td><td>jelas siapa yang akan mengerjakannya</td></tr><tr><td><b>R</b></td><td>Realistic</td><td>realistis dengan sumber daya yang ada</td></tr><tr><td><b>T</b></td><td>Time-related</td><td>ada batas waktu pencapaian</td></tr></tbody></table></div><div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Belum SMART</h3><p>\"Meningkatkan kualitas layanan koperasi.\"</p></div><div class=\"card ok\" style=\"margin-top:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>SMART</h3><p>\"Bendahara kopontren menurunkan selisih kas harian dari rata-rata Rp50.000 menjadi di bawah Rp10.000 paling lambat Desember 2026.\"</p></div></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Banyak sumber kemudian memakai varian lain (mis. <i>Achievable</i>, <i>Relevant</i>). Di mata kuliah ini kita memakai versi asli Doran (1981). Contoh adalah ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 8 menit · kasus ilustrasi</span></div><h2>Jadikan tujuan ini SMART</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>HIMA SI</h3><p>\"Meningkatkan keaktifan anggota.\"</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Kelurahan</h3><p>\"Mempercepat layanan surat pengantar.\"</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Pesantren</h3><p>\"Memperbaiki hafalan santri.\"</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Pilih satu. Tulis ulang dengan kelima kriteria Doran, lalu tandai bagian yang memenuhi S, M, A, R, dan T.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Manajemen strategis</span><span>Indikator 1–2</span></div><h2>Proses <button type=\"button\" class=\"term\" data-term=\"strategic-management\">manajemen strategis</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 200\" style=\"max-height:11em\" role=\"img\" aria-label=\"Enam langkah proses manajemen strategis: 1 identifikasi misi, tujuan, dan strategi saat ini; 2 analisis eksternal; 3 analisis internal; 4 merumuskan strategi; 5 menerapkan strategi; 6 mengevaluasi hasil. Langkah 2 dan 3 bersama-sama disebut analisis SWOT. Langkah 1 sampai 4 adalah perencanaan.\"><defs><marker id=\"sp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-soft\"/><text x=\"75\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 1</text><text x=\"75\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Identifikasi</text><text x=\"75\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">misi, tujuan, strategi</text><line x1=\"141\" y1=\"85\" x2=\"156\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"158\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-acc\"/><text x=\"223\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 2</text><text x=\"223\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Analisis</text><text x=\"223\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">eksternal (O, T)</text><line x1=\"289\" y1=\"85\" x2=\"304\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"306\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-acc\"/><text x=\"371\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 3</text><text x=\"371\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Analisis</text><text x=\"371\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">internal (S, W)</text><line x1=\"437\" y1=\"85\" x2=\"452\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"454\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-soft\"/><text x=\"519\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 4</text><text x=\"519\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Merumuskan</text><text x=\"519\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">strategi</text><line x1=\"585\" y1=\"85\" x2=\"600\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"602\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-box\"/><text x=\"667\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 5</text><text x=\"667\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Menerapkan</text><text x=\"667\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">strategi</text><line x1=\"733\" y1=\"85\" x2=\"748\" y2=\"85\" class=\"s-line\" marker-end=\"url(#sp)\"/><rect x=\"750\" y=\"40\" width=\"130\" height=\"90\" rx=\"12\" class=\"s-box\"/><text x=\"815\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 6</text><text x=\"815\" y=\"92\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mengevaluasi</text><text x=\"815\" y=\"112\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">hasil</text><path d=\"M158 34 v-12 h286 v12\" class=\"s-line\" style=\"fill:none\"/><text x=\"301\" y=\"16\" text-anchor=\"middle\" class=\"s-hd\">ANALISIS SWOT</text><path d=\"M10 140 v12 h576 v-12\" class=\"s-dash\"/><text x=\"298\" y=\"172\" text-anchor=\"middle\" class=\"s-s\">langkah 1–4: perencanaan (dibahas hari ini)</text><path d=\"M602 140 v12 h278 v-12\" class=\"s-dash\"/><text x=\"741\" y=\"172\" text-anchor=\"middle\" class=\"s-s\">langkah 5–6: Pertemuan 11–15</text></svg><figcaption>Proses manajemen strategis enam langkah, diadaptasi dari Robbins et al. (2024).</figcaption></figure><p style=\"margin-top:.4em\"><button type=\"button\" class=\"term\" data-term=\"strategy\">Strategi</button> menjawab: apa yang akan dilakukan organisasi, bagaimana ia bersaing atau melayani, dan bagaimana menarik serta memuaskan penggunanya <span class=\"cite\">(Robbins et al., 2024)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis SWOT</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"swot\">SWOT</button>: melihat ke dalam dan ke luar</h2><div class=\"cols w\"><div><figure class=\"fig\"><svg viewBox=\"0 0 700 270\" style=\"max-height:14em\" role=\"img\" aria-label=\"Matriks SWOT dua kali dua. Baris atas faktor internal: strengths (membantu) dan weaknesses (menghambat). Baris bawah faktor eksternal: opportunities (membantu) dan threats (menghambat).\"><text x=\"265\" y=\"20\" text-anchor=\"middle\" class=\"s-hd\">MEMBANTU</text><text x=\"535\" y=\"20\" text-anchor=\"middle\" class=\"s-hd\">MENGHAMBAT</text><text x=\"100\" y=\"92\" text-anchor=\"end\" class=\"s-hd\">INTERNAL</text><text x=\"100\" y=\"110\" text-anchor=\"end\" class=\"s-s\">dapat dikendalikan</text><text x=\"100\" y=\"212\" text-anchor=\"end\" class=\"s-hd\">EKSTERNAL</text><text x=\"100\" y=\"230\" text-anchor=\"end\" class=\"s-s\">di luar kendali</text><rect x=\"130\" y=\"30\" width=\"270\" height=\"112\" rx=\"12\" class=\"s-soft\"/><text x=\"265\" y=\"72\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:18px\">S · Strengths</text><text x=\"265\" y=\"98\" text-anchor=\"middle\" class=\"s-s\">sumber daya &amp; kemampuan unggul</text><rect x=\"404\" y=\"30\" width=\"270\" height=\"112\" rx=\"12\" class=\"s-warn\"/><text x=\"539\" y=\"72\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:18px\">W · Weaknesses</text><text x=\"539\" y=\"98\" text-anchor=\"middle\" class=\"s-s\">kekurangan yang dimiliki</text><rect x=\"130\" y=\"148\" width=\"270\" height=\"112\" rx=\"12\" class=\"s-acc\"/><text x=\"265\" y=\"190\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:18px\">O · Opportunities</text><text x=\"265\" y=\"216\" text-anchor=\"middle\" class=\"s-s\">tren positif di lingkungan</text><rect x=\"404\" y=\"148\" width=\"270\" height=\"112\" rx=\"12\" class=\"s-box\"/><text x=\"539\" y=\"190\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:18px\">T · Threats</text><text x=\"539\" y=\"216\" text-anchor=\"middle\" class=\"s-s\">tren negatif di lingkungan</text></svg><figcaption>Matriks SWOT: gabungan analisis internal (S, W) dan eksternal (O, T), diadaptasi dari Robbins et al. (2024).</figcaption></figure></div><div><h3>Pertanyaan pemandu</h3><ul><li><b>S</b>: <button type=\"button\" class=\"term\" data-term=\"resources\">sumber daya</button> atau kemampuan apa yang unggul? Adakah <button type=\"button\" class=\"term\" data-term=\"core-competency\">kompetensi inti</button>?</li><li><b>W</b>: apa yang kurang dibanding kebutuhan atau pesaing?</li><li><b>O</b>: tren, kebijakan, atau teknologi apa yang bisa dimanfaatkan?</li><li><b>T</b>: perubahan apa di luar yang bisa merugikan?</li></ul><div class=\"callout\" style=\"margin-top:.6em\">Setiap butir harus didukung <b>bukti</b> dari mitra: data, wawancara, atau dokumen.</div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh SWOT</span><span>Kasus ilustrasi · indikator 2</span></div><h2>SWOT unit TI sebuah kampus swasta</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Strengths</h3><ul><li>Tim pengembang lulusan sendiri, paham proses akademik</li><li>SIAKAD dikembangkan mandiri, mudah disesuaikan</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Weaknesses</h3><ul><li>Hanya 4 staf untuk 20 aplikasi</li><li>Dokumentasi dan pencadangan tidak rutin</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Opportunities</h3><ul><li>Layanan cloud dengan harga khusus pendidikan</li><li>Mahasiswa SI bisa magang di unit TI</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Threats</h3><ul><li>Serangan siber ke situs perguruan tinggi</li><li>Tuntutan pelaporan data ke pemerintah makin banyak</li></ul></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dari SWOT ke strategi</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"tows\">Matriks TOWS</button> <span class=\"cite\">(Weihrich, 1982)</span></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th></th><th>Strengths (S)</th><th>Weaknesses (W)</th></tr></thead><tbody><tr><td><b>Opportunities (O)</b></td><td><b>SO</b>: pakai kekuatan untuk meraih peluang<br><span class=\"muted\">tim pengembang memanfaatkan cloud pendidikan untuk layanan baru</span></td><td><b>WO</b>: atasi kelemahan dengan memanfaatkan peluang<br><span class=\"muted\">program magang mahasiswa SI untuk menambah tenaga</span></td></tr><tr><td><b>Threats (T)</b></td><td><b>ST</b>: pakai kekuatan untuk menghadapi ancaman<br><span class=\"muted\">SIAKAD mandiri segera ditambal saat ada celah keamanan</span></td><td><b>WT</b>: kurangi kelemahan dan hindari ancaman<br><span class=\"muted\">jadwal pencadangan rutin dan dokumentasi sebelum insiden</span></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Nama empat strategi mengikuti Weihrich (1982); contoh melanjutkan kasus ilustrasi unit TI.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Hati-hati</span><span>Indikator 2</span></div><h2>Kesalahan umum dalam SWOT</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Tertukar</h3><p>Faktor eksternal ditulis sebagai kelemahan, atau sebaliknya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Terlalu umum</h3><p>\"SDM kurang\", \"promosi kurang\" tanpa angka atau contoh.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Tanpa bukti</h3><p>Ditulis dari tebakan, bukan dari wawancara, data, atau dokumen.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Daftar kepanjangan</h3><p>Puluhan butir tanpa prioritas; yang penting tenggelam.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Berhenti di daftar</h3><p>Tidak diturunkan menjadi strategi (TOWS).</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Satu suara</h3><p>Hanya dari pimpinan; suara anggota atau pengguna tidak didengar.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 20 menit</span></div><h2>Bentuk kelompok, pilih organisasi mitra</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 4–5 orang. Tetapkan peran awal:</p><ul><li>Koordinator kelompok</li><li>Penghubung mitra</li><li>Pencatat wawancara dan data</li><li>Penanggung jawab dokumen dan sumber</li></ul><p class=\"muted\">Peran dirotasi di Tugas 2 agar setiap anggota berlatih memimpin.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria mitra yang baik</h3><ul><li>Organisasi nyata: UMKM, instansi pemerintah, organisasi kemahasiswaan, atau pesantren/lembaga NU.</li><li>Punya pimpinan dan minimal 5 anggota/pegawai.</li><li>Bersedia diwawancarai 3–4 kali dan diamati selama semester.</li><li>Ada dokumen yang bisa dilihat: visi-misi, struktur, program kerja (boleh sederhana).</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Analisis organisasi dan kepemimpinan mitra</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>P2–3 · 10%</h3><p>Visi-misi, tujuan SMART, SWOT/TOWS, dan analisis struktur organisasi mitra.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>P4–5 · 10%</h3><p>Observasi dan wawancara budaya organisasi, motivasi, dan keberagaman.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>P6–7 · 10%</h3><p>Analisis gaya kepemimpinan pimpinan mitra; laporan lengkap dipresentasikan di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai organisasi yang <b>sama</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Perencanaan</b> menetapkan tujuan, strategi, dan rencana; memberi arah dan standar pengendalian.</li><li><b>Visi</b> (ke mana), <b>misi</b> (mengapa ada), <b>tujuan</b> (hasil terukur), <b>rencana</b> (siapa, apa, kapan).</li><li>Tujuan yang baik memenuhi <b>S.M.A.R.T.</b> versi Doran: Specific, Measurable, Assignable, Realistic, Time-related.</li><li><b>SWOT</b> = analisis internal (S, W) + eksternal (O, T), berbasis bukti.</li><li><b>TOWS</b> mengubah SWOT menjadi strategi SO, ST, WO, WT.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Doran menulis Assignable: jelas siapa yang akan mengerjakannya.\"><p class=\"q\">Dalam artikel asli Doran (1981), huruf A pada S.M.A.R.T. berarti…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Achievable</button><button type=\"button\" data-o=\"b\">B. Assignable</button><button type=\"button\" data-o=\"c\">C. Accurate</button><button type=\"button\" data-o=\"d\">D. Attractive</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Faktor eksternal yang bisa merugikan: threat.\"><p class=\"q\">\"Pesantren baru berfasilitas lengkap berdiri di kecamatan sebelah\" dalam SWOT pesantren termasuk…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Strength</button><button type=\"button\" data-o=\"b\">B. Weakness</button><button type=\"button\" data-o=\"c\">C. Opportunity</button><button type=\"button\" data-o=\"d\">D. Threat</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"a\" data-why=\"Kekuatan (S) dipakai untuk meraih peluang (O).\"><p class=\"q\">\"Tim pengembang yang kuat memanfaatkan layanan cloud murah\" termasuk strategi TOWS…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. SO</button><button type=\"button\" data-o=\"b\">B. ST</button><button type=\"button\" data-o=\"c\">C. WO</button><button type=\"button\" data-o=\"d\">D. WT</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab perencanaan dan manajemen strategis dalam Robbins et al. (2024), serta bab pengorganisasian dan desain struktur sebagai persiapan Pertemuan 3.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Pastikan mitra dan minta izin.</li><li>Kumpulkan visi, misi, program kerja, dan bagan struktur (foto atau salinan).</li><li>Wawancarai pimpinan dan minimal satu anggota/pengguna layanan.</li><li>Susun draf: evaluasi visi-misi, dua tujuan SMART usulan, SWOT (3–5 butir per kuadran, berbukti), dan TOWS.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa draf dan bagan struktur mitra ke Pertemuan 3.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Planning</span></dt><dd>Fungsi manajemen untuk menetapkan tujuan, menyusun strategi, dan membuat rencana kerja. <i>(perencanaan)</i></dd></div><div><dt><span class=\"en\">Goal</span></dt><dd>Hasil atau sasaran yang ingin dicapai organisasi, kelompok, atau individu. <i>(tujuan)</i></dd></div><div><dt><span class=\"en\">Vision</span></dt><dd>Gambaran masa depan jangka panjang yang ingin diwujudkan organisasi. <i>(visi)</i></dd></div><div><dt><span class=\"en\">Mission</span></dt><dd>Pernyataan tentang alasan keberadaan organisasi: apa yang dikerjakan, untuk siapa, dan bagaimana. <i>(misi)</i></dd></div><div><dt><span class=\"en\">S.M.A.R.T.</span></dt><dd>Kriteria penulisan tujuan menurut Doran (1981): Specific, Measurable, Assignable, Realistic, Time-related. <i>(kriteria tujuan SMART)</i></dd></div><div><dt><span class=\"en\">Strategy</span></dt><dd>Rencana tentang apa yang akan dilakukan organisasi, bagaimana bersaing atau melayani, dan cara menarik serta memuaskan pengguna. <i>(strategi)</i></dd></div><div><dt><span class=\"en\">Strategic management</span></dt><dd>Apa yang dilakukan manajer untuk mengembangkan strategi organisasi. <i>(manajemen strategis)</i></dd></div><div><dt><span class=\"en\">SWOT analysis</span></dt><dd>Analisis kekuatan dan kelemahan internal serta peluang dan ancaman eksternal organisasi. <i>(analisis SWOT)</i></dd></div><div><dt><span class=\"en\">TOWS matrix</span></dt><dd>Matriks Weihrich (1982) yang memasangkan faktor internal dan eksternal untuk merumuskan strategi SO, ST, WO, dan WT. <i>(matriks TOWS)</i></dd></div><div><dt><span class=\"en\">Resources</span></dt><dd>Aset yang dimiliki organisasi: keuangan, fisik, manusia, informasi, dan reputasi. <i>(sumber daya)</i></dd></div><div><dt><span class=\"en\">Core competency</span></dt><dd>Keahlian atau kemampuan utama organisasi yang menciptakan nilai dan sulit ditiru. <i>(kompetensi inti)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh keputusan organisasi. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Efficiency</span></dt><dd>Mendapatkan hasil sebesar mungkin dari masukan (waktu, uang, tenaga) sekecil mungkin; \"doing things right\". <i>(efisiensi)</i></dd></div><div><dt><span class=\"en\">Effectiveness</span></dt><dd>Mengerjakan kegiatan yang memang membantu organisasi mencapai tujuannya; \"doing the right things\". <i>(efektivitas)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Doran, G. T. (1981). There's a S.M.A.R.T. way to write management's goals and objectives. <i>Management Review, 70</i>(11), 35–36.</li><li>Robbins, S. P., Coulter, M. A., &amp; Long, L. (2024). <i>Management</i> (16th ed.). Pearson.</li><li>Weihrich, H. (1982). The TOWS matrix—A tool for situational analysis. <i>Long Range Planning, 15</i>(2), 54–66. https://doi.org/10.1016/0024-6301(82)90120-0</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Pengorganisasian & Desain Struktur","subtitle":"Struktur organisasi, rentang kendali, sentralisasi, organisasi TI dan tim lintas fungsi","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Kepemimpinan dan Manajemen Organisasi · SI24W20</span></div><h1>Pengorganisasian &amp; Desain Struktur</h1><p class=\"lead\">Struktur organisasi, rentang kendali, sentralisasi, organisasi TI dan tim lintas fungsi</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + analisis struktur mitra</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis perencanaan dan desain struktur suatu organisasi (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 3 dan 4)</span></h3><ol><li>Ketepatan merumuskan visi, misi, dan tujuan SMART. <span class=\"muted\">(Pertemuan 2)</span></li><li>Ketepatan analisis SWOT organisasi mitra. <span class=\"muted\">(Pertemuan 2)</span></li><li>Ketepatan menganalisis struktur organisasi, rentang kendali, dan sentralisasi.</li><li>Kelogisan usulan perbaikan desain organisasi.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menganalisis fungsi manajemen, struktur, dan budaya organisasi secara logis, kritis, dan sistematis dengan memperhatikan keberagaman.</dd><dt>CPL-6</dt><dd class=\"id\">Mampu menerapkan pemikiran logis, kritis, sistematis, dan inovatif dalam pengembangan serta implementasi sistem informasi, dengan memperhatikan nilai humaniora dan keberagaman budaya.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 2 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Apa arti huruf A dan R pada S.M.A.R.T. versi asli Doran?</li><li>Apa beda faktor internal dan eksternal dalam SWOT?</li><li>Strategi WO pada matriks TOWS berarti apa?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Mitra sudah pasti dan bersedia?</li><li>Draf SWOT sudah berbukti?</li><li>Bagan struktur mitra sudah dibawa?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Organizing</span></div><h2>Dari rencana ke susunan kerja</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Organizing is arranging and structuring work to accomplish the organization's goals.\"</p><p class=\"tr\">\"<button type=\"button\" class=\"term\" data-term=\"organizing\">Pengorganisasian</button> adalah menata dan menyusun pekerjaan untuk mencapai tujuan-tujuan organisasi.\"</p><div class=\"src\">Robbins et al. (2024); terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.8em\"><li><button type=\"button\" class=\"term\" data-term=\"organizational-structure\">Struktur organisasi</button>: susunan formal pekerjaan di dalam organisasi.</li><li><button type=\"button\" class=\"term\" data-term=\"organizational-chart\">Bagan organisasi</button>: gambar struktur itu.</li><li><button type=\"button\" class=\"term\" data-term=\"organizational-design\">Desain organisasi</button>: proses membangun atau mengubah struktur.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Yang dijawab struktur</h3><ul><li>Pekerjaan apa saja yang harus dilakukan?</li><li>Siapa mengerjakan apa?</li><li>Bagaimana tugas dikelompokkan?</li><li>Siapa melapor kepada siapa?</li><li>Di mana keputusan diambil?</li></ul><p class=\"muted\" style=\"font-size:.85em\">Diringkas dari Robbins et al. (2024).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Enam elemen</span><span>Indikator 3</span></div><h2>Enam elemen desain organisasi</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Work specialization</h3><p>Pekerjaan dipecah menjadi tugas-tugas yang dikerjakan orang berbeda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Departmentalization</h3><p>Pekerjaan dikelompokkan menjadi bagian atau unit.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Chain of command</h3><p>Garis wewenang: siapa melapor kepada siapa.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Span of control</h3><p>Berapa orang yang dipimpin satu manajer.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Centralization / decentralization</h3><p>Di level mana keputusan diambil.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Formalization</h3><p>Seberapa banyak aturan dan prosedur tertulis.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Enam elemen menurut Robbins et al. (2024) dan Robbins &amp; Judge (2023); nama elemen ditulis sesuai sumber. Kartu kuning: disebut langsung di indikator 3.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Elemen 1–2</span><span>Indikator 3</span></div><h2>Membagi pekerjaan, membentuk bagian</h2><p><button type=\"button\" class=\"term\" data-term=\"work-specialization\">Spesialisasi kerja</button> meningkatkan keahlian dan kecepatan, tetapi bila berlebihan membuat pekerjaan monoton dan koordinasi sulit.</p><div class=\"tw\"><table class=\"t\"><thead><tr><th>Bentuk <button type=\"button\" class=\"term\" data-term=\"departmentalization\">departementalisasi</button></th><th>Dasar pengelompokan</th><th>Contoh</th></tr></thead><tbody><tr><td><b>Functional</b></td><td>fungsi yang dijalankan</td><td>UMKM: bagian produksi, keuangan, pemasaran daring</td></tr><tr><td><b>Geographical</b></td><td>wilayah</td><td>lembaga NU: pengurus per kabupaten dan kecamatan</td></tr><tr><td><b>Product</b></td><td>produk atau layanan</td><td>kampus: fakultas dan program studi</td></tr><tr><td><b>Process</b></td><td>alur kerja</td><td>kelurahan: loket penerimaan, verifikasi, tanda tangan</td></tr><tr><td><b>Customer</b></td><td>kelompok pelanggan</td><td>bank: layanan nasabah perorangan dan UMKM</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.3em\">Lima bentuk menurut Robbins et al. (2024); contoh oleh dosen (ilustrasi).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Elemen 3</span><span>Indikator 3</span></div><h2>Rantai komando</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The chain of command is the line of authority extending from upper organizational levels to the lowest levels, which clarifies who reports to whom.\"</p><p class=\"tr\">\"<button type=\"button\" class=\"term\" data-term=\"chain-of-command\">Rantai komando</button> adalah garis wewenang yang membentang dari level-level organisasi atas sampai ke level-level terendah, yang memperjelas siapa melapor kepada siapa.\"</p><div class=\"src\">Robbins et al. (2024); terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.8em\"><li><button type=\"button\" class=\"term\" data-term=\"authority\">Wewenang</button>: hak jabatan untuk memberi perintah.</li><li><b>Tanggung jawab</b>: kewajiban menjalankan tugas yang diberikan.</li><li><button type=\"button\" class=\"term\" data-term=\"unity-of-command\">Kesatuan komando</button>: setiap orang melapor kepada satu atasan.</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Gejala rantai komando kabur</h3><ul><li>Satu staf menerima perintah bertentangan dari dua orang.</li><li>Masalah \"dilempar\" karena tidak jelas siapa penanggung jawabnya.</li><li>Atasan dilewati, lalu kaget saat ada masalah.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Rangkuman dosen.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Elemen 4</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"span-of-control\">Rentang kendali</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 270\" style=\"max-height:13.5em\" role=\"img\" aria-label=\"Perbandingan dua bagan untuk 16 staf pelaksana yang sama. Kiri, rentang kendali 2: lima level, 15 manajer. Kanan, rentang kendali 4: tiga level, 5 manajer. Rentang lebar berarti lebih sedikit level dan manajer.\"><text x=\"230\ "3\" class=\"s-soft\"/><text x=\"474\" y=\"88\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">L2</text><rect x=\"480.0\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"505.4\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"530.8\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"556.1\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"581.5\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"606.9\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"632.3\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"657.6\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"683.0\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"708.4\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"733.8\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"759.1\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"784.5\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"809.9\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"835.3\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><rect x=\"860.6\" y=\"108\" width=\"19.4\" height=\"22\" rx=\"3\" class=\"s-box\"/><text x=\"474\" y=\"124\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">L3</text><text x=\"680\" y=\"158\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">3 level · 5 manajer</text><text x=\"680\" y=\"178\" text-anchor=\"middle\" class=\"s-s\">lebih hemat dan cepat, butuh staf mandiri</text></svg><figcaption>Rentang kendali dan jumlah level untuk 16 staf pelaksana (kotak putih). Hitungan ilustrasi oleh dosen; konsep mengikuti Robbins et al. (2024).</figcaption></figure><p style=\"margin-top:.3em\">Tidak ada angka ideal. Rentang bisa <b>lebih lebar</b> bila staf terlatih, tugas mirip dan terstandar, lokasi berdekatan, dan sistem informasi mendukung <span class=\"cite\">(Robbins et al., 2024)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Elemen 5–6</span><span>Indikator 3</span></div><h2>Siapa memutuskan, seberapa baku?</h2><div class=\"cols\"><div class=\"card\"><h3 style=\"flex-wrap:wrap\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"centralization\">Sentralisasi</button> ↔ <button type=\"button\" class=\"term\" data-term=\"decentralization\">desentralisasi</button></h3><ul><li><b>Sentralisasi</b>: keputusan terpusat di level atas.</li><li><b>Desentralisasi</b>: staf level bawah memberi masukan atau ikut memutuskan.</li><li>Cocok terpusat: keputusan berisiko tinggi, butuh keseragaman.</li><li>Cocok tersebar: keputusan rutin, perlu cepat, dekat dengan pengguna.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg><button type=\"button\" class=\"term\" data-term=\"formalization\">Formalisasi</button></h3><ul><li>Seberapa baku pekerjaan dan seberapa banyak perilaku diatur aturan dan prosedur tertulis.</li><li><b>Tinggi</b>: SOP rinci, sedikit ruang untuk diskresi.</li><li><b>Rendah</b>: aturan sedikit, bergantung pada pertimbangan orang.</li></ul></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Definisi mengikuti Robbins et al. (2024); butir \"cocok terpusat/tersebar\" adalah rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dua pola</span><span>Indikator 3–4</span></div><h2>Mekanistik atau organik?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th><button type=\"button\" class=\"term\" data-term=\"mechanistic\">Mechanistic</button></th><th><button type=\"button\" class=\"term\" data-term=\"organic\">Organic</button></th></tr></thead><tbody><tr><td>High specialization</td><td>Cross-functional teams</td></tr><tr><td>Rigid departmentalization</td><td>Cross-hierarchical teams</td></tr><tr><td>Clear chain of command</td><td>Free flow of information</td></tr><tr><td>Narrow spans of control</td><td>Wide spans of control</td></tr><tr><td>Centralization</td><td>Decentralization</td></tr><tr><td>High formalization</td><td>Low formalization</td></tr></tbody></table></div><p style=\"margin-top:.5em\">Pilihan bergantung pada <b>strategi</b>, <b>ukuran</b>, <b>teknologi</b>, dan <b>ketidakpastian lingkungan</b> <span class=\"cite\">(Robbins et al., 2024)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bentuk struktur</span><span>Indikator 3</span></div><h2>Bentuk struktur yang umum</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 170\" style=\"max-height:10em\" role=\"img\" aria-label=\"Empat bentuk struktur. Simple: pemilik langsung membawahi semua staf. Functional: pimpinan membawahi bagian keuangan, produksi, pemasaran. Divisional: pimpinan membawahi cabang A, B, C yang masing-masing punya fungsi sendiri. Matrix: staf dari bagian fungsional infrastruktur, pengembangan, data ditugaskan ke proyek 1 dan 2 sehingga punya dua atasan.\"><text x=\"105\" y=\"18\" text-anchor=\"middle\" class=\"s-hd\">SIMPLE</text><rect x=\"55\" y=\"30\" width=\"100\" height=\"26\" rx=\"4\" class=\"s-acc\"/><text x=\"105\" y=\"47\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Pemilik</text><line x1=\"105\" y1=\"56\" x2=\"28\" y2=\"96\" class=\"s-line\" style=\"stroke-width:1.5\"/><rect x=\"12\" y=\"96\" width=\"32\" height=\"22\" rx=\"3\"
